<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUK SATNAV 86 — Free UK navigation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--nav:#111a12;--nav2:#243426;--cream:#f5f7f1;--ink:#111711;--muted:#657064;--route:#1f7cff;--routeGlow:#8fc4ff;--white:#fff;--amber:#ffbd2e;--green:#42d27a;--red:#ff5d5d;--shadow:0 8px 30px rgba(0,0,0,.34)}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:var(--ink);overflow:hidden}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--nav);color:#fff}button.secondary{background:#e9ece3;color:var(--nav)}button.danger{background:#f1dfdb;color:#8d352b}
#map{position:absolute;inset:0;z-index:1;background:#cfd6c8}.map-3d{transform:perspective(900px) rotateX(12deg);transform-origin:center center}.leaflet-map-pane{transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}.leaflet-control-attribution{font-size:8px;background:rgba(255,255,255,.72)!important}.leaflet-tile{filter:saturate(.9) contrast(1.04)}
.leaflet-marker-icon{transition:transform .18s linear}.car-icon{z-index:900!important}.nav-arrow{width:42px;height:52px;position:relative;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}.nav-arrow:before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:43px solid #147cff}.nav-arrow:after{content:"";position:absolute;left:50%;top:14px;transform:translateX(-50%);width:9px;height:27px;border-radius:5px;background:#fff}.nav-arrow span{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:7px;height:29px;border-radius:4px;background:#0d55b8;z-index:2}.nav-arrow.active{filter:drop-shadow(0 0 9px rgba(20,124,255,.8))}
/* Dedicated-satnav driving UI */
.topbar{position:absolute;z-index:1200;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}.topbar>*{pointer-events:auto}.brand{background:rgba(255,255,255,.96);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);font-weight:950;letter-spacing:.6px;color:var(--nav)}.searchbox{flex:1;display:flex;gap:6px;background:rgba(255,255,255,.96);padding:5px;border-radius:10px;box-shadow:var(--shadow)}.searchbox input{flex:1;border:0;outline:0;padding:7px 9px;min-width:0}.searchbox button{padding:8px 12px}
.drive-ui{position:absolute;z-index:1300;left:0;right:0;top:0;bottom:0;pointer-events:none;display:none}.drive-ui>*{pointer-events:auto}
/* Large next manoeuvre panel, like a dedicated navigation unit */
.instruction{position:absolute;top:10px;left:10px;right:10px;background:linear-gradient(135deg,#0d58b9,#147cff);color:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(0,0,0,.42);min-height:104px;padding:10px 14px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.12);overflow:hidden}.instruction:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent 35%)}.arrow{font-size:60px;line-height:1;width:74px;text-align:center;font-weight:1000;color:#fff;text-shadow:0 3px 10px #063b82}.ins-main{flex:1;min-width:0;position:relative;z-index:1}.ins-main .big{font-size:25px;font-weight:1000;line-height:1.05;text-transform:uppercase;letter-spacing:.2px}.ins-main .sub{font-size:13px;color:#dce7dd;margin-top:7px;font-weight:750}.distance{font-size:30px;font-weight:1000;white-space:nowrap;color:#fff;position:relative;z-index:1}.distance:after{content:"";display:block;font-size:9px;color:#b9c7ba;letter-spacing:1px;text-align:right;margin-top:-3px}.routebar{position:absolute;top:116px;left:10px;right:10px;margin:0;background:rgba(8,13,9,.92);color:#fff;border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;display:flex;gap:14px;align-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.1)}.routebar span{font-size:11px;white-space:nowrap}.routebar b{font-size:13px}.routebar .nextroad{font-weight:850;flex:1;overflow:hidden;text-overflow:ellipsis;color:#dcebdc}.road-panel{position:absolute;right:10px;top:132px;background:rgba(255,255,255,.97);color:var(--nav);border-radius:14px;box-shadow:var(--shadow);padding:8px 11px;min-width:112px;text-align:center}.road-panel .road-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}.speed-limit{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}.speed-sign{width:38px;height:38px;border:4px solid #d51f2a;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;font-weight:1000}.road-panel .speed-source{font-size:8px;color:var(--muted);margin-top:2px}
/* Bottom dedicated-navigation information strip */
.bottom{position:absolute;z-index:1300;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.bottom>*{pointer-events:auto}.stats{display:flex;gap:6px;background:rgba(255,255,255,.97);padding:6px;border-radius:11px;box-shadow:var(--shadow)}.stat{min-width:82px;padding:4px 8px;border-right:1px solid #ddd}.stat:last-child{border-right:0}.stat b{display:block;font-size:17px}.stat small{color:var(--muted);font-size:10px;font-weight:700}.controls{display:flex;gap:7px}.round{width:46px;height:46px;padding:0;border-radius:50%;box-shadow:var(--shadow);background:rgba(255,255,255,.97);color:var(--nav);font-size:20px}
.panel{position:absolute;z-index:1400;left:10px;right:10px;bottom:70px;background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:62%;overflow:auto;display:none}.panel.show{display:block}.small{font-size:12px;color:var(--muted);line-height:1.45}.notice{background:#f3f5ed;border:1px solid #dce2d3;padding:10px;border-radius:10px;margin-top:9px}.item{padding:11px 0;border-bottom:1px solid #e4e7df}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1}.row{display:flex;gap:7px}.row>*{flex:1}.toast{position:absolute;z-index:1500;left:50%;transform:translateX(-50%);bottom:82px;background:#242a20;color:#fff;padding:10px 15px;border-radius:12px;box-shadow:var(--shadow);display:none;font-weight:800}.toast.show{display:block}.menu{position:absolute;z-index:1401;right:10px;bottom:70px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:7px;display:none;width:210px}.menu.show{display:block}.menu button{width:100%;margin:2px 0;text-align:left;background:#fff;color:var(--ink)}.menu button:hover{background:#edf0e7}
/* Dedicated road-arrow / lane-style cue */
.lane-cue{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;background:linear-gradient(#fff,#eef3ec);border-radius:18px;box-shadow:0 8px 26px #0006;padding:9px 18px;font-size:38px;font-weight:1000;color:var(--nav);display:none;min-width:180px;text-align:center;border:2px solid rgba(39,49,30,.18)}.lane-cue small{display:block;font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:1000;margin-top:-5px}.maneuver-strip{position:absolute;z-index:1301;left:10px;right:10px;top:184px;display:flex;gap:7px;align-items:stretch}.maneuver-card{flex:1;background:rgba(255,255,255,.96);border-radius:12px;box-shadow:var(--shadow);padding:7px 9px;min-width:0}.maneuver-card .m-arrow{font-size:25px;font-weight:1000;float:left;margin-right:7px}.maneuver-card .m-title{font-size:11px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.maneuver-card .m-road{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.maneuver-card.next{opacity:.82}.drive-progress{position:absolute;z-index:1301;left:10px;right:10px;top:246px;height:5px;background:rgba(255,255,255,.55);border-radius:9px;overflow:hidden}.drive-progress i{display:block;height:100%;background:#147cff;width:0%;border-radius:9px}
@media(min-width:800px){.panel{width:440px;right:auto}.topbar{left:18px;right:18px}.instruction{left:18px;right:18px}.routebar{left:18px;right:18px}.bottom{left:18px;right:18px}.lane-cue{bottom:82px}}
.lane-cue .lane-svg{display:flex;justify-content:center;gap:5px;align-items:end;height:54px}.lane-cue .lane-svg span{display:block;width:34px;height:45px;border:3px solid #9aa39a;border-bottom:0;border-radius:10px 10px 0 0;position:relative}.lane-cue .lane-svg span:after{content:"";position:absolute;left:50%;bottom:5px;width:8px;height:24px;transform:translateX(-50%);border-radius:5px;background:#9aa39a}.lane-cue .lane-svg span.active{border-color:#147cff}.lane-cue .lane-svg span.active:after{background:#147cff}.lane-cue .lane-svg span.left:before,.lane-cue .lane-svg span.right:before{content:"";position:absolute;top:8px;width:12px;height:12px;border-top:4px solid #147cff;border-left:4px solid #147cff}.lane-cue .lane-svg span.left:before{left:5px;transform:rotate(-45deg)}.lane-cue .lane-svg span.right:before{right:5px;transform:rotate(135deg)}
.exit-chip{display:inline-block;background:#fff;color:#172219;border-radius:999px;padding:4px 8px;font-size:11px;vertical-align:middle;letter-spacing:.4px}.route-highlight{filter:drop-shadow(0 0 5px #8fc4ff)}
.nav-settings{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}.nav-settings h3{margin:0 0 8px}.nav-settings label{display:block;font-size:12px;font-weight:800;margin:9px 0 4px}.nav-settings select,.nav-settings input[type=number]{width:100%;padding:9px;border:1px solid #d7dbd1;border-radius:9px;background:#fff}.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e4e7df}.poi-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.poi-grid button{background:#eef1e9;color:var(--nav)}.offline-note{font-size:11px;background:#f3f5ed;border-radius:9px;padding:9px;margin-top:9px;color:#4e5747}.camera-note{font-size:11px;color:var(--muted);margin-top:7px}@media(max-width:520px){.instruction{min-height:78px}.ins-main .big{font-size:20px}.distance{font-size:23px}}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div class="topbar"><div class="brand">MUK SATNAV 86</div><div class="searchbox"><input id="q" placeholder="Search UK address or postcode"><button onclick="find()">Find</button></div></div>
<div id="driveUI" class="drive-ui" style="display:none"><div id="instruction" class="instruction"></div><div id="routebar" class="routebar"></div><div id="roadPanel" class="road-panel"></div><div id="maneuverStrip" class="maneuver-strip"></div><div id="driveProgress" class="drive-progress"><i></i></div><div id="laneCue" class="lane-cue"></div></div>
<div id="panel" class="panel"></div>
<div id="toast" class="toast"></div>
<div id="menu" class="menu"></div>
<div class="bottom"><div id="stats" class="stats" style="display:none"></div><div class="controls"><button id="recenter" class="round" onclick="recenter()" title="Recenter">⌖</button><button class="round" onclick="toggleMenu()" title="Menu">☰</button></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false}).setView([54.5,-3.4],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routeLayer=null,routeGlow=null,myMarker=null,destMarker=null,current=null,watchId=null,routeSteps=[],stepIndex=0,routeGeo=null,routeMeta=null,voiceOn=true,driveMode=false,lastPos=null,lastReroute=0,offRouteSince=0,wrongWaySince=0,announced={},trafficCache=[],trafficFetchedAt=0,heading=null;
const P=document.getElementById('panel'),UI=document.getElementById('driveUI'),INS=document.getElementById('instruction'),RB=document.getElementById('routebar'),ST=document.getElementById('stats'),TOAST=document.getElementById('toast'),MENU=document.getElementById('menu'),LANE=document.getElementById('laneCue'),ROAD=document.getElementById('roadPanel'),MSTRIP=document.getElementById('maneuverStrip'),PROG=document.querySelector('#driveProgress i');
let mapHeading=0,lastRenderHeading=null,lastSpeedLimit=null,speedLimitDistance=Infinity,lastSpeedFetch=0,routeCum=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>JSON.parse(localStorage.getItem('muk86.saved')||'[]'); const save=a=>localStorage.setItem('muk86.saved',JSON.stringify(a));
function show(x){P.innerHTML=x;P.classList.add('show')} function hide(){P.classList.remove('show')}
function toast(x){TOAST.textContent=x;TOAST.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>TOAST.classList.remove('show'),3000)}
function showNavSettings(){show(`<div class="nav-settings"><h3>Navigation settings</h3><label>Voice language</label><select id="voiceLang" onchange="localStorage.setItem('muk86.voiceLang',this.value)"><option value="en-GB">English (UK)</option><option value="en-IE">English (Ireland)</option><option value="fr-FR">Français</option><option value="de-DE">Deutsch</option><option value="es-ES">Español</option></select><div class="toggle-row"><span>Speed-camera alerts</span><input id="camAlerts" type="checkbox" checked onchange="localStorage.setItem('muk86.camAlerts',this.checked)"></div><div class="toggle-row"><span>Driving map</span><b>Direction-up</b></div><div class="toggle-row"><span>2D / 3D browse view</span><button onclick="toggleMapView()">Switch view</button></div><div class="toggle-row"><span>Offline mode</span><input id="offlineMode" type="checkbox" onchange="localStorage.setItem('muk86.offlineMode',this.checked)"></div><div class="offline-note">Offline mode is prepared in the navigation interface, but this browser build does not yet contain bundled UK/Europe map datasets. Live routing currently uses online map/routing services.</div><div class="poi-grid"><button onclick="poiSearch('fuel')">⛽ Fuel</button><button onclick="poiSearch('parking')">🅿️ Parking</button><button onclick="poiSearch('restaurant')">🍴 Food</button><button onclick="poiSearch('hospital')">🏥 Hospital</button></div><div class="camera-note">Camera feature remains unchanged.</div></div>`)}
function showVehicleProfile(){show(`<div class="nav-settings"><h3>Vehicle profile</h3><label>Vehicle type</label><select id="vehicleType"><option>Car</option><option>Van</option><option>HGV / Truck</option><option>Bus / Coach</option><option>Taxi</option></select><label>Height (metres)</label><input id="vehHeight" type="number" step="0.1" value="2.0"><label>Weight (tonnes)</label><input id="vehWeight" type="number" step="0.1" value="3.5"><label>Width (metres)</label><input id="vehWidth" type="number" step="0.1" value="2.0"><div class="toggle-row"><span>Avoid low bridges</span><input id="avoidBridge" type="checkbox" checked></div><div class="toggle-row"><span>Avoid weight-restricted roads</span><input id="avoidWeight" type="checkbox" checked></div><div class="small">These settings are stored for future restriction-aware routing. Current OSRM routing does not guarantee every UK restriction is encoded.</div><div class="actions"><button onclick="saveVehicleProfile()">Save profile</button></div></div>`)}
function saveVehicleProfile(){const p={type:document.getElementById('vehicleType').value,height:+document.getElementById('vehHeight').value,weight:+document.getElementById('vehWeight').value,width:+document.getElementById('vehWidth').value,avoidBridge:document.getElementById('avoidBridge').checked,avoidWeight:document.getElementById('avoidWeight').checked};localStorage.setItem('muk86.vehicle',JSON.stringify(p));toast('Vehicle profile saved');hide()}
function toggleMapView(){if(driveMode){toast('Driving view is direction-up; stop navigation to switch 2D/3D');return}document.getElementById('map').classList.toggle('map-3d');toast('Map view switched')}
async function poiSearch(type){if(!lastPos){toast('Start GPS navigation first');return}try{const q=`[out:json][timeout:8];node(around:3000,${lastPos.lat},${lastPos.lon})[amenity=${type}];out 8;`;const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));const j=await r.json();show('<b>Nearby '+esc(type)+'</b>'+((j.elements||[]).map(e=>`<div class="item"><b>${esc(e.tags?.name||type)}</b><div class="small">${e.lat.toFixed(5)}, ${e.lon.toFixed(5)}</div><button onclick="routeTo({lat:${e.lat},lon:${e.lon},name:${JSON.stringify(e.tags?.name||type)})}">Route</button></div>`).join('')||'<div class="small">None found nearby.</div>'))}catch(e){toast('POI search unavailable')}}
function toggleMenu(){MENU.classList.toggle('show');MENU.innerHTML=`<button onclick="newRoute();toggleMenu()">🚗 New route</button><button onclick="showSaved();toggleMenu()">🏷️ Saved places</button><button onclick="toggleVoice();toggleMenu()">${voiceOn?'🔊 Voice on':'🔇 Voice off'}</button><button onclick="showNavSettings();toggleMenu()">⚙️ Navigation settings</button><button onclick="showVehicleProfile();toggleMenu()">🚚 Vehicle profile</button><button onclick="stopNavigation();toggleMenu()">⏹ Stop navigation</button>`}
function formatDistance(m){if(m<1000)return Math.max(5,Math.round(m/5)*5)+' yd';return (m/1609.344).toFixed(m<16093?1:0)+' mi'}
function speak(t){if(!voiceOn||!('speechSynthesis'in window)||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=localStorage.getItem('muk86.voiceLang')||'en-GB';u.rate=.96;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
function bearing(a,b){const r=Math.PI/180,la=a.lat*r,lb=b.lat*r,dl=(b.lon-a.lon)*r;return (Math.atan2(Math.sin(dl)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dl))*180/Math.PI+360)%360}
function angleDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d}
function hav(a,b){const R=6371000,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lon-a.lon)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function nearestOnRoute(p){if(!routeGeo?.coordinates?.length)return {d:Infinity,index:0};let best={d:Infinity,index:0};for(let i=0;i<routeGeo.coordinates.length;i++){const c=routeGeo.coordinates[i],q={lat:c[1],lon:c[0]},d=hav(p,q);if(d<best.d)best={d,index:i,point:q}}return best}
function routeBearingAt(index){if(!routeGeo?.coordinates?.length)return null;const cs=routeGeo.coordinates;const i=Math.min(Math.max(index,0),cs.length-2);return bearing({lat:cs[i][1],lon:cs[i][0]},{lat:cs[i+1][1],lon:cs[i+1][0]})}
function maneuverLabel(st){const m=st?.maneuver||{};const t=m.type||'';const mod=m.modifier||'';if(t==='arrive')return 'You have arrived';if(t==='depart')return 'Continue ahead';if(t==='roundabout'||t==='rotary'){const ex=m.exit||st?.exit;if(ex)return `Take the ${ordinal(ex)} exit`;return mod==='left'?'Take the roundabout left':'Take the roundabout';}if(t==='fork')return mod==='left'?'Keep left':'Keep right';if(t==='merge')return mod==='left'?'Merge left':'Merge right';if(t==='on ramp')return mod==='left'?'Take the slip road left':'Take the slip road right';if(t==='off ramp')return mod==='left'?'Take the exit left':'Take the exit right';if(t==='new name')return 'Continue';if(mod==='left')return 'Turn left';if(mod==='right')return 'Turn right';if(mod==='slight left')return 'Keep left';if(mod==='slight right')return 'Keep right';if(mod==='sharp left')return 'Turn sharp left';if(mod==='sharp right')return 'Turn sharp right';return 'Continue ahead'}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function stepDistance(st){return Math.max(0,st?st._distance||st.distance||0:0)}
function roadName(st){return st?.name||st?.ref||''}
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search service unavailable');return r.json()}
async function find(){const q=document.getElementById('q').value.trim();if(!q)return;show('<b>Searching…</b>');try{const d=await geo(q);if(!d.length){show('<b>No UK result found</b><div class="small">Try a full address or postcode.</div>');return}show(d.map(x=>`<div class="item"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='selectPlace(${JSON.stringify(x)})'>Select</button><button class="secondary" onclick='routeTo(${JSON.stringify(x)})'>Route</button></div></div>`).join(''))}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function selectPlace(x){current={lat:+x.lat,lon:+x.lon,name:x.display_name};map.setView([current.lat,current.lon],17);if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([current.lat,current.lon]).addTo(map);show(`<b>${esc(current.name.split(',')[0])}</b><div class="small">${esc(current.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(current)})'>🚗 Route here</button><button class="secondary" onclick='savePlace(${JSON.stringify(current)})'>Save</button></div>`)}
function savePlace(p){let a=saved();if(!a.some(x=>hav(x,p)<15))a.push({...p,id:Date.now()});save(a);toast('Place saved');}
function showSaved(){const a=saved();show('<b>Saved places</b>'+ (a.length?a.map(x=>`<div class="item"><b>${esc(x.name.split(',')[0])}</b><div class="small">${esc(x.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(x)})'>Route</button><button class="danger" onclick='deleteSaved(${x.id})'>Delete</button></div></div>`).join(''):'<div class="small">Nothing saved yet.</div>'))}
function deleteSaved(id){save(saved().filter(x=>x.id!==id));showSaved()}
function newRoute(){current=null;hide();document.getElementById('q').focus()}
function routeTo(p){current={lat:+p.lat,lon:+p.lon,name:p.name||p.display_name};useLocationForRoute()}
function useLocationForRoute(){if(!navigator.geolocation){manualStart();return}show('<b>Getting your location…</b><div class="small">High-accuracy GPS is required for live navigation.</div>');navigator.geolocation.getCurrentPosition(async pos=>{try{await buildRoute({lat:pos.coords.latitude,lon:pos.coords.longitude},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}},()=>manualStart(),{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function manualStart(){show(`<b>Starting point</b><div class="searchbox" style="box-shadow:none;border:1px solid #ddd;margin-top:8px"><input id="start" placeholder="Start postcode or address"><button onclick="manualRoute()">Go</button></div>`)}
async function manualRoute(){const q=document.getElementById('start').value.trim();if(!q)return;try{const d=await geo(q);if(!d.length)throw Error('Starting point not found');await buildRoute({lat:+d[0].lat,lon:+d[0].lon},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
function parseSpeedLimit(tags, vehicle='car'){
 const t=tags||{}; let raw=t['maxspeed:'+vehicle]||t.maxspeed||''; raw=String(raw).toLowerCase().trim();
 if(!raw)return null;
 if(raw==='gb:nsl_single')return 60; if(raw==='gb:nsl_dual'||raw==='gb:motorway')return 70; if(raw==='gb:nsl_restricted')return 30; if(raw==='gb-wls:nsl_restricted')return 20;
 const m=raw.match(/(\d+(?:\.\d+)?)/); if(!m)return null; let n=+m[1]; if(/km\/?h|kph/.test(raw))n=n*0.621371; return Math.round(n);
}
async function fetchCurrentSpeedLimit(p){
 if(Date.now()-lastSpeedFetch<8000)return; lastSpeedFetch=Date.now();
 try{
  const bbox=`${p.lat-0.0028},${p.lon-0.0038},${p.lat+0.0028},${p.lon+0.0038}`;
  const q=`[out:json][timeout:8];way[highway](${bbox});out tags geom;`;
  const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q)); if(!r.ok)return;
  const j=await r.json(); let best=null;
  const currentStep=routeSteps[stepIndex]; const targetName=(currentStep?.name||'').trim().toLowerCase(); const targetRef=(currentStep?.ref||'').trim().toLowerCase();
  for(const e of j.elements||[]){
   const geom=e.geometry||[]; if(!geom.length)continue;
   let d=Infinity, idx=0; for(let i=0;i<geom.length;i++){const dd=hav(p,{lat:geom[i].lat,lon:geom[i].lon});if(dd<d){d=dd;idx=i;}} if(d>100)continue;
   const lim=parseSpeedLimit(e.tags); if(lim===null)continue;
   let score=d; const name=String(e.tags?.name||'').trim().toLowerCase(), ref=String(e.tags?.ref||'').trim().toLowerCase();
   if(targetName&&name&&targetName===name)score-=45; if(targetRef&&ref&&targetRef===ref)score-=35;
   if(p.heading!=null&&geom.length>1){const j2=Math.min(idx+1,geom.length-1);const rh=bearing({lat:geom[idx].lat,lon:geom[idx].lon},{lat:geom[j2].lat,lon:geom[j2].lon});const ad=angleDiff(p.heading,rh); if(ad>100)score+=45; else if(ad>60)score+=18;}
   if(!best||score<best.score)best={limit:lim,distance:d,name:e.tags?.name||e.tags?.ref||'',type:e.tags?.['maxspeed:type']||'',score};
  }
  if(best){lastSpeedLimit=best.limit;speedLimitDistance=best.distance;} else {lastSpeedLimit=null;speedLimitDistance=Infinity;}
 }catch(e){}
}
async function buildRoute(a,dest,startLive=false){const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=true`;const r=await fetch(u);if(!r.ok)throw Error('Routing service unavailable');const j=await r.json();if(j.code!=='Ok')throw Error('No driving route found');const rt=j.routes[0];routeMeta={distance:rt.distance,duration:rt.duration};routeGeo=rt.geometry;lastSpeedLimit=null;speedLimitDistance=Infinity;lastRenderHeading=null;routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]);stepIndex=0;let cum=0;routeSteps.forEach(s=>{s._startDist=cum;s._distance=s.distance||0;cum+=s.distance||0});routeCum=[];if(routeGeo?.coordinates?.length){let rc=0;routeCum[0]=0;for(let i=1;i<routeGeo.coordinates.length;i++){rc+=hav({lat:routeGeo.coordinates[i-1][1],lon:routeGeo.coordinates[i-1][0]},{lat:routeGeo.coordinates[i][1],lon:routeGeo.coordinates[i][0]});routeCum[i]=rc;}}if(routeLayer)map.removeLayer(routeLayer);if(routeGlow)map.removeLayer(routeGlow);
 routeGlow=L.geoJSON(rt.geometry,{style:{color:'#ffffff',weight:13,opacity:.72,lineCap:'round',lineJoin:'round'}}).addTo(map);
 routeLayer=L.geoJSON(rt.geometry,{style:{color:'#1f7cff',weight:8,opacity:.98,lineCap:'round',lineJoin:'round',className:'route-highlight'}}).addTo(map);
 routeLayer.bringToFront();if(destMarker)destMarker.setLatLng([dest.lat,dest.lon]);else destMarker=L.marker([dest.lat,dest.lon]).addTo(map);if(!myMarker)myMarker=L.marker([a.lat,a.lon],{icon:carIcon()}).addTo(map);else myMarker.setLatLng([a.lat,a.lon]);map.fitBounds(routeLayer.getBounds(),{padding:[70,70]});driveMode=true;UI.style.display='block';renderDrive(a);if(startLive)startTracking();speak('Route planned. '+formatDistance(rt.distance)+' to go. '+announcementForStep(routeSteps[0],true));}
function carIcon(){return L.divIcon({className:'car-icon',html:'<div class="nav-arrow active"><span></span></div>',iconSize:[42,52],iconAnchor:[21,26]})}
function smoothHeading(next){if(next==null||!Number.isFinite(next))return mapHeading; if(mapHeading==null||!Number.isFinite(mapHeading))return next; const diff=((next-mapHeading+540)%360)-180; const step=Math.max(-12,Math.min(12,diff)); return (mapHeading+step+360)%360;}
function applyMapHeading(h){if(!driveMode||h==null||!Number.isFinite(h))return;mapHeading=smoothHeading(h);const pane=map.getPane('mapPane');if(pane){pane.style.transformOrigin='50% 50%';pane.style.rotate=`${-mapHeading}deg`;}if(lastRenderHeading===null||angleDiff(lastRenderHeading,mapHeading)>2){lastRenderHeading=mapHeading;}}
function followVehicle(p){if(!driveMode)return;const z=Math.max(17,map.getZoom());map.setView([p.lat,p.lon],z,{animate:false});applyMapHeading(p.heading??mapHeading);const offset=120;const r=(mapHeading||0)*Math.PI/180;const dx=Math.sin(r)*offset,dy=-Math.cos(r)*offset;map.panBy([dx,dy],{animate:false});}
function announcementForStep(st,initial=false){if(!st)return '';const label=maneuverLabel(st),name=roadName(st);if(st.maneuver?.type==='arrive')return 'You have arrived at your destination.';if(st.maneuver?.type==='roundabout'||st.maneuver?.type==='rotary')return `${initial?'':'At the roundabout, '}${label.toLowerCase()}${name?' onto '+name:''}.`;return `${label}${name?' onto '+name:''}.`}
function nextTurnIndex(){for(let i=stepIndex;i<routeSteps.length;i++){const t=routeSteps[i]?.maneuver?.type;if(t!=='depart'&&t!=='new name'&&t!=='notification')return i}return routeSteps.length-1}
function stepArrow(st){const t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';if(t==='roundabout'||t==='rotary')return '↻';if(t==='arrive')return '🏁';if(t==='fork')return m.includes('left')?'↙':'↘';if(t==='merge')return m.includes('left')?'↙':'↘';if(m==='sharp left')return '↙';if(m==='sharp right')return '↘';if(m==='slight left')return '↖';if(m==='slight right')return '↗';if(m==='left')return '←';if(m==='right')return '→';return '↑'}
function renderDrive(p){
 const st=routeSteps[stepIndex];if(!st)return;
 const d=stepDistance(st),label=maneuverLabel(st),name=roadName(st),m=st.maneuver?.modifier||'',type=st.maneuver?.type||'';
 const arrow=stepArrow(st),exitNo=(type==='roundabout'||type==='rotary')&&st.maneuver?.exit?`<span class="exit-chip">${ordinal(st.maneuver.exit)} EXIT</span>`:'';
 INS.innerHTML=`<div class="arrow">${arrow}</div><div class="ins-main"><div class="big">${esc(label)} ${exitNo}</div><div class="sub">${name?esc(name):(type==='roundabout'?'Roundabout ahead':'Follow the highlighted blue route')}</div></div><div class="distance">${formatDistance(d)}</div>`;
 RB.innerHTML=`<span><b>${formatDistance(routeMeta.distance)}</b> remaining</span><span><b>${Math.max(1,Math.round(routeMeta.duration/60))} min</b> ETA ${new Date(Date.now()+routeMeta.duration*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span><span class="nextroad">${esc(name||current?.name?.split(',')[0]||'Destination')}</span>`;
 const speed=Math.round((lastPos?.speed||0)*2.23694);
 ST.style.display='flex';ST.innerHTML=`<div class="stat"><b>${speed} mph</b><small>YOUR SPEED</small></div><div class="stat"><b>${lastSpeedLimit!=null?lastSpeedLimit+' mph':'—'}</b><small>SPEED LIMIT</small></div><div class="stat"><b>${formatDistance(routeMeta.distance)}</b><small>REMAINING</small></div><div class="stat"><b>${Math.max(1,Math.round(routeMeta.duration/60))} min</b><small>ETA</small></div>`;
 const road= name || current?.name?.split(',')[0] || 'Road ahead'; ROAD.innerHTML=`<div class="road-name">${esc(road)}</div><div class="speed-limit">${lastSpeedLimit!=null?`<div class="speed-sign">${lastSpeedLimit}</div><b>mph</b>`:'<div class="small">Speed limit<br>not mapped</div>'}</div><div class="speed-source">${lastSpeedLimit!=null?'Mapped road limit':'Check roadside signs'}${speedLimitDistance<90&&lastSpeedLimit!=null?' · current road':''}</div>`;
 const nextIdx=nextTurnIndex(); const next=routeSteps[nextIdx+1];
 const cards=[{st,label:'NOW'},{st:next,label:'NEXT'}].filter(x=>x.st).map((x,i)=>`<div class="maneuver-card ${i?'next':''}"><div class="m-arrow">${stepArrow(x.st)}</div><div class="m-title">${esc(i?maneuverLabel(x.st):label)}</div><div class="m-road">${esc(roadName(x.st)||'Follow route')}</div></div>`).join('');
 MSTRIP.innerHTML=cards;
 const total=routeMeta?.distance||1, nearForProgress=nearestOnRoute(p), progressed=routeCum[nearForProgress.index]??0; if(PROG)PROG.style.width=Math.min(100,Math.max(0,(progressed/total)*100))+'%';
 let laneHtml=''; if(type==='roundabout'||type==='rotary'){laneHtml=`<div class="roundabout-big">↻</div><b>${st.maneuver?.exit?ordinal(st.maneuver.exit)+' EXIT':'ROUNDABOUT'}</b>`;}else{const activeLeft=m.includes('left'),activeRight=m.includes('right');laneHtml=`<div class="lane-svg"><span class="${activeLeft?'active left':''}"></span><span class="${!activeLeft&&!activeRight?'active':''}"></span><span class="${activeRight?'active right':''}"></span></div>`;} LANE.innerHTML=`${laneHtml}<small>${type==='roundabout'||type==='rotary'?'ROUNDABOUT GUIDANCE':'LANE / TURN GUIDANCE'}</small>`;LANE.style.display='block';
}
function startTracking(){if(!navigator.geolocation)return;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:1000,timeout:12000});toast('Live navigation started')}
function stopNavigation(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}driveMode=false;const pane=map.getPane('mapPane');if(pane){pane.style.rotate='';pane.style.transformOrigin='50% 50%';}lastRenderHeading=null;mapHeading=0;UI.style.display='none';ST.style.display='none';if('speechSynthesis'in window)speechSynthesis.cancel();toast('Navigation stopped')}
function recenter(){if(lastPos){if(driveMode)followVehicle(lastPos);else map.setView([lastPos.lat,lastPos.lon],17,{animate:true});}}
function onPositionError(e){if(e.code===1)toast('Allow Location for MUK SATNAV 86');else toast('GPS signal unavailable')}
async function onPosition(pos){
 const raw={lat:pos.coords.latitude,lon:pos.coords.longitude};raw.accuracy=pos.coords.accuracy||999;raw.speed=Number.isFinite(pos.coords.speed)&&pos.coords.speed>=0?pos.coords.speed:0;
 let h=Number.isFinite(pos.coords.heading)?pos.coords.heading:null;
 if(h===null&&lastPos)h=bearing(lastPos,raw);
 if(raw.accuracy>80&&lastPos&&hav(lastPos,raw)<25){raw.lat=lastPos.lat;raw.lon=lastPos.lon;} if(h==null&&lastPos?.heading!=null&&raw.speed<2.2) h=lastPos.heading;
 const p={...raw,heading:h};lastPos=p;heading=h;
 if(!myMarker)myMarker=L.marker([p.lat,p.lon],{icon:carIcon(),interactive:false}).addTo(map);else myMarker.setLatLng([p.lat,p.lon]);
 if(driveMode){followVehicle(p);}else{map.setView([p.lat,p.lon],Math.max(16,map.getZoom()),{animate:true});}
 if(!routeSteps.length)return;
 fetchCurrentSpeedLimit(p);
 await navigationEngine(p);
 renderDrive(p);
}
async function navigationEngine(p){const near=nearestOnRoute(p);if(near.d>70){if(!offRouteSince)offRouteSince=Date.now();if(Date.now()-offRouteSince>2500 && Date.now()-lastReroute>12000){toast('Off route — recalculating');speak('You are off route. Recalculating.');lastReroute=Date.now();try{await buildRoute(p,current,true);offRouteSince=0;return}catch(e){toast('Unable to recalculate right now')}}}else offRouteSince=0;
 const rb=routeBearingAt(near.index);
 if(p.heading!=null&&near.d<55&&rb!=null&&angleDiff(p.heading,rb)>120&&((p.speed||0)>2||lastPos)){if(!wrongWaySince)wrongWaySince=Date.now();if(Date.now()-wrongWaySince>2200&&Date.now()-lastReroute>12000){toast('Wrong direction — recalculating');speak('You are travelling the wrong way. Recalculating.');lastReroute=Date.now();try{await buildRoute(p,current,true);wrongWaySince=0;return}catch(e){}}}else wrongWaySince=0;
 const st=routeSteps[stepIndex];if(!st)return;const loc=st.maneuver?.location;if(loc){const sd=hav(p,{lat:loc[1],lon:loc[0]});if(sd<35 && stepIndex<routeSteps.length-1){stepIndex++;const n=routeSteps[stepIndex];const key='step'+stepIndex;if(!announced[key]){announced[key]=1;speak(announcementForStep(n));}renderDrive(p);return}}
 const distTo=loc?hav(p,{lat:loc[1],lon:loc[0]}):99999;const type=st.maneuver?.type;const key='warn'+stepIndex;const thresholds=type==='roundabout'||type==='rotary'?[450,180,45]:[300,120,35];if(distTo<thresholds[0]&&!announced[key+'a']){announced[key+'a']=1;let text=type==='roundabout'||type==='rotary'?`Approaching roundabout in ${formatDistance(distTo)}. ${mannerRoundabout(st)}`:`Approaching junction in ${formatDistance(distTo)}. ${manner(st)}${roadName(st)?' onto '+roadName(st):''}.`;speak(text)}if(distTo<thresholds[1]&&!announced[key+'b']){announced[key+'b']=1;speak(type==='roundabout'||type==='rotary'?mannerRoundabout(st):`${manner(st)} in ${formatDistance(distTo)}.`)}if(distTo<thresholds[2]&&!announced[key+'c']){announced[key+'c']=1;speak(type==='roundabout'||type==='rotary'?mannerRoundabout(st):manner(st)+' now.')}
 await trafficLightAlert(p);renderDrive(p);if(type==='arrive'&&distTo<35){speak('You have arrived at your destination.');toast('You have arrived');stopNavigation()}}
function manner(st){return maneuverLabel(st).toLowerCase()}
function mannerRoundabout(st){const ex=st.maneuver?.exit;return ex?`take the ${ordinal(ex)} exit`:'take the correct exit'}
async function trafficLightAlert(p){if(Date.now()-trafficFetchedAt>30000){try{const q=`[out:json][timeout:8];node(around:180,${p.lat},${p.lon})[highway=traffic_signals];out;`;const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(r.ok){const j=await r.json();trafficCache=(j.elements||[]).map(e=>({lat:e.lat,lon:e.lon}));trafficFetchedAt=Date.now()}}catch(e){}}if(!trafficCache.length||p.heading==null)return;for(const l of trafficCache){const d=hav(p,l);if(d>25&&d<180){const b=bearing(p,l);if(angleDiff(p.heading,b)<35){const near=nearestOnRoute(l);const carNear=nearestOnRoute(p);if(near.d<45&&near.index>=carNear.index){const key='light'+Math.round(l.lat*1e5)+'_'+Math.round(l.lon*1e5);if(!announced[key]){announced[key]=1;speak(`Traffic lights ahead in ${formatDistance(d)}.`)}return}}}}}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
</script>
