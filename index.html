<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAPSUK — 3D Driving Navigation</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<style>
:root{--olive:#657449;--dark:#465033;--bg:#f4f4ed;--card:#fff;--muted:#687064;--line:#dfe2d8;--shadow:0 5px 24px #0004}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{background:var(--bg);color:#20251d;overflow:hidden}button,input{font:inherit}
header{position:absolute;z-index:1200;top:0;left:0;right:0;background:linear-gradient(#465033f2,#465033e8);color:#fff;padding:10px 12px 12px;backdrop-filter:blur(8px)}
.brand{font-weight:900;font-size:22px;letter-spacing:.3px}.tag{font-size:12px;opacity:.85}.search{display:flex;gap:7px;margin-top:8px}.search input{flex:1;padding:11px;border-radius:11px;border:0;min-width:0;background:#fff;color:#20251d}.search button{padding:10px 14px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:750;background:var(--olive);color:#fff;cursor:pointer}button.secondary{background:#edf0e7;color:var(--dark)}button.danger{background:#eee5e2;color:#6a3e35}
#map{position:absolute;inset:0;background:#dce5d4}.maplibregl-canvas{image-rendering:auto}.maplibregl-ctrl-bottom-right{bottom:74px}.maplibregl-ctrl-attrib{font-size:10px}
.panel{position:absolute;z-index:1300;left:10px;right:10px;bottom:68px;background:var(--card);border-radius:15px;padding:13px;box-shadow:var(--shadow);max-height:47%;overflow:auto;display:none}.panel.show{display:block}.item{padding:11px 0;border-bottom:1px solid var(--line)}.small{font-size:12px;color:var(--muted);line-height:1.4}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1}.notice{background:#f7f8f2;border:1px solid var(--line);padding:9px;border-radius:10px;margin-top:9px;font-size:12px}.badge{display:inline-block;background:#edf0e7;color:var(--dark);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.nav{position:absolute;z-index:1300;bottom:8px;left:8px;right:8px;background:#fff;border-radius:14px;padding:5px;display:flex;box-shadow:0 2px 15px #0004}.nav button{flex:1;background:#fff;color:var(--dark);font-size:12px}.nav button.active{background:#edf0e7}
#satbar{position:absolute;z-index:1250;top:86px;left:8px;right:8px;pointer-events:none}.satcard{margin:auto;background:#fff;border-radius:15px;padding:8px 12px;box-shadow:var(--shadow);max-width:94%;display:none;text-align:center}.satcard.show{display:block}.satmain{font-size:19px;font-weight:900;color:var(--dark)}.satmeta{font-size:11px;color:var(--muted);margin-top:2px}.alert{margin-top:6px;padding:7px 9px;border-radius:9px;background:#f7f8f2;border:1px solid var(--line);font-size:12px;font-weight:800}
#turnbar{position:absolute;z-index:1250;top:145px;left:8px;right:8px;pointer-events:none;display:none}.turncard{background:#fff;border-radius:16px;padding:9px 13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;max-width:520px;margin:auto}.turnicon{font-size:30px;width:42px;text-align:center}.turndistance{font-size:24px;font-weight:900;color:var(--dark);line-height:1}.turninstruction{font-size:14px;font-weight:850}.turnroad{font-size:11px;color:var(--muted)}
.car-wrap{width:44px;height:52px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px #0005)}.car-arrow{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:28px solid #657449;border-top:0;position:relative;transform-origin:50% 70%}.car-arrow:after{content:"";position:absolute;left:-5px;top:7px;width:10px;height:14px;background:#fff;clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.9}
.drive-tools{position:absolute;z-index:1250;right:9px;bottom:78px;display:flex;flex-direction:column;gap:7px}.drive-tools button{width:44px;height:44px;border-radius:50%;padding:0;background:#fff;color:var(--dark);box-shadow:0 2px 12px #0004;font-size:18px}.drive-tools button.active{background:var(--dark);color:#fff}
#status{position:absolute;z-index:1250;left:9px;bottom:78px;background:#fff;border-radius:12px;padding:7px 9px;box-shadow:0 2px 12px #0004;font-size:11px;color:var(--muted);max-width:70%}
@media(min-width:800px){.panel{width:440px;right:auto}.nav{width:440px;right:auto}.drive-tools{right:18px}.turncard{max-width:620px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">MAPSUK</div><div class="tag">3D driving view • free • privacy-first</div><div class="search"><input id="q" placeholder="Search UK address, postcode, town or place" autocomplete="off"><button onclick="find()">Find</button></div></header>
<div id="map"></div>
<div id="satbar"><div id="satcard" class="satcard" aria-live="polite"></div></div>
<div id="turnbar"><div id="turncard" class="turncard"></div></div>
<div id="panel" class="panel"></div>
<div class="drive-tools"><button id="modeBtn" title="3D driving view" onclick="toggleDriveMode()">3D</button><button title="Recenter" onclick="recenter()">◎</button><button title="Voice" onclick="toggleVoice()">🔊</button></div>
<div id="status">Ready</div>
<div class="nav"><button class="active" onclick="tab('find',this)">📍 Find</button><button onclick="tab('route',this)">🚗 Route</button><button onclick="tab('saved',this)">🏷️ Saved</button><button onclick="tab('scan',this)">📷 Scan</button></div>
</div>
<script src="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>JSON.parse(localStorage.getItem('mapsuk.saved')||'[]'); const save=a=>localStorage.setItem('mapsuk.saved',JSON.stringify(a));
const P=document.getElementById('panel'),statusEl=document.getElementById('status'),sat=document.getElementById('satcard'),turnbar=document.getElementById('turnbar'),turn=document.getElementById('turncard');
let map,pin=null,carMarker=null,current=null,destination=null,routeData=null,routeSteps=[],stepIndex=0,watchId=null,voiceOn=true,driveMode=true,lastLat=null,lastLon=null,lastHeading=0,lastGps=null,offCount=0,roadInfo=null,nearbyFeatures=[],lastFeatureFetch=0,arrived=false,lastAnnouncedStep=-1,mapReady=null,mapLoaded=false;
function show(x){P.innerHTML=x;P.classList.add('show')} function hide(){P.classList.remove('show')} function activate(b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}
function setStatus(x){statusEl.textContent=x}
function formatDistance(m){return m>=1609.344?(m/1609.344).toFixed(1)+' miles':Math.max(1,Math.round(m*1.09361))+' yards'}
function distanceMetres(a,b,c,d){const R=6371000,r=Math.PI/180,da=(c-a)*r,db=(d-b)*r;const x=Math.sin(da/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(db/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bearing(a,b,c,d){const r=Math.PI/180,y=Math.sin((d-b)*r)*Math.cos(c*r),x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return (Math.atan2(y,x)*180/Math.PI+360)%360}
function initMap(){mapReady=new Promise(resolve=>{map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-3.4,54.5],zoom:5.7,pitch:driveMode?55:0,bearing:0,attributionControl:{compact:true},canvasContextAttributes:{antialias:true}});map.addControl(new maplibregl.NavigationControl({showCompass:true}), 'top-right');map.once('load',()=>{mapLoaded=true;setStatus('HD 3D map ready');add3DBuildings();resolve();});});}
function add3DBuildings(){try{const layers=map.getStyle().layers||[];const sourceLayer=layers.find(l=>l['source-layer']==='building');if(!sourceLayer)return;map.addLayer({id:'mapsuk-3d-buildings',type:'fill-extrusion',source:sourceLayer.source,'source-layer':sourceLayer['source-layer'],minzoom:15,paint:{'fill-extrusion-color':['interpolate',['linear'],['get','render_height'],0,'#c9cec2',80,'#8d977f'],'fill-extrusion-height':['get','render_height'],'fill-extrusion-base':['get','render_min_height'],'fill-extrusion-opacity':0.78}},sourceLayer.id);}catch(e){}}
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search service unavailable');return r.json()}
async function reverse(lat,lon){const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);if(!r.ok)throw Error('Location lookup unavailable');return r.json()}
async function find(){const q=document.getElementById('q').value.trim();if(!q)return;try{show('<b>Searching…</b>');const a=await geo(q);if(!a.length){show('<b>No UK result found</b>');return}show('<b>Choose destination</b>'+a.map((x,i)=>`<div class="item"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='selectPlace(${JSON.stringify(x)})'>Use</button></div></div>`).join(''));}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function selectPlace(x){const p={lat:+x.lat,lon:+x.lon,name:x.display_name};current=p;destination=p;map.flyTo({center:[p.lon,p.lat],zoom:16,pitch:0,bearing:0,duration:700});if(pin)pin.remove();pin=new maplibregl.Marker({color:'#657449'}).setLngLat([p.lon,p.lat]).addTo(map);show(`<b>${esc(p.name.split(',')[0])}</b><div class="small">${esc(p.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(p)})'>🚗 Route here</button><button class="secondary" onclick='savePlace(${JSON.stringify(p)})'>Save</button></div>`)}
function savePlace(p){let a=saved();if(!a.some(x=>Math.abs(x.lat-p.lat)<1e-5&&Math.abs(x.lon-p.lon)<1e-5))a.push({...p,id:Date.now()});save(a);show('<b>Place saved ✓</b><div class="small">Stored locally in this browser.</div>')}
function deletePlace(id){save(saved().filter(x=>x.id!==id));tab('saved',document.querySelectorAll('.nav button')[2])}
function routeTo(dest){destination={...dest};current={...dest};stopTracking();arrived=false;offCount=0;stepIndex=0;lastAnnouncedStep=-1;activate(document.querySelectorAll('.nav button')[1]);show(`<b>🚗 Route to ${esc(dest.name.split(',')[0])}</b><div class="small">MAPSUK will use your current GPS position as the start. The destination is locked until arrival.</div><div class="actions"><button onclick="useLocation()">📍 Use my location</button><button class="secondary" onclick="manualStart()">Enter start</button></div>`)}
function manualStart(){show(`<b>🚗 Starting point</b><div class="search"><input id="start" placeholder="Start address or postcode"><button onclick="calcManual()">Go</button></div>`)}
async function calcManual(){const q=document.getElementById('start').value.trim();if(!q)return;try{show('<b>Finding starting point…</b>');const d=await geo(q);if(!d.length)throw Error('Starting location not found');await buildRoute({lat:+d[0].lat,lon:+d[0].lon},destination);startTracking()}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
function stopTracking(){if(watchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId);watchId=null}}
function useLocation(){if(!destination){show('<b>Select a destination first</b>');return}if(!navigator.geolocation){manualStart();return}show('<b>📍 Getting GPS start…</b><div class="small">The destination will remain fixed while MAPSUK builds the route.</div>');navigator.geolocation.getCurrentPosition(async p=>{try{await buildRoute({lat:p.coords.latitude,lon:p.coords.longitude},destination);startTracking()}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}},e=>show('<b>GPS error</b><div class="small">'+esc(e.message||'Could not obtain GPS position')+'</div>'),{enableHighAccuracy:true,timeout:20000,maximumAge:1000})}
async function initRouteLayer(){if(!mapLoaded)await mapReady;if(!map.getSource('route'))map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});if(!map.getLayer('route-line'))map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#657449','line-width':['interpolate',['linear'],['zoom'],8,4,14,7,18,10],'line-opacity':0.92,'line-blur':0.15}})}
async function setRouteGeometry(g){await initRouteLayer();const src=map.getSource('route');if(!src)throw Error('Map route layer is not ready');src.setData({type:'Feature',geometry:g})}
async function buildRoute(start,dest){if(!dest)throw Error('No destination selected');const u=`https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=false`;const r=await fetch(u);if(!r.ok)throw Error('Routing service unavailable');const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error('No driving route found');const rt=j.routes[0];routeData=rt;routeSteps=rt.legs?.flatMap(l=>l.steps||[])||[];stepIndex=0;lastAnnouncedStep=-1;await setRouteGeometry(rt.geometry);if(pin){pin.remove();pin=null}ensureCar(start.lat,start.lon,0);map.fitBounds(rt.geometry.coordinates.map(c=>[c[1],c[0]]),{padding:{top:190,bottom:150,left:25,right:25},duration:600});roadInfo=null;nearbyFeatures=[];lastFeatureFetch=0;renderTurn();show(`<b>🧭 Route planned</b><div class="notice"><b>${esc(nextInstructionText())}</b><br><span class="small">${routeData.distance>=1609.344?(routeData.distance/1609.344).toFixed(1)+' miles':formatDistance(routeData.distance)} · about ${Math.round(routeData.duration/60)} min</span></div><div class="actions"><button onclick="startTracking()">▶ Start live navigation</button><button class="secondary" onclick="toggleVoice()">${voiceOn?'Mute voice':'Voice on'}</button></div><div class="small">Destination locked: ${esc(dest.name.split(',')[0])}</div>`);speak('Route planned. '+Math.round(rt.duration/60)+' minutes. '+nextInstructionText())}
function ensureCar(lat,lon,head){const el=document.createElement('div');el.className='car-wrap';el.innerHTML='<div class="car-arrow"></div>';carMarker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).addTo(map);el.querySelector('.car-arrow').style.transform=`rotate(${head}deg)`;return carMarker}
function moveCar(lat,lon,head){if(!carMarker)ensureCar(lat,lon,head);else{carMarker.setLngLat([lon,lat]);carMarker.getElement().querySelector('.car-arrow').style.transform=`rotate(${head}deg)`}}
function nextInstructionText(){const s=routeSteps[stepIndex];if(!s)return'Continue on the planned route.';const m=s.maneuver||{};const mod=m.modifier?m.modifier.replaceAll('-',' '):'';const road=s.name||'';if(m.type==='arrive')return'Arrive at your destination';if(m.type==='depart')return road?`Take the road towards ${road}`:'Start on the planned route';if(m.type==='roundabout'||m.type==='rotary')return `At the roundabout, take exit ${m.exit||'?'}${road?' onto '+road:''}`;if(mod)return `${mod[0].toUpperCase()+mod.slice(1)}${road?' onto '+road:''}`;return road?`Continue on ${road}`:'Continue ahead'}
function turnIcon(){const m=routeSteps[stepIndex]?.maneuver||{};if(m.type==='roundabout'||m.type==='rotary')return'⟳';if(m.modifier?.includes('left'))return'↰';if(m.modifier?.includes('right'))return'↱';if(m.type==='arrive')return'🏁';return'⬆'}
function remainingToStep(lat,lon){const s=routeSteps[stepIndex]?.maneuver?.location;if(!s)return Infinity;return distanceMetres(lat,lon,s[1],s[0])}
function renderTurn(){if(!routeSteps.length){turnbar.style.display='none';return}const s=routeSteps[stepIndex];if(!s){turnbar.style.display='none';return}turnbar.style.display='block';turn.innerHTML=`<div class="turnicon">${turnIcon()}</div><div><div class="turndistance">${formatDistance(remainingToStep(lastGps?.lat||s.maneuver.location[1],lastGps?.lon||s.maneuver.location[0]))}</div><div class="turninstruction">${esc(nextInstructionText())}</div><div class="turnroad">${esc(s.name||'Road information')}</div></div>`}
function startTracking(){stopTracking();if(!navigator.geolocation){show('<b>GPS unavailable</b><div class="small">This browser does not provide location tracking.</div>');return}watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:1200,timeout:20000});sat.classList.add('show');sat.innerHTML='<div class="satmain">🧭 Live navigation</div><div class="satmeta">Waiting for GPS movement…</div>';setStatus('GPS navigation active');hide()}
function onPositionError(e){const m=e.code===1?'Location permission denied':e.code===2?'GPS position unavailable':e.code===3?'GPS timed out':'GPS error';show(`<b>${m}</b><div class="small">${esc(e.message||'Please try GPS again.')}</div>`)}
function onPosition(pos){const lat=pos.coords.latitude,lon=pos.coords.longitude,acc=Math.round(pos.coords.accuracy||0);if(lastLat!==null){const moved=distanceMetres(lastLat,lastLon,lat,lon);if(moved>4)lastHeading=bearing(lastLat,lastLon,lat,lon)}lastLat=lat;lastLon=lon;lastGps={lat,lon,acc};moveCar(lat,lon,lastHeading);if(driveMode){map.easeTo({center:[lon,lat],zoom:17.2,bearing:lastHeading,pitch:58,duration:450,essential:true})}else map.easeTo({center:[lon,lat],zoom:17.2,duration:450,essential:true});fetchRoadFeatures(lat,lon);advanceNavigation(lat,lon);updateSat(lat,lon);}
function advanceNavigation(lat,lon){if(!routeSteps.length||arrived)return;const d=remainingToStep(lat,lon);if(d<45&&stepIndex<routeSteps.length-1){stepIndex++;if(stepIndex!==lastAnnouncedStep){lastAnnouncedStep=stepIndex;speak(nextInstructionText())}}const dd=destination?distanceMetres(lat,lon,destination.lat,destination.lon):Infinity;if(dd<45){arrived=true;stopTracking();speak('You have arrived at your destination.');sat.innerHTML='<div class="satmain">🏁 Arrived</div><div class="satmeta">You have reached your destination.</div>';turnbar.style.display='none';setStatus('Arrived');return}const routeDist=routeDistance(lat,lon);if(routeDist>90){offCount++;}else offCount=0;if(offCount>=3&&destination&&!arrived){offCount=0;setStatus('Recalculating route…');speak('You are off route. Recalculating.');buildRoute({lat,lon},destination).then(()=>startTracking()).catch(()=>setStatus('Recalculation unavailable'));return}renderTurn()}
function routeDistance(lat,lon){if(!routeData?.geometry?.coordinates?.length)return 0;let best=Infinity;for(const c of routeData.geometry.coordinates)best=Math.min(best,distanceMetres(lat,lon,c[1],c[0]));return best}
function updateSat(lat,lon){const sp=roadInfo?.speed?roadInfo.speed+' mph':'Speed limit —';const cam=nearbyFeatures.find(x=>x.type==='camera'&&x.distance<350),light=nearbyFeatures.find(x=>x.type==='light'&&x.distance<250);sat.innerHTML=`<div class="satmain">${esc(sp)} <span class="badge">${esc(roadInfo?.name||'Driving')}</span></div>${cam?`<div class="alert">📷 Speed camera ${formatDistance(cam.distance)}</div>`:''}${light?`<div class="alert">🚦 Traffic lights ${formatDistance(light.distance)}</div>`:''}<div class="satmeta">GPS ±${lastGps?.acc??'—'} m · 3D driving view</div>`}
function parseSpeed(v){if(v==null||v==='')return null;const s=String(v).toLowerCase(),n=parseFloat(s);if(!Number.isFinite(n))return null;if(s.includes('mph'))return Math.round(n);if(s.includes('km')||/^\d+(\.\d+)?$/.test(s))return Math.round(n/1.609344);return null}
function speedFromTags(t){const raw=String(t?.maxspeed||'').toLowerCase();if(raw.includes('nsl_dual')||raw.includes('national speed limit dual'))return 70;if(raw.includes('nsl_single')||raw.includes('national speed limit single'))return 60;return parseSpeed(t?.maxspeed)||parseSpeed(t?.['maxspeed:type'])}
async function fetchRoadFeatures(lat,lon){if(Date.now()-lastFeatureFetch<8000)return;lastFeatureFetch=Date.now();const b=`${lat-.006},${lon-.009},${lat+.006},${lon+.009}`;const q=`[out:json][timeout:15];(way[highway][maxspeed](${b});way[highway][maxspeed:type](${b});node[highway=traffic_signals](${b});node[highway=speed_camera](${b});way[highway=speed_camera](${b}););out body geom;`;try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});if(!r.ok)return;const j=await r.json();roadInfo=null;nearbyFeatures=[];for(const e of j.elements||[]){if(e.type==='way'&&e.geometry){const d=Math.min(...e.geometry.map(p=>distanceMetres(lat,lon,p.lat,p.lon)));const speed=speedFromTags(e.tags||{});if(d<180&&speed!==null&&(!roadInfo||d<roadInfo.distance))roadInfo={speed,distance:d,name:e.tags?.name||''}}else if(e.lat!==undefined){const d=distanceMetres(lat,lon,e.lat,e.lon);if(d<700)nearbyFeatures.push({type:e.tags?.highway==='speed_camera'?'camera':'light',lat:e.lat,lon:e.lon,distance:d})}}updateSat(lat,lon)}catch(e){}}
function toggleDriveMode(){driveMode=!driveMode;document.getElementById('modeBtn').textContent=driveMode?'3D':'2D';document.getElementById('modeBtn').classList.toggle('active',driveMode);if(lastGps){map.easeTo({center:[lastGps.lon,lastGps.lat],zoom:17.2,pitch:driveMode?58:0,bearing:driveMode?lastHeading:0,duration:600})}else map.easeTo({pitch:driveMode?55:0,bearing:driveMode?lastHeading:0,duration:600})}
function recenter(){if(!lastGps){if(navigator.geolocation)useLocation();return}map.easeTo({center:[lastGps.lon,lastGps.lat],zoom:17.2,pitch:driveMode?58:0,bearing:driveMode?lastHeading:0,duration:600})}
function speak(t){if(!voiceOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function toggleVoice(){voiceOn=!voiceOn;if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();else speak('Voice guidance on');}
function tab(t,b){activate(b);if(t==='find')hide();if(t==='route'){if(destination)routeTo(destination);else show('<b>🚗 Route</b><div class="small">Find a destination first.</div>')}if(t==='saved'){const a=saved();show('<b>🏷️ Saved places</b>'+(a.length?a.map(x=>`<div class="item"><b>${esc(x.name.split(',')[0])}</b><div class="small">${esc(x.name)}</div><div class="actions"><button onclick='selectPlace(${JSON.stringify(x)})'>Show</button><button onclick='routeTo(${JSON.stringify(x)})'>Route</button><button class="danger" onclick='deletePlace(${x.id})'>Delete</button></div></div>`).join(''):'<div class="small">Nothing saved yet.</div>'))}if(t==='scan')scanUI()}
function scanUI(){show(`<b>📷 Scan an address</b><div class="small">Take a photo of an address, sign or label. Text is processed in your browser.</div><input id="photo" type="file" accept="image/*" capture="environment" style="margin-top:9px" onchange="scanPhoto(this)"><div class="notice">Privacy: the image stays in the browser for this feature and is not added to saved places.</div>`)}
async function scanPhoto(input){const f=input.files?.[0];if(!f)return;show('<b>📷 Reading address…</b>');try{const r=await Tesseract.recognize(f,'eng');const text=r.data.text.trim();if(!text){show('<b>No readable text found</b>');return}show(`<b>Address text detected</b><div class="notice">${esc(text).replace(/\n/g,'<br>')}</div><div class="search"><input id="ocrText" value="${esc(text.replace(/\s+/g,' ').trim())}"><button onclick="searchOCR()">Find</button></div>`)}catch(e){show('<b>Scan error</b><div class="small">'+esc(e.message)+'</div>')}}
async function searchOCR(){const q=document.getElementById('ocrText').value.trim();if(!q)return;document.getElementById('q').value=q;await find()}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
initMap();
</script>
</body></html>
