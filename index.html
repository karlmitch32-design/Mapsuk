<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon 3V Navigation Engine</title>
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #05050A;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 1;
        }
        /* Top Navigation Banner matching user UI */
        .nav-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: rgba(10, 13, 32, 0.9);
            border: 2px solid #00F0FF;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            border-radius: 14px;
            padding: 16px 20px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }
        .turn-arrow {
            width: 44px;
            height: 44px;
            border: 3px solid #00F0FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            color: #00F0FF;
            text-shadow: 0 0 8px #00F0FF;
        }
        .nav-text {
            display: flex;
            flex-direction: column;
        }
        .nav-text .direction-text {
            font-size: 20px;
            font-weight: 800;
            color: #00F0FF;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-text .street {
            font-size: 14px;
            color: #8A99AD;
            margin-top: 2px;
        }
        .nav-distance {
            margin-left: auto;
            font-size: 22px;
            font-weight: 800;
            color: #00F0FF;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        /* Bottom HUD Stats Panel matching user UI */
        .hud-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: rgba(5, 5, 10, 0.95);
            border-bottom: 5px solid #FF007F;
            border-radius: 12px;
            padding: 15px 20px;
            color: #FFFFFF;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hud-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .hud-stat {
            text-align: center;
            flex: 1;
        }
        .hud-stat-val {
            font-size: 26px;
            font-weight: 900;
        }
        .hud-stat-val.arrival { color: #00F0FF; }
        .hud-stat-val.remaining { color: #FFFFFF; }
        .hud-stat-val.speed { color: #FF007F; text-shadow: 0 0 10px rgba(255,0,127,0.4); }
        .hud-stat-val.limit { color: #FFFFFF; }
        .hud-stat-lbl {
            font-size: 10px;
            font-weight: 700;
            color: #8A99AD;
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .hud-row-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
        }
        .hud-msg-left { color: #FFFFFF; }
        .hud-msg-right { color: #8A99AD; }
        
        /* Floating Right Action Buttons */
        .map-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        .control-btn {
            width: 46px;
            height: 46px;
            background: rgba(10, 13, 32, 0.9);
            border: 2px solid #00F0FF;
            border-radius: 50%;
            color: #00F0FF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            font-size: 18px;
            transition: all 0.2s ease;
        }
        .control-btn:active {
            transform: scale(0.9);
            background: #00F0FF;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="nav-banner">
        <div class="turn-arrow">➔</div>
        <div class="nav-text">
            <div class="direction-text">Turn Right</div>
            <div class="street">Malpas Road</div>
        </div>
        <div class="nav-distance">140 yd</div>
    </div>

    <div class="map-controls">
        <div class="control-btn" id="recenter-btn">🎯</div>
        <div class="control-btn" id="tilt-btn">3D</div>
    </div>

    <div class="hud-panel">
        <div class="hud-row-top">
            <div class="hud-stat">
                <div class="hud-stat-val arrival">22:25</div>
                <div class="hud-stat-lbl">Arrival</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-val remaining">19m</div>
                <div class="hud-stat-lbl">Remaining</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-val speed">42</div>
                <div class="hud-stat-lbl">MPH</div>
            </div>
            <div class="hud-stat">
                <div class="hud-stat-val limit">50</div>
                <div class="hud-stat-lbl">Limit</div>
            </div>
        </div>
        <div class="hud-row-bottom">
            <div class="hud-msg-left">Following active route</div>
            <div class="hud-msg-right">GPS Signal OK</div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // Use a high-quality free open-source dark vector base theme from CartoDB
        const mapStyle = {
            version: 8,
            sources: {
                'cartodb-dark': {
                    type: 'raster',
                    tiles: [
                        'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                        'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                        'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                        'https://d.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'
                    ],
                    tileSize: 256,
                    attribution: '© OpenStreetMap contributors © CARTO'
                }
            },
            layers: [
                {
                    id: 'background',
                    type: 'background',
                    paint: { 'background-color': '#05050A' }
                },
                {
                    id: 'base-tiles',
                    type: 'raster',
                    source: 'cartodb-dark',
                    paint: { 'raster-opacity': 0.85 }
                }
            ]
        };

        // Coordinates derived from user image context (Newport / Malpas Road region, UK)
        const startCoords = [-3.0035, 51.6025]; 
        
        // Define a sharp zigzag simulated route line
        const routeCoordinates = [
            [-3.0045, 51.5990],
            [-3.0035, 51.6015],
            [-3.0032, 51.6028],
            [-3.0010, 51.6045],
            [-2.9975, 51.6070],
            [-2.9950, 51.6110]
        ];

        // Initialize MapLibre Engine
        const map = new maplibregl.Map({
            container: 'map',
            style: mapStyle,
            center: startCoords,
            zoom: 16.5,
            pitch: 60,       // Crucial: Low trailing angle camera tilt (0-85 degrees)
            bearing: 15,     // Align rotation with the road trajectory direction
            antialias: true
        });

        map.on('load', () => {
            // Add Neon Glowing Active Route GeoJSON Layer
            map.addSource('route', {
                type: 'geojson',
                data: {
                    type: 'Feature',
                    properties: {},
                    geometry: {
                        type: 'LineString',
                        coordinates: routeCoordinates
                    }
                }
            });

            // Outer Neon Glow Layer
            map.addLayer({
                id: 'route-glow',
                type: 'line',
                source: 'route',
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                paint: {
                    'line-color': '#FF007F',
                    'line-width': 12,
                    'line-opacity': 0.4
                }
            });

            // Inner Sharp Cyan Vector Strand
            map.addLayer({
                id: 'route-core',
                type: 'line',
                source: 'route',
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                paint: {
                    'line-color': '#00F0FF',
                    'line-width': 5,
                    'line-opacity': 1.0
                }
            });

            // Custom HTML element for the trailing navigation arrow icon
            const el = document.createElement('div');
            el.className = 'vehicle-marker';
            el.style.width = '0';
            el.style.height = '0';
            el.style.borderLeft = '12px solid transparent';
            el.style.borderRight = '12px solid transparent';
            el.style.borderBottom = '28px solid #FF007F';
            el.style.filter = 'drop-shadow(0px 0px 8px #FF007F)';

            // Place marker at vehicle origin point
            const marker = new maplibregl.Marker({ element: el })
                .setLngLat(startCoords)
                .addTo(map);

            // Simulation Loop variables
            let step = 0;
            const totalSteps = 600;

            // Interpolate points smoothly to simulate driving
            function animateVehicle() {
                if (step >= totalSteps) step = 0;

                const progress = step / totalSteps;
                const totalSegments = routeCoordinates.length - 1;
                const segmentProgress = progress * totalSegments;
                const currentSegment = Math.floor(segmentProgress);
                const t = segmentProgress - currentSegment;

                if (currentSegment < totalSegments) {
                    const p1 = routeCoordinates[currentSegment];
                    const p2 = routeCoordinates[currentSegment + 1];

                    // Interpolate coordinates
                    const lng = p1[0] + (p2[0] - p1[0]) * t;
                    const lat = p1[1] + (p2[1] - p1[1]) * t;
                    const currentPos = [lng, lat];

                    // Update cursor positioning
                    marker.setLngLat(currentPos);

                    // Compute bearing trajectory vector angle between node links
                    const y = Math.sin(Math.PI * (p2[0] - p1[0]) / 180) * Math.cos(Math.PI * p2[1] / 180);
                    const x = Math.cos(Math.PI * p1[1] / 180) * Math.sin(Math.PI * p2[1] / 180) -
                              Math.sin(Math.PI * p1[1] / 180) * Math.cos(Math.PI * p2[1] / 180) * Math.cos(Math.PI * (p2[0] - p1[0]) / 180);
                    let bearing = Math.atan2(y, x) * 180 / Math.PI;
                    
                    // Smooth tracking camera configuration lock loop
                    map.easeTo({
                        center: currentPos,
                        bearing: bearing, 
                        duration: 0,
                        pitch: 60
                    });
                }

                step++;
                requestAnimationFrame(animateVehicle);
            }

            // Fire Simulation Engine Run
            animateVehicle();
        });

        // Interactive control wiring
        document.getElementById('tilt-btn').addEventListener('click', () => {
            const currentPitch = map.getPitch();
            map.easeTo({ pitch: currentPitch > 30 ? 0 : 60, duration: 800 });
        });
        
        document.getElementById('recenter-btn').addEventListener('click', () => {
            map.easeTo({ zoom: 16.5, duration: 800 });
        });
    </script>
</body>
</html>
