<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon 3D SatNav Layout Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #05050A;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Top Navigation Banner */
        .nav-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(10, 13, 32, 0.85);
            border: 2px solid #00F0FF;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            padding: 15px 20px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .turn-arrow {
            width: 40px;
            height: 40px;
            border: 3px solid #00F0FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: #00F0FF;
            text-shadow: 0 0 8px #00F0FF;
        }
        .nav-text .distance {
            font-size: 18px;
            font-weight: 700;
            color: #00F0FF;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }
        .nav-text .street {
            font-size: 14px;
            color: #8A99AD;
        }
        /* HUD Stats Overlay */
        .hud-display {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: rgba(5, 5, 10, 0.9);
            border-left: 4px solid #FF007F;
            padding: 10px 15px;
            color: #FFFFFF;
            z-index: 10;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .hud-speed {
            font-size: 28px;
            font-weight: 900;
            color: #FF007F;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .hud-unit {
            font-size: 12px;
            color: #8A99AD;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- Google Maps Style Neon Top Banner -->
        <div class="nav-banner">
            <div class="turn-arrow">↱</div>
            <div class="nav-text">
                <div class="distance">250 yards</div>
                <div class="street">Turn right onto Cyber Avenue</div>
            </div>
        </div>

        <!-- Speedometer HUD -->
        <div class="hud-display">
            <div class="hud-speed">45</div>
            <div class="hud-unit">MPH</div>
        </div>

        <canvas id="satnavCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('satnavCanvas');
        const ctx = canvas.getContext('2d');

        // Handle screen resizing
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 3D Perspective Configuration
        const config = {
            pitch: 38,             // Tilt angle down toward horizon (degrees)
            horizonY: 0.35,        // Horizon line position (35% from top of screen)
            carAnchorY: 0.75,      // Vehicle anchor point (75% from top of screen - TomTom/Google style)
            heading: 0,            // Micro-heading tracking loop
            speed: 0.02
        };

        // Mock road matrix dataset (Simulated Grid Coordinates)
        const roads = [
            // Active Neon Route Line
            { points: [{x: 0, z: 0}, {x: 0, z: 3}, {x: 2, z: 3}, {x: 2, z: 8}, {x: -3, z: 8}, {x: -3, z: 15}], isActiveRoute: true },
            // Surrounding Cross Streets
            { points: [{x: -5, z: 1.5}, {x: 5, z: 1.5}], isActiveRoute: false },
            { points: [{x: -5, z: 3}, {x: 0, z: 3}], isActiveRoute: false },
            { points: [{x: -2, z: 5}, {x: 4, z: 5}], isActiveRoute: false },
            { points: [{x: -5, z: 8}, {x: 5, z: 8}], isActiveRoute: false },
            { points: [{x: 2, z: 0}, {x: 2, z: 3}], isActiveRoute: false }
        ];

        let carProgress = 0;

        // Project 3D World coordinates [X, Z] onto a 2D Screen space [X, Y]
        function project3D(worldX, worldZ) {
            const centerX = canvas.width / 2;
            const horizon = canvas.height * config.horizonY;
            const originY = canvas.height * config.carAnchorY;
            
            // Perspective depth factor calculation
            if (worldZ <= -1) return null; // Behind camera clipping
            const scale = 1 / (1 + worldZ * 0.4);
            
            const screenX = centerX + worldX * 180 * scale;
            const screenY = horizon + (originY - horizon) * scale;
            
            return { x: screenX, y: screenY, scale: scale };
        }

        // Core Render Loop Animation
        function draw() {
            // Step 1: Clear canvas with Pure Cyberpunk Void Black
            ctx.fillStyle = '#05050A';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Step 2: Progress vehicle forward through time loop
            carProgress += config.speed;
            if (carProgress > 15) carProgress = 0; // Infinite loop reset

            // Calculate directional turning variations based on simulated track layout
            let currentHeadingOffset = 0;
            if (carProgress > 3 && carProgress < 5) currentHeadingOffset = -0.3;
            if (carProgress >= 5 && carProgress < 8) currentHeadingOffset = 0.4;

            // Step 3: Draw Street Polygons
            roads.forEach(road => {
                ctx.beginPath();
                
                road.points.forEach((pt, idx) => {
                    // Translate world around vehicle progression point & heading sway
                    const relativeZ = pt.z - carProgress;
                    const relativeX = pt.x - (currentHeadingOffset * relativeZ);

                    const screenPt = project3D(relativeX, relativeZ);
                    
                    if (screenPt) {
                        if (idx === 0) ctx.moveTo(screenPt.x, screenPt.y);
                        else ctx.lineTo(screenPt.x, screenPt.y);
                    }
                });

                if (road.isActiveRoute) {
                    // Render Neon Glowing Active Route Line
                    ctx.strokeStyle = '#00F0FF';
                    ctx.lineWidth = 14;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.shadowColor = '#00F0FF';
                    ctx.shadowBlur = 15; // Engine-rendered neon bloom effect
                    ctx.stroke();
                    
                    // Core Inner Beam
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 0;
                    ctx.stroke();
                } else {
                    // Secondary Muted Backdrop Infrastructure Lines
                    ctx.strokeStyle = '#1A1B35';
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 0;
                    ctx.stroke();
                }
            });

            // Step 4: Render Stationary Vehicle Locator Arrow (Anchored at lower 1/3)
            const carX = canvas.width / 2;
            const carY = canvas.height * config.carAnchorY;

            ctx.save();
            ctx.translate(carX, carY);
            
            // Draw Locator Arrow Shadow Glow
            ctx.shadowColor = '#FF007F';
            ctx.shadowBlur = 20;
            
            // Magenta Neon Navigation Triangle
            ctx.fillStyle = '#FF007F';
            ctx.beginPath();
            ctx.moveTo(0, -22);   // Pointer tip heading straight forward up screen
            ctx.lineTo(15, 15);   // Bottom Right flap
            ctx.lineTo(0, 5);     // Rear center invert indentation
            ctx.lineTo(-15, 15);  // Bottom Left flap
            ctx.closePath();
            ctx.fill();

            // Inner Accent Strike
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(8, 10);
            ctx.lineTo(0, 3);
            ctx.lineTo(-8, 10);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();

            requestAnimationFrame(draw);
        }

        // Launch Rendering Call
        draw();
    </script>
</body>
</html>
