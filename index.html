<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAPSUK V2 — Sat-nav</title>
<link href="https://unpkg.com/maplibre-gl@5.11.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--olive:#657449;--dark:#384329;--cream:#f4f4ed;--white:#fff;--muted:#687064;--danger:#8a3d32;--shadow:0 5px 24px #0004}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:#20251d}button,input{font:inherit}
#map{position:absolute;inset:0;background:#d9ddd3}
.topbar{position:absolute;z-index:20;top:0;left:0;right:0;padding:10px;pointer-events:none}.brandrow{display:flex;align-items:center;gap:8px}.brand{background:var(--dark);color:#fff;border-radius:12px;padding:8px 12px;font-weight:900;letter-spacing:.5px;box-shadow:var(--shadow)}
.search{margin-top:8px;display:flex;gap:6px;pointer-events:auto}.search input{flex:1;min-width:0;border:0;border-radius:11px;padding:11px 12px;box-shadow:var(--shadow)}.search button{border:0;border-radius:11px;padding:10px 14px;background:var(--olive);color:#fff;font-weight:800}
.hud{position:absolute;z-index:15;top:82px;left:10px;right:10px;pointer-events:none;display:flex;justify-content:center}.turncard{min-width:260px;max-width:92%;background:#fff;border-radius:16px;padding:9px 14px;box-shadow:var(--shadow);text-align:center}.turnicon{font-size:28px;font-weight:900}.turnmain{font-size:19px;font-weight:900}.turnsub{font-size:12px;color:var(--muted);margin-top:2px}
.bottom{position:absolute;z-index:15;left:10px;right:10px;bottom:12px;display:flex;gap:8px;align-items:end;pointer-events:none}.speed{background:#fff;border-radius:16px;padding:9px 12px;box-shadow:var(--shadow);min-width:92px;text-align:center}.speed b{font-size:25px;display:block}.speed small{color:var(--muted)}.road{flex:1;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}.road b{font-size:14px}.road small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:6px;pointer-events:auto}.controls button{width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px}
.panel{position:absolute;z-index:30;left:10px;right:10px;bottom:76px;background:#fff;border-radius:16px;padding:13px;box-shadow:var(--shadow);max-height:52%;overflow:auto;display:none}.panel.show{display:block}.small{font-size:12px;color:var(--muted);line-height:1.4}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{border:0;border-radius:10px;padding:10px 12px;background:var(--olive);color:#fff;font-weight:800}.actions .secondary{background:#edf0e7;color:var(--dark)}.result{padding:10px 0;border-bottom:1px solid #e4e7de}.notice{margin-top:8px;padding:9px;border-radius:10px;background:#f4f6ee}.alert{margin-top:6px;padding:7px 9px;border-radius:9px;background:#f7f8f2;font-weight:750}.camera{background:#f5ebe7}.light{background:#edf2e7}
.car{width:30px;height:30px;display:grid;place-items:center;transform-origin:50% 50%;filter:drop-shadow(0 2px 2px #0005)}.car svg{width:30px;height:30px}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{z-index:4}.maplibregl-ctrl-group{box-shadow:var(--shadow)!important}
@media(min-width:800px){.search{max-width:520px}.panel{max-width:460px;right:auto}.hud{left:300px;right:300px}.bottom{left:18px;right:18px}}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div class="topbar"><div class="brandrow"><div class="brand">MAPSUK • SAT-NAV V2</div></div><div class="search"><input id="q" placeholder="Search UK address, postcode, town or place" autocomplete="off"><button id="findBtn">Find</button></div></div>
<div class="hud"><div id="turncard" class="turncard"><div class="turnicon">➤</div><div id="turnmain" class="turnmain">Find a destination</div><div id="turnsub" class="turnsub">MAPSUK V2 driving view</div></div></div>
<div class="bottom"><div class="speed"><b id="speedLimit">—</b><small id="speedSource">Speed limit</small></div><div class="road"><b id="roadName">Ready</b><small id="roadMeta">GPS off • Search a destination to begin</small><div id="alerts"></div></div><div class="controls"><button id="locBtn" title="Use my location">◎</button><button id="voiceBtn" title="Voice guidance">🔊</button></div></div>
<div id="panel" class="panel"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.11.0/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let map,markerEl,marker,current=null,route=null,routeCoords=[],steps=[],stepIndex=0,watchId=null,voiceOn=true,lastPos=null,lastHeading=0,roadInfo=null,nearby=[],lastFeatureFetch=0,lastOffRoute=0,rerouting=false;
function init(){
 map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:[-3.4,54.5],zoom:6,pitch:0,bearing:0,attributionControl:true});
 map.addControl(new maplibregl.NavigationControl({showCompass:true}), 'top-right');
 markerEl=document.createElement('div'); markerEl.className='car'; markerEl.innerHTML='<svg viewBox="0 0 40 40" aria-label="vehicle direction"><path d="M20 2 L34 34 L20 29 L6 34 Z" fill="#657449" stroke="#fff" stroke-width="3"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg>';
 marker=new maplibregl.Marker({element:markerEl,anchor:'center'}).setLngLat([-3.4,54.5]).addTo(map); marker.remove();
 $('findBtn').onclick=find; $('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()}); $('locBtn').onclick=useLocation; $('voiceBtn').onclick=toggleVoice;
}
function show(html){$('panel').innerHTML=html;$('panel').classList.add('show')} function hide(){ $('panel').classList.remove('show') }
function speak(t){if(!voiceOn||!('speechSynthesis'in window)||!t)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u)}
function fmtDist(m){return m>=1609.344?(m/1609.344).toFixed(1)+' miles':Math.max(1,Math.round(m*1.09361))+' yards'}
function hav(a,b,c,d){const R=6371000,p=Math.PI/180,x=(b-a)*p,y=(d-c)*p;const z=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function bearing(a,b,c,d){const p=Math.PI/180,y=Math.sin((d-b)*p)*Math.cos(c*p),x=Math.cos(a*p)*Math.sin(c*p)-Math.sin(a*p)*Math.cos(c*p)*Math.cos((d-b)*p);return (Math.atan2(y,x)*180/Math.PI+360)%360}
function nearestRouteDistance(lat,lon){let best=Infinity;for(const p of routeCoords)best=Math.min(best,hav(lat,lon,p[1],p[0]));return best}
async function search(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search unavailable');return r.json()}
async function find(){const q=$('q').value.trim();if(!q)return;show('<b>Searching…</b>');try{const a=await search(q);if(!a.length){show('<b>No UK result found</b>');return}show('<b>Choose destination</b>'+a.map(x=>`<div class="result"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='choose(${JSON.stringify({lat:+x.lat,lon:+x.lon,name:x.display_name})})'>Route here</button></div></div>`).join(''))}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function choose(x){current=x;hide(); if(lastPos)routeTo(lastPos,x);else {map.flyTo({center:[x.lon,x.lat],zoom:15,pitch:45,duration:900});show('<b>Destination selected</b><div class="small">Allow location access, then press ◎ to start live navigation.</div><div class="actions"><button onclick="useLocation()">Use my location</button></div>')}}
async function routeTo(a,dest=current){if(!dest)return;try{show('<b>Planning driving route…</b>');const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=false`);if(!r.ok)throw Error('Routing unavailable');const j=await r.json();if(j.code!=='Ok')throw Error('No driving route found');const rt=j.routes[0];steps=rt.legs?.[0]?.steps||[];stepIndex=0;routeCoords=rt.geometry.coordinates||[];if(route)map.getSource('route')?map.removeLayer('route'):null; if(map.getSource('route'))map.removeSource('route');map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:rt.geometry}});map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#657449','line-width':7,'line-opacity':.9}});route=true;map.fitBounds([[...rt.geometry.coordinates.reduce((a,p)=>[Math.min(a[0],p[0]),Math.min(a[1],p[1])],[Infinity,Infinity])],[...rt.geometry.coordinates.reduce((a,p)=>[Math.max(a[0],p[0]),Math.max(a[1],p[1])],[-Infinity,-Infinity])]],{padding:{top:130,bottom:150,left:35,right:35},duration:800});updateTurn();speak('Route planned. '+Math.round(rt.duration/60)+' minutes. '+(steps[0]?.maneuver?.instruction||''));show('<b>🧭 Route ready</b><div class="notice"><b>'+esc(steps[0]?.maneuver?.instruction||'Continue')+'</b><br><span class="small">'+fmtDist(steps[0]?.distance||0)+'</span></div><div class="small">'+(rt.distance/1609.344).toFixed(1)+' miles • about '+Math.round(rt.duration/60)+' minutes</div><div class="actions"><button onclick="startTracking()">▶ Start navigation</button><button class="secondary" onclick="hide()">Close</button></div>')}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
function updateTurn(){const st=steps[stepIndex];if(!st){$('turnmain').textContent='Arrived';$('turnsub').textContent='Destination reached';return} $('turnmain').textContent=st.maneuver?.instruction||'Continue';$('turnsub').textContent=fmtDist(st.distance||0)+' • instruction '+(stepIndex+1)+' of '+steps.length; $('turncard').querySelector('.turnicon').textContent=iconFor(st.maneuver?.type,st.maneuver?.modifier)}
function iconFor(t,m){if(t==='roundabout'||t==='rotary')return '⟳'; if(t==='arrive')return '●'; if(m==='left'||m==='slight left')return '↖'; if(m==='right'||m==='slight right')return '↗'; if(m==='uturn')return '↶'; return '↑'}
async function locationStatus(){
  let perm='unknown';
  try{if(navigator.permissions?.query){const q=await navigator.permissions.query({name:'geolocation'});perm=q.state}}catch(e){}
  return {perm,secure:window.isSecureContext,geo:!!navigator.geolocation};
}
function gpsErrorText(e){
  const code=e?.code;
  if(code===1)return 'Chrome reported PERMISSION_DENIED. If Location already says Allow, reload the GitHub Pages site and try again. Check Android system Location is also switched on.';
  if(code===2)return 'Chrome could not get a GPS position. Move outside/near a window and try again.';
  if(code===3)return 'GPS request timed out. Try again with Location switched on.';
  return 'Unknown GPS error: '+(e?.message||'no message');
}
async function useLocation(){
  if(!navigator.geolocation){show('<b>GPS unavailable</b><div class="small">This browser does not expose geolocation.</div>');return}
  const st=await locationStatus();
  show('<b>📍 Checking GPS…</b><div class="small">Permission: '+esc(st.perm)+' • HTTPS: '+(st.secure?'yes':'no')+' • Geolocation API: '+(st.geo?'yes':'no')+'</div>');
  navigator.geolocation.getCurrentPosition(async p=>{
    lastPos={lat:p.coords.latitude,lon:p.coords.longitude};
    placeMarker(lastPos.lat,lastPos.lon);
    map.flyTo({center:[lastPos.lon,lastPos.lat],zoom:17,pitch:55,bearing:lastHeading,duration:800});
    $('roadMeta').textContent='GPS lock • ±'+Math.round(p.coords.accuracy||0)+' m';
    if(current)await routeTo(lastPos,current);
    startTracking();
  },async e=>{
    const again=await locationStatus();
    show('<b>📍 GPS could not start</b><div class="notice"><b>'+esc(gpsErrorText(e))+'</b></div><div class="small">Error code: '+esc(e?.code)+' • Permission: '+esc(again.perm)+' • HTTPS: '+(again.secure?'yes':'no')+'</div><div class="actions"><button onclick="useLocation()">Try GPS again</button><button class="secondary" onclick="showGpsHelp()">GPS help</button></div>');
    $('roadMeta').textContent='GPS error '+(e?.code||'?')+' • '+(e?.message||'unknown');
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function showGpsHelp(){show('<b>📍 GPS troubleshooting</b><div class="small">1. Android Settings → Location → switch Location on.<br>2. Chrome → site controls → Permissions → Location → Allow.<br>3. Reload MAPSUK from its HTTPS GitHub Pages address.<br>4. Return to MAPSUK and press ◎ again.</div>')}
function startTracking(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);if(!navigator.geolocation)return;watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});marker.addTo(map);hide()}
function stopTracking(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}
function placeMarker(lat,lon){marker.setLngLat([lon,lat]);markerEl.style.transform=`rotate(${lastHeading}deg)`}
async function onPosition(p){const lat=p.coords.latitude,lon=p.coords.longitude,acc=Math.round(p.coords.accuracy||0);let h=p.coords.heading;if(h==null||h<0){if(lastPos)h=bearing(lastPos.lat,lastPos.lon,lat,lon)}if(Number.isFinite(h))lastHeading=h;lastPos={lat,lon};placeMarker(lat,lon);map.easeTo({center:[lon,lat],zoom:Math.max(map.getZoom(),16),pitch:55,bearing:lastHeading,offset:[0,120],duration:500});$('roadMeta').textContent='GPS ±'+acc+' m • live driving view';if(steps.length){const st=steps[stepIndex],loc=st?.maneuver?.location;if(loc&&hav(lat,lon,loc[1],loc[0])<45&&stepIndex<steps.length-1){stepIndex++;updateTurn();speak(steps[stepIndex]?.maneuver?.instruction||'Continue')}const off=nearestRouteDistance(lat,lon);if(off>70&&Date.now()-lastOffRoute>15000&&!rerouting){lastOffRoute=Date.now();reroute(lat,lon)}}await fetchRoadData(lat,lon);renderAlerts(lat,lon)}
async function reroute(lat,lon){if(!current)return;rerouting=true;speak('You are off route. Recalculating.');$('roadMeta').textContent='Off route • recalculating';await routeTo({lat,lon},current);rerouting=false}
function onPositionError(e){$('roadMeta').textContent='GPS '+(e.code===1?'permission denied':e.code===2?'unavailable':e.code===3?'timeout':'error')+' • '+(e.message||'check Location')}
function parseSpeed(v){if(!v)return null;const m=String(v).match(/(\d+(?:\.\d+)?)\s*(mph|km\/h|kph)?/i);if(!m)return null;let n=+m[1];if(/km/i.test(m[2]||''))n=n*.621371;return Math.round(n)}
function implicitSpeed(t){if(t.maxspeed){const n=parseSpeed(t.maxspeed);if(n)return {mph:n,source:'mapped limit'}}const typ=String(t['maxspeed:type']||'');if(/GB:motorway/i.test(typ))return {mph:70,source:'national motorway'};if(/GB:nsl_dual/i.test(typ))return {mph:70,source:'national dual carriageway'};if(/GB:nsl_single/i.test(typ))return {mph:60,source:'national single carriageway'};if(t.highway==='motorway'||t.highway==='motorway_link')return {mph:70,source:'motorway default'};if((t.highway==='trunk'||t.highway==='trunk_link')&&String(t.oneway)==='yes')return {mph:70,source:'dual-carriageway default'};if(t.highway==='living_street')return {mph:20,source:'living street default'};if(t.highway==='residential'||t.lit==='yes')return {mph:30,source:'built-up default'};if(['primary','secondary','tertiary','unclassified'].includes(t.highway))return {mph:60,source:'national single-carriageway default'};return null}
async function fetchRoadData(lat,lon){if(Date.now()-lastFeatureFetch<8000)return;lastFeatureFetch=Date.now();const b=`${lat-.004},${lon-.006},${lat+.004},${lon+.006}`;const q=`[out:json][timeout:12];(way[highway](${b});node[highway=traffic_signals](${b});node[highway=speed_camera](${b}););out body geom;`;try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});if(!r.ok)throw 0;const j=await r.json();let best=null;nearby=[];for(const e of j.elements||[]){if(e.type==='way'&&e.geometry){let d=Infinity;for(const p of e.geometry)d=Math.min(d,hav(lat,lon,p.lat,p.lon));if(d<180&&(!best||d<best.distance))best={...implicitSpeed(e.tags||{}),distance:d,name:e.tags?.name||'',highway:e.tags?.highway||'',tags:e.tags||{}}}else if(e.type==='node'&&e.lat!=null){const d=hav(lat,lon,e.lat,e.lon);if(d<700)nearby.push({type:e.tags?.highway==='speed_camera'?'camera':'light',lat:e.lat,lon:e.lon,distance:d})}}roadInfo=best;if(best){$('speedLimit').textContent=best.mph+' mph';$('speedSource').textContent=best.source;$('roadName').textContent=best.name||'Road'}else{$('speedLimit').textContent='—';$('speedSource').textContent='No mapped road data'}}catch(e){}}
function renderAlerts(lat,lon){const a=[];const cam=nearby.filter(x=>x.type==='camera').sort((x,y)=>x.distance-y.distance)[0];const light=nearby.filter(x=>x.type==='light').sort((x,y)=>x.distance-y.distance)[0];if(cam&&cam.distance<250)a.push(`<div class="alert camera">📷 Speed camera ${fmtDist(cam.distance)}</div>`);if(light&&light.distance<180)a.push(`<div class="alert light">🚦 Traffic lights ${fmtDist(light.distance)}</div>`);$('alerts').innerHTML=a.join('');if(cam&&cam.distance<120&&cam.distance>60&&lastCamera!==Math.round(cam.lat*1e5)){lastCamera=Math.round(cam.lat*1e5);speak('Speed camera ahead, '+fmtDist(cam.distance))}if(light&&light.distance<100&&light.distance>45&&lastLight!==Math.round(light.lat*1e5)){lastLight=Math.round(light.lat*1e5);speak('Traffic lights ahead, '+fmtDist(light.distance))}}
let lastCamera=null,lastLight=null;
function toggleVoice(){voiceOn=!voiceOn;$('voiceBtn').textContent=voiceOn?'🔊':'🔇';if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();else speak('Voice guidance on')}
init();
</script>
</body>
</html>
