<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAPSUK V2 — Sat-nav</title>
<link href="https://unpkg.com/maplibre-gl@5.11.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--olive:#657449;--olive2:#4f5e38;--dark:#28301d;--cream:#eef0e7;--white:#fff;--muted:#66705f;--danger:#a33b32;--amber:#9a6b16;--shadow:0 5px 24px #0005}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:#20251d}button,input{font:inherit}
#map{position:absolute;inset:0;background:#d9ddd3}
.topbar{position:absolute;z-index:20;top:0;left:0;right:0;padding:10px;pointer-events:none}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{background:var(--dark);color:#fff;border-radius:12px;padding:8px 12px;font-weight:900;letter-spacing:.5px;box-shadow:var(--shadow)}.status{background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;box-shadow:var(--shadow)}
.search{margin-top:8px;display:flex;gap:6px;pointer-events:auto}.search input{flex:1;min-width:0;border:0;border-radius:11px;padding:11px 12px;box-shadow:var(--shadow)}.search button{border:0;border-radius:11px;padding:10px 14px;background:var(--olive);color:#fff;font-weight:800}
.hud{position:absolute;z-index:15;top:84px;left:10px;right:10px;pointer-events:none;display:flex;justify-content:center}.turncard{min-width:280px;max-width:94%;background:#fff;border-radius:18px;padding:10px 15px;box-shadow:var(--shadow);text-align:center}.turnicon{font-size:31px;font-weight:900;line-height:1}.turnmain{font-size:20px;font-weight:950}.turnsub{font-size:12px;color:var(--muted);margin-top:2px}.lane{margin-top:6px;font-size:12px;font-weight:800;color:var(--olive2)}
.upahead{position:absolute;z-index:14;left:10px;top:190px;background:#fff;border-radius:13px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;max-width:180px}.upahead b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.upahead span{display:block;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{position:absolute;z-index:15;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:78px 1fr auto;gap:7px;align-items:end;pointer-events:none}.speed{background:#fff;border-radius:17px;padding:8px 8px;box-shadow:var(--shadow);text-align:center}.speed b{font-size:25px;display:block;line-height:1.05}.speed small{color:var(--muted);font-size:10px}.road{background:#fff;border-radius:17px;padding:9px 11px;box-shadow:var(--shadow);min-width:0}.road b{font-size:14px}.road small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.alerts{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.alert{padding:4px 7px;border-radius:8px;background:#f4f6ee;font-size:11px;font-weight:800}.camera{background:#f5ebe7}.light{background:#edf2e7}.hazard{background:#f5efdf}.danger{background:#f4dfdc;color:#7c241d}
.controls{display:flex;gap:6px;pointer-events:auto}.controls button{width:45px;height:45px;border:0;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px}.controls button.active{background:var(--olive);color:#fff}
.panel{position:absolute;z-index:30;left:10px;right:10px;bottom:70px;background:#fff;border-radius:17px;padding:13px;box-shadow:var(--shadow);max-height:64%;overflow:auto;display:none}.panel.show{display:block}.small{font-size:12px;color:var(--muted);line-height:1.45}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{border:0;border-radius:10px;padding:10px 12px;background:var(--olive);color:#fff;font-weight:800}.actions .secondary{background:#edf0e7;color:var(--dark)}.result{padding:10px 0;border-bottom:1px solid #e4e7de}.notice{margin-top:8px;padding:9px;border-radius:10px;background:#f4f6ee}.menugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.menubtn{border:0;border-radius:12px;background:#f0f2ea;padding:11px;text-align:left;font-weight:850;color:var(--dark)}.menubtn span{display:block;font-size:19px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.stat{background:#f4f6ee;border-radius:11px;padding:9px}.stat b{display:block;font-size:16px}.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e4e7de}.toggle button{border:0;border-radius:999px;padding:7px 11px;background:#dfe5d5;font-weight:850}.toggle button.on{background:var(--olive);color:#fff}.routepreview{max-height:220px;overflow:auto;margin-top:8px}.step{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #e4e7de}.step .n{width:30px;height:30px;border-radius:50%;background:#edf0e7;display:grid;place-items:center;font-weight:900}.step b{font-size:13px}.step small{display:block;color:var(--muted)}
.car{width:34px;height:34px;display:grid;place-items:center;transform-origin:50% 50%;filter:drop-shadow(0 2px 2px #0006)}.car svg{width:34px;height:34px}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{z-index:4}.maplibregl-ctrl-group{box-shadow:var(--shadow)!important}
@media(min-width:800px){.search{max-width:520px}.panel{max-width:470px;right:auto}.hud{left:300px;right:300px}.bottom{left:18px;right:18px;grid-template-columns:92px 1fr auto}}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div class="topbar"><div class="brandrow"><div class="brand">MAPSUK • DRIVING</div><div id="status" class="status">GPS OFF</div></div><div class="search"><input id="q" placeholder="Where do you want to go?" autocomplete="off"><button id="findBtn">Find</button></div></div>
<div class="hud"><div id="turncard" class="turncard"><div id="turnicon" class="turnicon">↑</div><div id="turnmain" class="turnmain">Find a destination</div><div id="turnsub" class="turnsub">Clear driving guidance</div><div id="lane" class="lane"></div></div></div>
<div id="upahead" class="upahead"><b>Up ahead</b><span id="upaheadText">Search a destination</span></div>
<div class="bottom"><div class="speed"><b id="speedLimit">—</b><small id="speedSource">Speed limit</small></div><div class="road"><b id="roadName">MAPSUK ready</b><small id="roadMeta">GPS off • Search a destination to begin</small><div id="alerts" class="alerts"></div></div><div class="controls"><button id="menuBtn" title="Map tools">☰</button><button id="locBtn" title="Use my location">◎</button><button id="voiceBtn" title="Voice search / voice guidance">🔊</button></div></div>
<div id="panel" class="panel"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.11.0/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let map,markerEl,marker,current=null,routeCoords=[],steps=[],stepIndex=0,watchId=null,voiceOn=true,lastPos=null,lastHeading=0,currentSpeedMph=0,roadInfo=null,nearby=[],lastFeatureFetch=0,lastOffRoute=0,rerouting=false,lastCamera=null,lastLight=null,trip={start:null,miles:0,seconds:0},prefs={speedWarn:true,reducedTone:true,cameras:true,environment:true,breaks:true};
function init(){
 map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:[-3.4,54.5],zoom:6,pitch:0,bearing:0,attributionControl:true});
 map.addControl(new maplibregl.NavigationControl({showCompass:true}), 'top-right');
 markerEl=document.createElement('div');markerEl.className='car';markerEl.innerHTML='<svg viewBox="0 0 40 40" aria-label="vehicle direction"><path d="M20 2 L34 34 L20 29 L6 34 Z" fill="#657449" stroke="#fff" stroke-width="3"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg>';marker=new maplibregl.Marker({element:markerEl,anchor:'center'}).setLngLat([-3.4,54.5]).addTo(map);marker.remove();
 $('findBtn').onclick=find;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});$('locBtn').onclick=useLocation;$('voiceBtn').onclick=voiceControl;$('menuBtn').onclick=mapTools;
}
function show(html){$('panel').innerHTML=html;$('panel').classList.add('show')}function hide(){$('panel').classList.remove('show')}
function speak(t){if(!voiceOn||!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.94;u.pitch=1;speechSynthesis.speak(u)}
function fmtDist(m){return m>=1609.344?(m/1609.344).toFixed(1)+' miles':Math.max(1,Math.round(m*1.09361))+' yards'}
function hav(a,b,c,d){const R=6371000,p=Math.PI/180,x=(b-a)*p,y=(d-c)*p,z=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function bearing(a,b,c,d){const p=Math.PI/180,y=Math.sin((d-b)*p)*Math.cos(c*p),x=Math.cos(a*p)*Math.sin(c*p)-Math.sin(a*p)*Math.cos(c*p)*Math.cos((d-b)*p);return (Math.atan2(y,x)*180/Math.PI+360)%360}
function nearestRouteDistance(lat,lon){let best=Infinity;for(const p of routeCoords)best=Math.min(best,hav(lat,lon,p[1],p[0]));return best}
async function search(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=8&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search unavailable');return r.json()}
async function find(){const q=$('q').value.trim();if(!q)return;show('<b>Searching UK places…</b>');try{const a=await search(q);if(!a.length){show('<b>No UK result found</b>');return}show('<b>Choose destination</b>'+a.map(x=>`<div class="result"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='choose(${JSON.stringify({lat:+x.lat,lon:+x.lon,name:x.display_name})})'>Route here</button></div></div>`).join(''))}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function choose(x){current=x;if(lastPos)routeTo(lastPos,x);else{map.flyTo({center:[x.lon,x.lat],zoom:15,pitch:45,duration:900});show('<b>Destination selected</b><div class="small">Press ◎ to start live navigation from your current position.</div><div class="actions"><button onclick="useLocation()">Use my location</button></div>')}}
async function routeTo(a,dest=current){if(!dest)return;try{show('<b>Planning driving route…</b>');const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=true`);if(!r.ok)throw Error('Routing unavailable');const j=await r.json();if(j.code!=='Ok')throw Error('No driving route found');const rt=j.routes[0];steps=rt.legs?.[0]?.steps||[];stepIndex=0;routeCoords=rt.geometry.coordinates||[];if(map.getLayer('route'))map.removeLayer('route');if(map.getSource('route'))map.removeSource('route');map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:rt.geometry}});map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#657449','line-width':8,'line-opacity':.9}});const b=routeBounds(routeCoords);map.fitBounds(b,{padding:{top:150,bottom:170,left:35,right:35},duration:800});updateTurn();renderRoutePreview(rt);speak('Route planned. '+Math.round(rt.duration/60)+' minutes. '+(steps[0]?.maneuver?.instruction||''));show(`<b>🧭 Route ready</b><div class="statgrid"><div class="stat"><small>Distance</small><b>${(rt.distance/1609.344).toFixed(1)} mi</b></div><div class="stat"><small>Drive time</small><b>${Math.round(rt.duration/60)} min</b></div></div><div class="notice"><b>${esc(steps[0]?.maneuver?.instruction||'Continue')}</b><br><span class="small">${fmtDist(steps[0]?.distance||0)}</span></div><div class="actions"><button onclick="startTracking()">▶ Start navigation</button><button class="secondary" onclick="showRoutePreview()">Route preview</button><button class="secondary" onclick="hide()">Close</button></div>`)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
function routeBounds(c){let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;for(const p of c){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1])}return [[minx,miny],[maxx,maxy]]}
function updateTurn(){const st=steps[stepIndex];if(!st){$('turnmain').textContent='Arrived';$('turnsub').textContent='Destination reached';$('lane').textContent='';return}$('turnmain').textContent=st.maneuver?.instruction||'Continue';$('turnsub').textContent=fmtDist(st.distance||0)+' • '+(stepIndex+1)+' of '+steps.length;$('turnicon').textContent=iconFor(st.maneuver?.type,st.maneuver?.modifier);const lanes=st.intersections?.[0]?.lanes||[];const valid=lanes.filter(x=>x.valid);$('lane').textContent=valid.length?'Lane guidance: '+valid.map(x=>x.indications?.join('/')).join(' • '):''}
function iconFor(t,m){if(t==='roundabout'||t==='rotary')return '⟳';if(t==='arrive')return '●';if(m?.includes('left'))return '↖';if(m?.includes('right'))return '↗';if(m==='uturn')return '↶';return '↑'}
function renderRoutePreview(rt){$('upaheadText').textContent=steps[0]?.name||'Route planned'}
function showRoutePreview(){show('<b>🛣️ Route preview</b><div class="small">Major turns and directions for this route.</div><div class="routepreview">'+steps.slice(0,18).map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div><b>${esc(s.maneuver?.instruction||'Continue')}</b><small>${fmtDist(s.distance||0)}${s.name?' • '+esc(s.name):''}</small></div></div>`).join('')+'</div><div class="actions"><button onclick="startTracking()">▶ Start navigation</button></div>')}
function mapTools(){show('<b>🧭 Driving tools</b><div class="menugrid"><button class="menubtn" onclick="showRoutePreview()"><span>↪</span>Turns & route</button><button class="menubtn" onclick="showUpAhead()"><span>⬆</span>Up ahead</button><button class="menubtn" onclick="showTripData()"><span>📊</span>Trip data</button><button class="menubtn" onclick="showTraffic()"><span>🚦</span>Traffic & road alerts</button><button class="menubtn" onclick="showDriverSettings()"><span>⚠</span>Driver alerts</button><button class="menubtn" onclick="showWeather()"><span>☁</span>Weather</button></div><div class="notice">MAPSUK uses open road/map data and browser services. Some live services may be unavailable or delayed.</div>')}
function showTripData(){const mins=Math.floor((trip.seconds||0)/60);show('<b>📊 Trip data</b><div class="statgrid"><div class="stat"><small>Speed</small><b>'+($('roadMeta').textContent.match(/(\d+) mph/)?.[1]||'—')+' mph</b></div><div class="stat"><small>Distance tracked</small><b>'+trip.miles.toFixed(1)+' mi</b></div><div class="stat"><small>Driving time</small><b>'+mins+' min</b></div><div class="stat"><small>Speed limit</small><b>'+$('speedLimit').textContent+'</b></div></div>')}
function showUpAhead(){const items=[];const cam=nearby.filter(x=>x.type==='camera').sort((a,b)=>a.distance-b.distance)[0];const light=nearby.filter(x=>x.type==='light').sort((a,b)=>a.distance-b.distance)[0];if(cam)items.push('📷 Speed camera • '+fmtDist(cam.distance));if(light)items.push('🚦 Traffic lights • '+fmtDist(light.distance));if(steps[stepIndex])items.push('↪ '+(steps[stepIndex].maneuver?.instruction||'Next turn')+' • '+fmtDist(steps[stepIndex].distance||0));show('<b>⬆ Up ahead</b>'+ (items.length?items.map(x=>`<div class="notice">${esc(x)}</div>`).join(''):'<div class="small">No mapped items nearby yet.</div>'))}
function showTraffic(){show('<b>🚦 Traffic & road alerts</b><div class="notice">MAPSUK currently shows mapped road hazards, traffic lights and speed cameras from open data. Full live traffic congestion requires a live traffic data service; it is not claimed as live when unavailable.</div><div id="trafficList">'+($('alerts').innerHTML||'<div class="small">No current alerts.</div>')+'</div>')}
function showDriverSettings(){show('<b>⚠ Driver alerts</b>'+toggle('speedWarn','Speed warning')+toggle('reducedTone','Reduced speed tone')+toggle('cameras','Speed/red-light camera proximity')+toggle('environment','Environmental-zone notices')+toggle('breaks','Break planning')+'<div class="small" style="margin-top:8px">Alerts are informational. Always follow posted road signs and local traffic rules.</div>')}
function toggle(k,label){return `<div class="toggle"><span>${label}</span><button class="${prefs[k]?'on':''}" onclick="prefs.${k}=!prefs.${k};showDriverSettings()">${prefs[k]?'ON':'OFF'}</button></div>`}
async function showWeather(){if(!lastPos){show('<b>☁ Weather</b><div class="small">Start GPS navigation to load local weather.</div>');return}show('<b>☁ Weather</b><div class="small">Loading current conditions…</div>');try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lastPos.lat}&longitude=${lastPos.lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`);const j=await r.json();show('<b>☁ Weather</b><div class="statgrid"><div class="stat"><small>Temperature</small><b>'+j.current.temperature_2m+'°C</b></div><div class="stat"><small>Wind</small><b>'+j.current.wind_speed_10m+' km/h</b></div></div><div class="small">Weather data from Open-Meteo.</div>')}catch(e){show('<b>Weather unavailable</b><div class="small">'+esc(e.message)+'</div>')}}
async function locationStatus(){let perm='unknown';try{if(navigator.permissions?.query){const q=await navigator.permissions.query({name:'geolocation'});perm=q.state}}catch(e){}return{perm,secure:window.isSecureContext,geo:!!navigator.geolocation}}
function gpsErrorText(e){if(e?.code===1)return 'Chrome reported permission denied. Check Android Location and Chrome site Location permission.';if(e?.code===2)return 'Chrome could not obtain a position. Move somewhere with a clearer GPS signal.';if(e?.code===3)return 'GPS request timed out. Try again with Location switched on.';return 'GPS error: '+(e?.message||'unknown')}
async function useLocation(){if(!navigator.geolocation){show('<b>GPS unavailable</b><div class="small">This browser does not expose geolocation.</div>');return}const st=await locationStatus();show('<b>📍 Checking GPS…</b><div class="small">Permission: '+esc(st.perm)+' • HTTPS: '+(st.secure?'yes':'no')+' • Geolocation API: '+(st.geo?'yes':'no')+'</div>');navigator.geolocation.getCurrentPosition(async p=>{lastPos={lat:p.coords.latitude,lon:p.coords.longitude};trip.start=Date.now();placeMarker(lastPos.lat,lastPos.lon);map.flyTo({center:[lastPos.lon,lastPos.lat],zoom:17,pitch:58,bearing:lastHeading,duration:800});setStatus('GPS LOCKED');$('roadMeta').textContent='GPS lock • ±'+Math.round(p.coords.accuracy||0)+' m';if(current)await routeTo(lastPos,current);startTracking()},async e=>{const again=await locationStatus();show('<b>📍 GPS could not start</b><div class="notice"><b>'+esc(gpsErrorText(e))+'</b></div><div class="small">Error code: '+esc(e?.code)+' • Permission: '+esc(again.perm)+' • HTTPS: '+(again.secure?'yes':'no')+'</div><div class="actions"><button onclick="useLocation()">Try GPS again</button><button class="secondary" onclick="showGpsHelp()">GPS help</button></div>');setStatus('GPS ERROR')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function showGpsHelp(){show('<b>📍 GPS troubleshooting</b><div class="small">1. Android Settings → Location → On.<br>2. Chrome → site controls → Permissions → Location → Allow.<br>3. Reload MAPSUK from the HTTPS GitHub Pages address.<br>4. Press ◎ again.</div>')}
function startTracking(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);if(!navigator.geolocation)return;watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});marker.addTo(map);hide();setStatus('NAVIGATING')}
function stopTracking(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}setStatus('GPS READY')}
function setStatus(x){$('status').textContent=x}
function placeMarker(lat,lon){marker.setLngLat([lon,lat]);markerEl.style.transform=`rotate(${lastHeading}deg)`}
async function onPosition(p){const lat=p.coords.latitude,lon=p.coords.longitude,acc=Math.round(p.coords.accuracy||0);let h=p.coords.heading;if(h==null||h<0){if(lastPos)h=bearing(lastPos.lat,lastPos.lon,lat,lon)}if(Number.isFinite(h))lastHeading=h;const moved=lastPos?hav(lastPos.lat,lastPos.lon,lat,lon):0;trip.miles+=moved/1609.344;trip.seconds=trip.start?Math.max(0,(Date.now()-trip.start)/1000):0;currentSpeedMph=p.coords.speed!=null?Math.max(0,p.coords.speed*2.23694):0;lastPos={lat,lon};placeMarker(lat,lon);map.easeTo({center:[lon,lat],zoom:Math.max(map.getZoom(),16.5),pitch:58,bearing:lastHeading,offset:[0,130],duration:450});$('roadMeta').textContent='GPS ±'+acc+' m • live driving view';if(steps.length){const st=steps[stepIndex],loc=st?.maneuver?.location;if(loc){const d=hav(lat,lon,loc[1],loc[0]);if(d<45&&stepIndex<steps.length-1){stepIndex++;updateTurn();const next=steps[stepIndex];speak(next?.maneuver?.instruction||'Continue');}}if(prefs.speedWarn&&roadInfo?.mph&&currentSpeedMph>roadInfo.mph+2)speak('You are above the mapped speed limit.');const off=nearestRouteDistance(lat,lon);if(off>70&&Date.now()-lastOffRoute>15000&&!rerouting){lastOffRoute=Date.now();reroute(lat,lon)}}await fetchRoadData(lat,lon);renderAlerts(lat,lon);updateUpAhead()}
async function reroute(lat,lon){if(!current)return;rerouting=true;speak('You are off route. Recalculating.');$('roadMeta').textContent='Off route • recalculating';await routeTo({lat,lon},current);rerouting=false}
function onPositionError(e){$('roadMeta').textContent='GPS '+(e.code===1?'permission denied':e.code===2?'unavailable':e.code===3?'timeout':'error')+' • '+(e.message||'check Location')}
function parseSpeed(v){if(!v)return null;const m=String(v).match(/(\d+(?:\.\d+)?)\s*(mph|km\/h|kph)?/i);if(!m)return null;let n=+m[1];if(/km/i.test(m[2]||''))n*=.621371;return Math.round(n)}
function implicitSpeed(t){if(t.maxspeed){const n=parseSpeed(t.maxspeed);if(n)return{mph:n,source:'mapped limit'}}const typ=String(t['maxspeed:type']||'');if(/GB:motorway/i.test(typ))return{mph:70,source:'national motorway'};if(/GB:nsl_dual/i.test(typ))return{mph:70,source:'national dual carriageway'};if(/GB:nsl_single/i.test(typ))return{mph:60,source:'national single carriageway'};if(t.highway==='motorway'||t.highway==='motorway_link')return{mph:70,source:'motorway default'};if(t.highway==='living_street')return{mph:20,source:'living street default'};if(t.highway==='residential')return{mph:30,source:'built-up default'};if(['primary','secondary','tertiary','unclassified'].includes(t.highway))return{mph:60,source:'national single-carriageway default'};return null}
async function fetchRoadData(lat,lon){if(Date.now()-lastFeatureFetch<8000)return;lastFeatureFetch=Date.now();const b=`${lat-.004},${lon-.006},${lat+.004},${lon+.006}`;const q=`[out:json][timeout:12];(way[highway](${b});node[highway=traffic_signals](${b});node[highway=speed_camera](${b}););out body geom;`;try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});if(!r.ok)throw 0;const j=await r.json();let best=null;nearby=[];for(const e of j.elements||[]){if(e.type==='way'&&e.geometry){let d=Infinity;for(const p of e.geometry)d=Math.min(d,hav(lat,lon,p.lat,p.lon));if(d<180&&(!best||d<best.distance))best={...implicitSpeed(e.tags||{}),distance:d,name:e.tags?.name||'',highway:e.tags?.highway||'',tags:e.tags||{}}}else if(e.type==='node'&&e.lat!=null){const d=hav(lat,lon,e.lat,e.lon);if(d<700)nearby.push({type:e.tags?.highway==='speed_camera'?'camera':'light',lat:e.lat,lon:e.lon,distance:d})} }roadInfo=best||null;if(best){$('speedLimit').textContent=best.mph+' mph';$('speedSource').textContent=best.source;$('roadName').textContent=best.name||'Road'}else{$('speedLimit').textContent='—';$('speedSource').textContent='Limit unknown'} }catch(e){} }
function renderAlerts(lat,lon){const a=[];const cam=nearby.filter(x=>x.type==='camera').sort((x,y)=>x.distance-y.distance)[0];const light=nearby.filter(x=>x.type==='light').sort((x,y)=>x.distance-y.distance)[0];if(prefs.cameras&&cam&&cam.distance<250)a.push(`<div class="alert camera">📷 Camera ${fmtDist(cam.distance)}</div>`);if(light&&light.distance<180)a.push(`<div class="alert light">🚦 Lights ${fmtDist(light.distance)}</div>`);if(roadInfo?.mph&&pSpeed()>roadInfo.mph+2)a.push('<div class="alert danger">⚠ Speed above mapped limit</div>');$('alerts').innerHTML=a.join('');if(prefs.cameras&&cam&&cam.distance<120&&cam.distance>60&&lastCamera!==Math.round(cam.lat*1e5)){lastCamera=Math.round(cam.lat*1e5);speak('Camera ahead, '+fmtDist(cam.distance))}if(light&&light.distance<100&&light.distance>45&&lastLight!==Math.round(light.lat*1e5)){lastLight=Math.round(light.lat*1e5);speak('Traffic lights ahead, '+fmtDist(light.distance))}}
function pSpeed(){return currentSpeedMph}
function updateUpAhead(){const st=steps[stepIndex];if(st){$('upaheadText').textContent=(st.maneuver?.instruction||'Continue')+' • '+fmtDist(st.distance||0)}else if(current)$('upaheadText').textContent='Destination'}
function toggleVoice(){voiceOn=!voiceOn;$('voiceBtn').textContent=voiceOn?'🔊':'🔇';$('voiceBtn').classList.toggle('active',voiceOn);if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();else speak('Voice guidance on')}
function voiceControl(){if(!('SpeechRecognition'in window||'webkitSpeechRecognition'in window)){toggleVoice();return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new R();r.lang='en-GB';r.interimResults=false;r.maxAlternatives=1;$('voiceBtn').textContent='🎙️';r.onresult=e=>{const q=e.results[0][0].transcript.trim();$('q').value=q;find()};r.onerror=()=>{$('voiceBtn').textContent=voiceOn?'🔊':'🔇'};r.onend=()=>{$('voiceBtn').textContent=voiceOn?'🔊':'🔇'};r.start()}
init();
