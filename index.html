/* V11 NEON 3D DRIVING SKIN — inspired by the supplied simulator layout */
:root{--neon-cyan:#00f0ff;--neon-pink:#ff007f;--neon-blue:#168cff;--neon-bg:#05050a;--neon-panel:rgba(7,12,24,.90);--neon-muted:#8a99ad}
body{background:var(--neon-bg)!important}
#map{inset:0;width:100%;height:100%;background:var(--neon-bg)!important;box-shadow:inset 0 -140px 160px rgba(0,0,0,.52)}
/* True driving-style visual treatment: tilt and rotate the map pane, not the whole UI. */

.leaflet-container{background:var(--neon-bg)!important}
.leaflet-tile-pane{filter:brightness(.58) saturate(1.45) contrast(1.18)}
.leaflet-overlay-pane{filter:drop-shadow(0 0 7px rgba(0,240,255,.34))}
.leaflet-control-attribution{background:rgba(5,5,10,.72)!important;color:#8290a3!important}
.leaflet-control-attribution a{color:#9db8c7!important}

.drive-active .nav-top{top:20px;left:50%;right:auto;width:90%;max-width:500px;height:58px;transform:translateX(-50%);gap:10px}
.drive-active .nav-back,.drive-active .nav-sound{width:42px;height:42px;background:rgba(5,5,10,.88);color:var(--neon-cyan);border:1px solid var(--neon-cyan);box-shadow:0 0 12px rgba(0,240,255,.35)}

.drive-active .nav-destination small{color:var(--neon-muted)}
.drive-active .nav-destination b{color:var(--neon-cyan);text-shadow:0 0 8px rgba(0,240,255,.5)}

.drive-active .instruction{top:88px;left:50%;right:auto;width:90%;max-width:500px;transform:translateX(-50%);min-height:76px;background:var(--neon-panel);border:2px solid var(--neon-cyan);border-left:5px solid var(--neon-cyan);border-radius:12px;box-shadow:0 0 18px rgba(0,240,255,.30);color:#fff}

<body>
<div id="app">
<div id="map"></div>
<div class="home-ui">
  <div class="home-top"><button class="profile-btn" onclick="toggleMenu()">☰</button><div class="home-search"><span>⌕</span><input id="q" placeholder="Search destination or postcode"><button onclick="find()">Search</button></div></div>
</div>
<div id="driveUI" class="drive-ui" style="display:none">
  <div class="nav-top"><button class="nav-back" onclick="stopNavigation()">‹</button><div class="nav-destination"><small>DESTINATION</small><b id="navDest">Navigation</b></div><button class="nav-sound" onclick="toggleVoice()">🔊</button></div>
  <div id="instruction" class="instruction"></div>
  <div class="routebar" id="routebar"></div>
  <div class="nav-side"><button class="map-btn" onclick="recenter()">⌖</button><button class="map-btn" onclick="toggleNorthUp()">N</button><button class="map-btn" onclick="toggleMenu()">⋮</button></div>

  <div id="speedWarning" class="speed-warning"></div><div id="roadAlert" class="road-alert"></div>
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-main"><div class="eta-block"><b id="etaValue">--:--</b><span>arrival</span></div><div class="remain-block"><b id="remainValue">—</b><span>remaining</span></div><div class="speed-block"><b id="speedValue">0</b><span>mph</span></div><div class="limit-block"><b id="limitValue">—</b><span>limit</span></div></div>
    <div class="sheet-road"><span id="currentRoad">Locating road…</span><span id="navStatus">GPS ready · Route guidance</span></div>
  </div>
</div>
<div id="panel" class="panel"></div>

<div id="menu" class="menu"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false}).setView([54.5,-3.4],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors',crossOrigin:true}).addTo(map);
setTimeout(()=>map.invalidateSize(false),100);
let northUp=false, lastDisplayRoad='', lastGpsFix=0, lastValidGps=null;
let compassHeading=null, compassListening=false;
let routeLayer=null,myMarker=null,destMarker=null,current=null,watchId=null,routeSteps=[],stepIndex=0,routeGeo=null,routeMeta=null,voiceOn=true,driveMode=false,lastPos=null,lastReroute=0,offRouteSince=0,wrongWaySince=0,announced={},trafficCache=[],trafficFetchedAt=0,heading=null,speedLimit=null,speedLimitLabel=null,speedLimitFetchedAt=0,roadRuleFetchedAt=0,roadRuleState=null,lastCameraMove=0,mapHeading=0;
const P=document.getElementById('panel'),UI=document.getElementById('driveUI'),INS=document.getElementById('instruction'),RB=document.getElementById('routebar'),ST=document.getElementById('stats'),TOAST=document.getElementById('toast'),MENU=document.getElementById('menu'),LANE=document.getElementById('laneCue');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();find();}});
document.getElementById('q').addEventListener('click',e=>e.stopPropagation());
document.querySelector('.home-search button')?.addEventListener('click',e=>{e.stopPropagation();});
document.querySelector('.profile-btn')?.addEventListener('click',e=>{e.stopPropagation();});
window.addEventListener('resize',()=>map.invalidateSize(false));
setTimeout(()=>map.invalidateSize(false),250);
// V16.1: hard-reset the inactive navigation layer so it can never intercept home-screen taps.
UI.style.display='none';
document.body.classList.remove('drive-active');
window.__muk86HeadingFusionReady=true;
function startCompassFallback(){
  if(compassListening || !window.DeviceOrientationEvent)return;
  const handler=e=>{
    let h=null;
    if(Number.isFinite(e.webkitCompassHeading)) h=e.webkitCompassHeading;
    else if(Number.isFinite(e.alpha)) h=(360-e.alpha)%360;
    if(Number.isFinite(h)) compassHeading=(h+360)%360;
  };
  try{window.addEventListener('deviceorientationabsolute',handler,true);window.addEventListener('deviceorientation',handler,true);compassListening=true;}catch(e){compassListening=false;}
}
startCompassFallback();

const saved=()=>JSON.parse(localStorage.getItem('muk86.saved')||'[]'); const save=a=>localStorage.setItem('muk86.saved',JSON.stringify(a));
function show(x){P.innerHTML=x;P.classList.add('show')} function hide(){P.classList.remove('show')}
function toast(x){TOAST.textContent=x;TOAST.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>TOAST.classList.remove('show'),3000)}
function toggleVoice(){voiceOn=!voiceOn;toast(voiceOn?'Voice navigation on':'Voice navigation off');if(voiceOn&&lastPos)speak('Voice navigation on')}
function toggleNorthUp(){northUp=!northUp;if(northUp){setMapRotation(0);toast('North up')}else if(lastPos?.heading!=null){setMapRotation(lastPos.heading);toast('Direction up')}}
function toggleMenu(){MENU.classList.toggle('show');MENU.innerHTML=`<button onclick="newRoute();toggleMenu()">🚗 New route</button><button onclick="showSaved();toggleMenu()">🏷️ Saved places</button><button onclick="toggleVoice();toggleMenu()">${voiceOn?'🔊 Voice on':'🔇 Voice off'}</button><button onclick="toggleNorthUp();toggleMenu()">${northUp?'🧭 North up':'🧭 Direction up'}</button><button onclick="stopNavigation();toggleMenu()">⏹ Stop navigation</button>`}
function formatDistance(m){if(m<1000)return Math.max(5,Math.round(m/5)*5)+' yd';return (m/1609.344).toFixed(m<16093?1:0)+' mi'}
function speak(t){if(!voiceOn||!('speechSynthesis'in window)||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.96;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
function bearing(a,b){const r=Math.PI/180,la=a.lat*r,lb=b.lat*r,dl=(b.lon-a.lon)*r;return (Math.atan2(Math.sin(dl)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dl))*180/Math.PI+360)%360}
function angleDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d}
function hav(a,b){const R=6371000,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lon-a.lon)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function nearestOnRoute(p){
 if(!routeGeo?.coordinates?.length)return {d:Infinity,index:0};
 const cs=routeGeo.coordinates;let best={d:Infinity,index:0,point:{lat:cs[0][1],lon:cs[0][0]},fraction:0};
 const lat0=p.lat*Math.PI/180, kx=111320*Math.cos(lat0), ky=111320;
 const px=(p.lon)*kx, py=(p.lat)*ky;
 for(let i=0;i<cs.length-1;i++){
   const ax=cs[i][0]*kx, ay=cs[i][1]*ky, bx=cs[i+1][0]*kx, by=cs[i+1][1]*ky;
   const dx=bx-ax,dy=by-ay,den=dx*dx+dy*dy;
   const t=den?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/den)):0;
   const qx=ax+t*dx,qy=ay+t*dy;
   const q={lat:qy/ky,lon:qx/kx};
   const d=Math.hypot(px-qx,py-qy);
   if(d<best.d)best={d,index:i,point:q,fraction:t};
 }
 return best;
}
function routeBearingAt(index){if(!routeGeo?.coordinates?.length)return null;const cs=routeGeo.coordinates;const i=Math.min(Math.max(index,0),cs.length-2);const j=Math.min(cs.length-1,i+Math.max(2,Math.floor(cs.length/180)));return bearing({lat:cs[i][1],lon:cs[i][0]},{lat:cs[j][1],lon:cs[j][0]})}
function maneuverLabel(st){const m=st?.maneuver||{};const t=m.type||'';const mod=m.modifier||'';if(t==='arrive')return 'You have arrived';if(t==='depart')return 'Continue ahead';if(t==='roundabout'||t==='rotary'){const ex=m.exit||st?.exit;if(ex)return `Take the ${ordinal(ex)} exit`;return mod==='left'?'Take the roundabout left':'Take the roundabout';}if(t==='fork')return mod==='left'?'Keep left':'Keep right';if(t==='merge')return mod==='left'?'Merge left':'Merge right';if(t==='on ramp')return mod==='left'?'Take the slip road left':'Take the slip road right';if(t==='off ramp')return mod==='left'?'Take the exit left':'Take the exit right';if(t==='new name')return 'Continue';if(mod==='left')return 'Turn left';if(mod==='right')return 'Turn right';if(mod==='slight left')return 'Keep left';if(mod==='slight right')return 'Keep right';if(mod==='sharp left')return 'Turn sharp left';if(mod==='sharp right')return 'Turn sharp right';return 'Continue ahead'}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function stepDistance(st){return Math.max(0,st?st._distance||st.distance||0:0)}
function roadName(st){return st?.name||st?.ref||''}
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search service unavailable');return r.json()}
async function find(){const q=document.getElementById('q').value.trim();if(!q)return;show('<b>Searching…</b>');try{const d=await geo(q);if(!d.length){show('<b>No UK result found</b><div class="small">Try a full address or postcode.</div>');return}show(d.map(x=>`<div class="item"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='selectPlace(${JSON.stringify(x)})'>Select</button><button class="secondary" onclick='routeTo(${JSON.stringify(x)})'>Route</button></div></div>`).join(''))}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function selectPlace(x){current={lat:+x.lat,lon:+x.lon,name:x.display_name};map.setView([current.lat,current.lon],17);if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([current.lat,current.lon]).addTo(map);show(`<b>${esc(current.name.split(',')[0])}</b><div class="small">${esc(current.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(current)})'>🚗 Route here</button><button class="secondary" onclick='savePlace(${JSON.stringify(current)})'>Save</button></div>`)}
function savePlace(p){let a=saved();if(!a.some(x=>hav(x,p)<15))a.push({...p,id:Date.now()});save(a);toast('Place saved');}
function showSaved(){const a=saved();show('<b>Saved places</b>'+ (a.length?a.map(x=>`<div class="item"><b>${esc(x.name.split(',')[0])}</b><div class="small">${esc(x.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(x)})'>Route</button><button class="danger" onclick='deleteSaved(${x.id})'>Delete</button></div></div>`).join(''):'<div class="small">Nothing saved yet.</div>'))}
function deleteSaved(id){save(saved().filter(x=>x.id!==id));showSaved()}
function newRoute(){current=null;hide();document.getElementById('q').focus()}
function routeTo(p){current={lat:+p.lat,lon:+p.lon,name:p.name||p.display_name};useLocationForRoute()}
function useLocationForRoute(){if(!navigator.geolocation){manualStart();return}show('<b>Getting your location…</b><div class="small">High-accuracy GPS is required for live navigation.</div>');navigator.geolocation.getCurrentPosition(async pos=>{try{await buildRoute({lat:pos.coords.latitude,lon:pos.coords.longitude},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}},()=>manualStart(),{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function manualStart(){show(`<b>Starting point</b><div class="searchbox" style="box-shadow:none;border:1px solid #ddd;margin-top:8px"><input id="start" placeholder="Start postcode or address"><button onclick="manualRoute()">Go</button></div>`)}
async function manualRoute(){const q=document.getElementById('start').value.trim();if(!q)return;try{const d=await geo(q);if(!d.length)throw Error('Starting point not found');await buildRoute({lat:+d[0].lat,lon:+d[0].lon},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
function makeGraphicalRoute(geo){
 const group=L.featureGroup();
 L.geoJSON(geo,{style:{color:'#001d2a',weight:14,opacity:.92,lineCap:'round',lineJoin:'round',className:'route-casing'}}).addTo(group);
 L.geoJSON(geo,{style:{color:'#00f0ff',weight:6,opacity:.98,lineCap:'round',lineJoin:'round'}}).addTo(group);
 return group;
}

async function buildRoute(a,dest,startLive=false,rerouting=false){
 const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=true`;
 const r=await fetch(u);if(!r.ok)throw Error('Routing service unavailable');
 const j=await r.json();if(j.code!=='Ok')throw Error('No driving route found');
 const rt=j.routes[0];routeMeta={distance:rt.distance,duration:rt.duration};routeGeo=rt.geometry;
 routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]);stepIndex=0;let cum=0;
 routeSteps.forEach(s=>{s._startDist=cum;s._distance=s.distance||0;cum+=s.distance||0;const loc=s.maneuver?.location;if(loc&&routeGeo?.coordinates?.length){let bi=0,bd=Infinity;for(let i=0;i<routeGeo.coordinates.length;i++){const c=routeGeo.coordinates[i],d=hav({lat:c[1],lon:c[0]},{lat:loc[1],lon:loc[0]});if(d<bd){bd=d;bi=i;}}s._routeIndex=bi;}});
 if(routeLayer)map.removeLayer(routeLayer);routeLayer=makeGraphicalRoute(rt.geometry).addTo(map);
 if(destMarker)destMarker.setLatLng([dest.lat,dest.lon]);else destMarker=L.marker([dest.lat,dest.lon]).addTo(map);
 if(startLive||rerouting){if(destMarker&&map.hasLayer(destMarker))map.removeLayer(destMarker);}
 if(!myMarker)myMarker=L.marker([a.lat,a.lon],{icon:carIcon(),zIndexOffset:1000}).addTo(map);else myMarker.setLatLng([a.lat,a.lon]);
 driveMode=true;document.body.classList.add('drive-active');UI.style.display='block';
 resetNavigationState();
 document.getElementById('navDest').textContent=(current?.name||'Navigation').split(',')[0];
 hide();
 initialiseActiveStep(a);
 const initialNear=nearestOnRoute(a);
 const initialHeading=routeBearingAt(initialNear.index);
 if(startLive||rerouting){
   if(initialHeading!=null&&!northUp)setMapRotation(initialHeading);
   const camHeading=northUp?null:(initialHeading??lastPos?.heading);
   map.setView(camHeading==null?[a.lat,a.lon]:lookAheadCenter(a,camHeading),18.2,{animate:false});
   if(rerouting){document.getElementById('navStatus').textContent='Route updated';}
 }else{
   map.fitBounds(routeLayer.getBounds(),{padding:[70,70]});
 }
 renderDrive(a);
 if(startLive&&!rerouting)startTracking();
 if(startLive&&!rerouting)speak('Route planned. '+formatDistance(rt.distance)+' to go.');
}

function resetNavigationState(){announced={};offRouteSince=0;wrongWaySince=0;speedLimit=null;speedLimitLabel=null;speedLimitFetchedAt=0;roadRuleFetchedAt=0;roadRuleState=null;mapHeading=0;setMapRotation(0);}
function distanceToStep(p,st){const loc=st?.maneuver?.location;if(loc)return hav(p,{lat:loc[1],lon:loc[0]});return stepDistance(st);}
function mph(v){return Math.max(0,Math.round(v*2.236936));}
function parseSpeedLimit(v){if(v==null)return null;const x=String(v).toLowerCase().trim();if(!x||['none','signals','variable'].includes(x))return null;if(x==='national'||x==='nsl'){speedLimitLabel='NSL';return null}const n=x.match(/\d+(?:\.\d+)?/);if(n){speedLimitLabel=Math.round(parseFloat(n[0]))+' mph';return Math.round(parseFloat(n[0]));}return null;}
function updateSpeedWarning(speed){const el=document.getElementById('speedWarning');if(!speedLimit||speed<1){el.classList.remove('show');return}const over=speed>speedLimit+3;if(over){el.textContent=`SLOW DOWN — ${mph(speed)} mph / ${speedLimit} mph limit`;el.classList.add('show');}else el.classList.remove('show');}
function updateStats(p){
 const speed=mph(p?.speed||0), lim=speedLimit;
 const near=nearestOnRoute(p);
 let remaining=routeMeta?.distance||0;
 if(routeGeo?.coordinates?.length){
   const idx=Math.min(near.index,routeGeo.coordinates.length-2);
   let rem=hav(near.point,{lat:routeGeo.coordinates[idx+1][1],lon:routeGeo.coordinates[idx+1][0]});
   for(let i=idx+1;i<routeGeo.coordinates.length-1;i++){rem+=hav({lat:routeGeo.coordinates[i][1],lon:routeGeo.coordinates[i][0]},{lat:routeGeo.coordinates[i+1][1],lon:routeGeo.coordinates[i+1][0]});}
   if(Number.isFinite(rem)&&rem>=0) remaining=rem;
 }
 const secs=speed>2?Math.max(0,remaining/speed):routeMeta?.duration||0;
 const arrival=new Date(Date.now()+secs*1000);
 const eta=arrival.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 document.getElementById('etaValue').textContent=eta;
 document.getElementById('remainValue').textContent=formatDistance(remaining);
 document.getElementById('speedValue').textContent=String(speed);
 document.getElementById('limitValue').textContent=lim?lim+'':(speedLimitLabel||'—');
 document.getElementById('currentRoad').textContent=lastDisplayRoad||'Following route';
 document.getElementById('navStatus').textContent=p?._snapped?'GPS route-locked':p?.accuracy<20?'GPS strong':p?.accuracy<50?'GPS good':p?.accuracy<80?'GPS weak':'GPS searching';
 updateSpeedWarning(p?.speed||0);
}
function applyMapVisual(){
 const mapRoot=document.getElementById('map');
 const el=myMarker?.getElement?.();
 const car=el?.querySelector('.car-arrow');
 const h=northUp?0:mapHeading;
 // V20 TRUE FORWARD CAMERA: apply perspective to the stable #map viewport.
 // Leaflet continually rewrites mapPane transforms when setView() runs, so pitching
 // mapPane itself is unreliable. The outer map viewport remains under our control.
 if(mapRoot){
   if(northUp){
     mapRoot.style.transform='none';
   }else{
     mapRoot.style.transform=`perspective(900px) rotateX(58deg) rotateZ(${-h}deg) scale(1.62)`;
     mapRoot.style.transformOrigin='50% 92%';
   }
 }
 // The vehicle arrow is deliberately counter-pitched so it remains readable and
 // visually sits on the road rather than lying flat with the map.
 if(car){
   car.style.transform=`rotateX(-58deg) rotateZ(${h}deg)`;
   car.style.transformOrigin='50% 50%';
 }
 const pane=map.getPane('mapPane');
 if(pane){
   // V21: never pitch/rotate Leaflet's mapPane. The outer #map camera owns the
   // perspective, so route geometry, road tiles and the vehicle stay in one
   // coordinate system and cannot visually drift apart.
   pane.style.transform='';
   pane.style.transformOrigin='50% 92%';
   const counter=`${h}deg`;
   document.querySelectorAll('.leaflet-marker-icon,.leaflet-tooltip,.leaflet-popup,.route-direction').forEach(node=>node.style.setProperty('--label-counter-rotate',counter));
 }
}
function setMapRotation(h){if(h==null)return;mapHeading=((h%360)+360)%360;applyMapVisual();}
function smoothHeading(a,b){if(a==null)return b;if(b==null)return a;let d=((b-a+540)%360)-180;return (a+d*.28+360)%360;}
function lookAheadCenter(p,h){if(h==null)return [p.lat,p.lon];const dist=250;const r=dist/111320,lonr=dist/(111320*Math.cos(p.lat*Math.PI/180));return [p.lat+Math.cos(h*Math.PI/180)*r,p.lon+Math.sin(h*Math.PI/180)*lonr];}
function resetRoadAlert(){const el=document.getElementById('roadAlert');el.classList.remove('show');}
function showRoadAlert(msg){const el=document.getElementById('roadAlert');el.textContent=msg;el.classList.add('show');}
function roadSegmentDistance(p,a,b){const meanLat=p.lat*Math.PI/180, x1=(a.lon-p.lon)*Math.cos(meanLat),y1=a.lat-p.lat,x2=(b.lon-p.lon)*Math.cos(meanLat),y2=b.lat-p.lat;const dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,(0-x1)*dx+(0-y1)*dy)/(dx*dx+dy*dy||1));const q={lat:p.lat+(y1+t*dy),lon:p.lon+(x1+t*dx)/Math.cos(meanLat)};return {d:hav(p,q),q};}
async function roadDataCheck(p){if(Date.now()-roadRuleFetchedAt<12000)return;roadRuleFetchedAt=Date.now();try{const q=`[out:json][timeout:7];(way(around:90,${p.lat},${p.lon})[highway];node(around:120,${p.lat},${p.lon})[traffic_sign~"GB:616",i];);out tags geom;`;const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)return;const j=await r.json();const noEntry=(j.elements||[]).filter(e=>e.type==='node'&&String(e.tags?.traffic_sign||'').toUpperCase().includes('GB:616'));if(noEntry.length&&p.heading!=null){for(const n of noEntry){const d=hav(p,{lat:n.lat,lon:n.lon}),b=bearing(p,{lat:n.lat,lon:n.lon});if(d<90&&angleDiff(p.heading,b)<40){showRoadAlert('⚠ NO-ENTRY SIGN AHEAD');const key='noentry-'+Math.round(n.lat*1e5)+'-'+Math.round(n.lon*1e5);if(!announced[key]){announced[key]=1;speak('Warning. No entry sign ahead.');}break;}}}let best=null;for(const w of (j.elements||[])){const g=w.geometry||[];for(let i=1;i<g.length;i++){const z=roadSegmentDistance(p,{lat:g[i-1].lat,lon:g[i-1].lon},{lat:g[i].lat,lon:g[i].lon});if(!best||z.d<best.d)best={d:z.d,tags:w.tags||{},a:g[i-1],b:g[i]};}}if(!best||best.d>45)return;const t=best.tags||{};speedLimit=parseSpeedLimit(t.maxspeed)||speedLimit;const one=t.oneway;let wrongOneWay=false;if(['yes','true','1'].includes(String(one).toLowerCase())){const rb=bearing(best.a,best.b);wrongOneWay=angleDiff(p.heading||rb,rb)>115;}else if(String(one).toLowerCase()==='-1'){const rb=bearing(best.b,best.a);wrongOneWay=angleDiff(p.heading||rb,rb)>115;}roadRuleState={wrongOneWay,road:t.name||t.ref||'',oneway:one,access:t.access||'',vehicle:t.vehicle||'',highway:t.highway||''};if(wrongOneWay){showRoadAlert('⚠ WRONG-WAY / NO-ENTRY ROAD');const key='oneway-warning';if(!announced[key]){announced[key]=1;speak('Warning. You appear to be travelling against the road direction.');}}else if(['no','private'].includes(String(t.access||'').toLowerCase())||['no','private'].includes(String(t.vehicle||'').toLowerCase())){showRoadAlert('⚠ ROAD ACCESS RESTRICTION');}else resetRoadAlert();}catch(e){}}
async function speedLimitCheck(p){if(Date.now()-speedLimitFetchedAt<15000)return;speedLimitFetchedAt=Date.now();await roadDataCheck(p);}
function snapNavigationPosition(p){
  if(!routeGeo?.coordinates?.length)return p;
  const near=nearestOnRoute(p);
  const lowSpeed=(p.speed||0)<=2.25; // about 5 mph
  // At low speed, GPS can wander around the carriageway/nearby buildings.
  // When the raw fix is close to our planned route, draw the vehicle on the
  // route itself and use the route segment for its heading.
  if(lowSpeed && near.d<=45){
    const snapped={...p,lat:near.point.lat,lon:near.point.lon,_snapped:true,_rawLat:p.lat,_rawLon:p.lon};
    const rb=routeBearingAt(near.index);
    if(rb!=null)snapped.heading=rb;
    return snapped;
  }
  return p;
}
function startTracking(){if(!navigator.geolocation)return;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:500,timeout:12000});toast('Live navigation started'); document.getElementById('navStatus').textContent='GPS acquiring…'}
function stopNavigation(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}driveMode=false;hide();document.body.classList.remove('drive-active');UI.style.display='none';document.querySelector('.home-ui')?.style.removeProperty('display');ST.style.display='none';INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');document.getElementById('speedWarning').classList.remove('show');resetRoadAlert();mapHeading=0;applyMapVisual();if('speechSynthesis'in window)speechSynthesis.cancel();toast('Navigation stopped')}
function recenter(){if(lastPos){const h=northUp?null:lastPos.heading;const c=h==null?[lastPos.lat,lastPos.lon]:lookAheadCenter(lastPos,h);map.setView(c,18.2,{animate:false});if(h!=null)setMapRotation(h)}}
function onPositionError(e){if(e.code===1)toast('Allow Location for MUK SATNAV 86');else toast('GPS signal unavailable')}
async function onPosition(pos){
 const c=pos.coords;
 const p={lat:c.latitude,lon:c.longitude};
 p.accuracy=c.accuracy||999;
 p.speed=Number.isFinite(c.speed)?Math.max(0,c.speed):0;
 // Reject obvious GPS jumps before moving the vehicle/camera.
 if(lastValidGps){
   const jump=hav(lastValidGps,p);
   const dt=Math.max(.5,(Date.now()-lastGpsFix)/1000);
   const implied=jump/dt;
   if((p.accuracy>80&&jump>35)||(implied>55&&jump>45)){toast('GPS stabilising…');return;}
 }
 lastGpsFix=Date.now(); lastValidGps=p;
 const movingGpsHeading=Number.isFinite(c.heading)&&c.heading>=0&&p.speed>2?c.heading:null;
 const movingBearing=(lastPos&&p.speed>2)?bearing(lastPos,p):null;
 const routeHeading=routeGeo?.coordinates?.length?routeBearingAt(nearestOnRoute(p).index):null;
 // Heading fusion: moving GPS course first; while stationary/very slow, prefer the active route geometry;
 // use device orientation only as a fallback when there is no usable route heading.
 const rawHeading=p.speed>2?(movingGpsHeading??movingBearing):(routeHeading??compassHeading??lastPos?.heading??null);
 p.heading=rawHeading==null?null:smoothHeading(lastPos?.heading,rawHeading);
 // Snap the navigation position only when it is close enough to the active
 // route and moving slowly; never use this to hide a genuine off-route drive.
 p=snapNavigationPosition(p);
 lastPos=p;
 if(!myMarker)myMarker=L.marker([p.lat,p.lon],{icon:carIcon(),zIndexOffset:1000}).addTo(map);else myMarker.setLatLng([p.lat,p.lon]);
 if(p.heading!=null&&!northUp){
   const c2=lookAheadCenter(p,p.heading);
   map.setView(c2,18.2,{animate:false});
   setMapRotation(p.heading);
   // V19 camera: normal forward view, tighter look-ahead near manoeuvres.
   if(routeSteps.length){const ns=routeSteps[Math.min(stepIndex,routeSteps.length-1)];const nd=distanceToStep(p,ns);if(nd<190){const c3=lookAheadCenter(p,p.heading);map.setView(c3,18.8,{animate:false});}}
 } else {map.setView([p.lat,p.lon],18.2,{animate:false});applyMapVisual();}
 await speedLimitCheck(p);
 const near=nearestOnRoute(p);
 if(routeGeo?.coordinates?.length){let candidate='';for(const st of routeSteps){if(st._routeIndex!=null&&st._routeIndex<=near.index&&roadName(st))candidate=roadName(st);}if(candidate)lastDisplayRoad=candidate;}
 updateStats(p);
 if(!routeSteps.length)return;await navigationEngine(p);
}
async function navigationEngine(p){
 const near=nearestOnRoute(p);
 if(near.d>48 && (p.accuracy<65 || p.speed>4)){
   if(!offRouteSince)offRouteSince=Date.now();
   if(Date.now()-offRouteSince>1100&&Date.now()-lastReroute>5000){
     toast('Off route — recalculating'); speak('You are off route. Recalculating.'); lastReroute=Date.now();
     try{await buildRoute(p,current,false,true);offRouteSince=0;return}catch(e){toast('Unable to recalculate right now')}
   }
 }else offRouteSince=0;
 const rb=routeBearingAt(near.index);
 if(p.heading!=null&&p.accuracy<55&&near.d<50&&rb!=null&&angleDiff(p.heading,rb)>115&&p.speed>3){
   if(!wrongWaySince)wrongWaySince=Date.now();
   if(Date.now()-wrongWaySince>900&&Date.now()-lastReroute>5000){
     toast('Wrong direction — recalculating'); speak('Wrong direction. Recalculating.'); lastReroute=Date.now();
     try{await buildRoute(p,current,false,true);wrongWaySince=0;return}catch(e){}
   }
 }else wrongWaySince=0;
 let st=routeSteps[stepIndex]; if(!st)return;
 const distTo=distanceToStep(p,st), type=st.maneuver?.type||'';
 // Advance only when the vehicle has actually reached the manoeuvre, never while parked at route start.
 if(actionableStep(st)&&distTo<28&&stepIndex<routeSteps.length-1){
   stepIndex++;
   while(stepIndex<routeSteps.length-1&&!actionableStep(routeSteps[stepIndex]))stepIndex++;
   const n=routeSteps[stepIndex],key='step'+stepIndex;
   if(!announced[key]){announced[key]=1;speak(announcementForStep(n));}
   renderDrive(p); return;
 }
 // Ignore the artificial depart step for spoken/displayed manoeuvre warnings.
 if(!actionableStep(st)){renderDrive(p);return;}
 const key='warn'+stepIndex;
 const thresholds=(type==='roundabout'||type==='rotary')?[145,78,34]:[520,190,45];
 if(distTo<thresholds[0]&&!announced[key+'a']){
   announced[key+'a']=1;
   const txt=type==='roundabout'||type==='rotary'?`Roundabout ahead in ${formatDistance(distTo)}. ${mannerRoundabout(st)}`:`Junction ahead in ${formatDistance(distTo)}. ${manner(st)}${roadName(st)?' onto '+roadName(st):''}.`;
   speak(txt);
 }
 if(distTo<thresholds[1]&&!announced[key+'b']){announced[key+'b']=1;speak(type==='roundabout'||type==='rotary'?mannerRoundabout(st):`${manner(st)} in ${formatDistance(distTo)}.`)}
 if(distTo<thresholds[2]&&!announced[key+'c']){announced[key+'c']=1;speak(type==='roundabout'||type==='rotary'?mannerRoundabout(st):manner(st)+' now.')}
 await trafficLightAlert(p); await roadDataCheck(p); renderDrive(p);
 if(type==='arrive'&&distTo<28){speak('You have arrived at your destination.');toast('You have arrived');stopNavigation()}
}

function manner(st){return maneuverLabel(st).toLowerCase()}
function mannerRoundabout(st){const ex=st.maneuver?.exit;return ex?`take the ${ordinal(ex)} exit`:'take the correct exit'}
async function trafficLightAlert(p){
 if(Date.now()-trafficFetchedAt>30000){try{const q=`[out:json][timeout:8];node(around:220,${p.lat},${p.lon})[highway=traffic_signals];out;`;const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(r.ok){const j=await r.json();trafficCache=(j.elements||[]).map(e=>({lat:e.lat,lon:e.lon}));trafficFetchedAt=Date.now()}}catch(e){}}
 if(!trafficCache.length||p.heading==null)return;
 for(const l of trafficCache){
   const d=hav(p,l);
   if(d>25&&d<135){
     const b=bearing(p,l);
     if(angleDiff(p.heading,b)<32){
       const near=nearestOnRoute(l);const carNear=nearestOnRoute(p);
       if(near.d<45&&near.index>=carNear.index){
         const key='light'+Math.round(l.lat*1e5)+'_'+Math.round(l.lon*1e5);
         if(!announced[key+'a']&&d<=125){announced[key+'a']=1;speak(`Traffic lights ahead in ${formatDistance(d)}.`);return}
         if(!announced[key+'b']&&d<=55){announced[key+'b']=1;speak('Traffic lights ahead.');return}
       }
     }
   }
 }
}

function carIcon(){
 const html='<div class="car-arrow" style="width:38px;height:52px;display:flex;align-items:flex-start;justify-content:center;font-size:42px;line-height:1;color:#168cff;filter:drop-shadow(0 0 5px #168cff) drop-shadow(0 0 12px rgba(0,240,255,.9));transform-origin:50% 50%">▲</div>';
 return L.divIcon({className:'muk-car',html,iconSize:[38,52],iconAnchor:[19,49]});
}
function actionableStep(st){
 const t=st?.maneuver?.type||'';
 return !['depart','arrive','new name'].includes(t);
}
function initialiseActiveStep(p){
 stepIndex=0;
 while(stepIndex<routeSteps.length && !actionableStep(routeSteps[stepIndex])) stepIndex++;
 if(stepIndex>=routeSteps.length) stepIndex=Math.max(0,routeSteps.length-1);
 // If the first actionable step is already behind the starting GPS point, advance once.
 while(stepIndex<routeSteps.length-1){
   const d=distanceToStep(p,routeSteps[stepIndex]);
   if(d>20) break;
   stepIndex++;
 }
 announced={};
}
function announcementForStep(st){
 const t=st?.maneuver?.type||'', m=st?.maneuver?.modifier||'';
 if(t==='roundabout'||t==='rotary') return mannerRoundabout(st);
 if(t==='on ramp') return m==='left'?'take the slip road left':m==='right'?'take the slip road right':'take the slip road';
 if(t==='off ramp') return m==='left'?'take the slip road left':m==='right'?'take the slip road right':'take the exit';
 return maneuverLabel(st).toLowerCase();
}
function laneMarkup(st){
 const lanes=st?.intersections?.[0]?.lanes;
 if(!Array.isArray(lanes)||!lanes.length)return '';
 const valid=lanes.filter(l=>l?.valid);
 if(!valid.length)return '';
 return '<div class="lane-cue-icon">'+valid.map(l=>{const a=l.indications||[];return a.includes('straight')?'↑':a.includes('slight right')?'↗':a.includes('right')?'→':a.includes('slight left')?'↖':a.includes('left')?'←':'↑'}).join(' ')+'</div><small>USE THE MARKED LANE</small>';
}
function renderDrive(p){
 if(!driveMode||!routeSteps.length)return;
 let st=routeSteps[Math.min(stepIndex,routeSteps.length-1)];
 while(st&&!actionableStep(st)&&stepIndex<routeSteps.length-1){stepIndex++;st=routeSteps[stepIndex];}
 if(!st){INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');document.body.classList.remove('complex-junction');return;}
 const d=distanceToStep(p,st), t=st.maneuver?.type||'', text=maneuverLabel(st);
 const complex=(t==='roundabout'||t==='rotary'||t==='fork'||t==='merge'||(st.intersections?.[0]?.lanes?.length>1))&&d<190;
 document.body.classList.toggle('complex-junction',complex);
 // Clean road-level presentation: no permanent instruction while the manoeuvre is distant.
 const visible=d<=520 || (t==='arrive'&&d<45);
 if(!visible){INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');return;}
 INS.innerHTML=`<div class="arrow">${maneuverArrow(st)}</div><div class="ins-main"><div class="big">${esc(text)}</div><div class="sub">${esc(roadName(st)||'Follow the route')}</div></div><div class="distance">${esc(formatDistance(d))}</div>`;
 INS.classList.add('show');
 RB.innerHTML=`<span class="nextroad">${esc(roadName(st)||'Next manoeuvre')}</span><span><b>${esc(formatDistance(d))}</b></span>`;RB.classList.add('show');
 const lm=laneMarkup(st);
 if(lm&&d<350){LANE.innerHTML=lm;LANE.classList.add('show')}else LANE.classList.remove('show');
}

function maneuverArrow(st){
 const t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';
 if(t==='roundabout'||t==='rotary')return '↻';
 if(t==='on ramp'||t==='off ramp')return m==='left'?'↖':m==='right'?'↗':'↑';
 if(m==='left'||m==='sharp left')return '←';
 if(m==='right'||m==='sharp right')return '→';
 if(m==='slight left')return '↖';
 if(m==='slight right')return '↗';
 return '↑';
}
