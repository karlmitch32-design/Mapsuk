<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUK SATNAV 86 — Free UK navigation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--nav:#111a12;--nav2:#243426;--cream:#f5f7f1;--ink:#111711;--muted:#657064;--route:#1f7cff;--routeGlow:#8fc4ff;--white:#fff;--amber:#ffbd2e;--green:#42d27a;--red:#ff5d5d;--shadow:0 8px 30px rgba(0,0,0,.34)}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:var(--ink);overflow:hidden}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--nav);color:#fff}button.secondary{background:#e9ece3;color:var(--nav)}button.danger{background:#f1dfdb;color:#8d352b}
#map{position:absolute;inset:0;z-index:1;background:#cfd6c8}.leaflet-control-attribution{font-size:8px;background:rgba(255,255,255,.72)!important}.leaflet-tile{filter:saturate(.9) contrast(1.04)}
.leaflet-marker-icon{transition:transform .18s linear}.car-icon{z-index:900!important}.car-body{width:34px;height:54px;border-radius:18px 18px 12px 12px;background:linear-gradient(#e9f3ff,#6da9ff);border:3px solid #fff;box-shadow:0 4px 14px #0008;position:relative}.car-body:before{content:"";position:absolute;left:6px;right:6px;top:7px;height:17px;border-radius:9px;background:#172331}.car-body:after{content:"";position:absolute;left:-5px;right:-5px;bottom:7px;height:5px;border-radius:4px;background:#fff;box-shadow:0 -35px 0 #fff}.car-arrow{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid #fff;filter:drop-shadow(0 2px 2px #0008)}
/* Dedicated-satnav driving UI */
.topbar{position:absolute;z-index:1200;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}.topbar>*{pointer-events:auto}.brand{background:rgba(255,255,255,.96);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);font-weight:950;letter-spacing:.6px;color:var(--nav)}.searchbox{flex:1;display:flex;gap:6px;background:rgba(255,255,255,.96);padding:5px;border-radius:10px;box-shadow:var(--shadow)}.searchbox input{flex:1;border:0;outline:0;padding:7px 9px;min-width:0}.searchbox button{padding:8px 12px}
.drive-ui{position:absolute;z-index:1300;left:0;right:0;top:0;bottom:0;pointer-events:none;display:none}.drive-ui>*{pointer-events:auto}
/* Large next manoeuvre panel, like a dedicated navigation unit */
.instruction{position:absolute;top:12px;left:10px;right:10px;background:linear-gradient(135deg,rgba(17,26,18,.98),rgba(36,52,38,.97));color:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(0,0,0,.42);min-height:104px;padding:10px 14px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.12);overflow:hidden}.instruction:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent 35%)}.arrow{font-size:58px;line-height:1;width:72px;text-align:center;font-weight:1000;color:#fff;text-shadow:0 3px 10px #000}.ins-main{flex:1;min-width:0;position:relative;z-index:1}.ins-main .big{font-size:25px;font-weight:1000;line-height:1.05;text-transform:uppercase;letter-spacing:.2px}.ins-main .sub{font-size:13px;color:#dce7dd;margin-top:7px;font-weight:750}.distance{font-size:30px;font-weight:1000;white-space:nowrap;color:#fff;position:relative;z-index:1}.distance:after{content:"";display:block;font-size:9px;color:#b9c7ba;letter-spacing:1px;text-align:right;margin-top:-3px}.routebar{position:absolute;top:124px;left:10px;right:10px;margin:0;background:rgba(8,13,9,.92);color:#fff;border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;display:flex;gap:14px;align-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.1)}.routebar span{font-size:11px;white-space:nowrap}.routebar b{font-size:13px}.routebar .nextroad{font-weight:850;flex:1;overflow:hidden;text-overflow:ellipsis;color:#dcebdc}
/* Bottom dedicated-navigation information strip */
.bottom{position:absolute;z-index:1300;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.bottom>*{pointer-events:auto}.stats{display:flex;gap:6px;background:rgba(255,255,255,.97);padding:6px;border-radius:11px;box-shadow:var(--shadow)}.stat{min-width:82px;padding:4px 8px;border-right:1px solid #ddd}.stat:last-child{border-right:0}.stat b{display:block;font-size:17px}.stat small{color:var(--muted);font-size:10px;font-weight:700}.controls{display:flex;gap:7px}.round{width:46px;height:46px;padding:0;border-radius:50%;box-shadow:var(--shadow);background:rgba(255,255,255,.97);color:var(--nav);font-size:20px}
.panel{position:absolute;z-index:1400;left:10px;right:10px;bottom:70px;background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:62%;overflow:auto;display:none}.panel.show{display:block}.small{font-size:12px;color:var(--muted);line-height:1.45}.notice{background:#f3f5ed;border:1px solid #dce2d3;padding:10px;border-radius:10px;margin-top:9px}.item{padding:11px 0;border-bottom:1px solid #e4e7df}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1}.row{display:flex;gap:7px}.row>*{flex:1}.toast{position:absolute;z-index:1500;left:50%;transform:translateX(-50%);bottom:82px;background:#242a20;color:#fff;padding:10px 15px;border-radius:12px;box-shadow:var(--shadow);display:none;font-weight:800}.toast.show{display:block}.menu{position:absolute;z-index:1401;right:10px;bottom:70px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:7px;display:none;width:210px}.menu.show{display:block}.menu button{width:100%;margin:2px 0;text-align:left;background:#fff;color:var(--ink)}.menu button:hover{background:#edf0e7}
/* Dedicated road-arrow / lane-style cue */
.lane-cue{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;background:linear-gradient(#fff,#eef3ec);border-radius:18px;box-shadow:0 8px 26px #0006;padding:9px 18px;font-size:38px;font-weight:1000;color:var(--nav);display:none;min-width:180px;text-align:center;border:2px solid rgba(39,49,30,.18)}.lane-cue small{display:block;font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:1000;margin-top:-5px}
@media(min-width:800px){.panel{width:440px;right:auto}.topbar{left:18px;right:18px}.instruction{left:18px;right:18px}.routebar{left:18px;right:18px}.bottom{left:18px;right:18px}.lane-cue{bottom:82px}}
.exit-chip{display:inline-block;background:#fff;color:#172219;border-radius:999px;padding:4px 8px;font-size:11px;vertical-align:middle;letter-spacing:.4px}.route-highlight{filter:drop-shadow(0 0 5px #8fc4ff)}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div class="topbar"><div class="brand">MUK SATNAV 86</div><div class="searchbox"><input id="q" placeholder="Search UK address or postcode"><button onclick="find()">Find</button></div></div>
<div id="driveUI" class="drive-ui" style="display:none"><div id="instruction" class="instruction"></div><div id="routebar" class="routebar"></div><div id="laneCue" class="lane-cue"></div></div>
<div id="panel" class="panel"></div>
<div id="toast" class="toast"></div>
<div id="menu" class="menu"></div>
<div class="bottom"><div id="stats" class="stats" style="display:none"></div><div class="controls"><button id="recenter" class="round" onclick="recenter()" title="Recenter">⌖</button><button class="round" onclick="toggleMenu()" title="Menu">☰</button></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false}).setView([54.5,-3.4],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routeLayer=null,routeGlow=null,myMarker=null,destMarker=null,current=null,watchId=null,routeSteps=[],stepIndex=0,routeGeo=null,routeMeta=null,voiceOn=true,driveMode=false,lastPos=null,lastReroute=0,offRouteSince=0,wrongWaySince=0,announced={},trafficCache=[],trafficFetchedAt=0,heading=null;
const P=document.getElementById('panel'),UI=document.getElementById('driveUI'),INS=document.getElementById('instruction'),RB=document.getElementById('routebar'),ST=document.getElementById('stats'),TOAST=document.getElementById('toast'),MENU=document.getElementById('menu'),LANE=document.getElementById('laneCue');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>JSON.parse(localStorage.getItem('muk86.saved')||'[]'); const save=a=>localStorage.setItem('muk86.saved',JSON.stringify(a));
function show(x){P.innerHTML=x;P.classList.add('show')} function hide(){P.classList.remove('show')}
function toast(x){TOAST.textContent=x;TOAST.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>TOAST.classList.remove('show'),3000)}
function toggleMenu(){MENU.classList.toggle('show');MENU.innerHTML=`<button onclick="newRoute();toggleMenu()">🚗 New route</button><button onclick="showSaved();toggleMenu()">🏷️ Saved places</button><button onclick="toggleVoice();toggleMenu()">${voiceOn?'🔊 Voice on':'🔇 Voice off'}</button><button onclick="stopNavigation();toggleMenu()">⏹ Stop navigation</button>`}
function formatDistance(m){if(m<1000)return Math.max(5,Math.round(m/5)*5)+' yd';return (m/1609.344).toFixed(m<16093?1:0)+' mi'}
function speak(t){if(!voiceOn||!('speechSynthesis'in window)||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.96;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
function bearing(a,b){const r=Math.PI/180,la=a.lat*r,lb=b.lat*r,dl=(b.lon-a.lon)*r;return (Math.atan2(Math.sin(dl)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dl))*180/Math.PI+360)%360}
function angleDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d}
function hav(a,b){const R=6371000,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lon-a.lon)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function nearestOnRoute(p){if(!routeGeo?.coordinates?.length)return {d:Infinity,index:0};let best={d:Infinity,index:0};for(let i=0;i<routeGeo.coordinates.length;i++){const c=routeGeo.coordinates[i],q={lat:c[1],lon:c[0]},d=hav(p,q);if(d<best.d)best={d,index:i,point:q}}return best}
function routeBearingAt(index){if(!routeGeo?.coordinates?.length)return null;const cs=routeGeo.coordinates;const i=Math.min(Math.max(index,0),cs.length-2);return bearing({lat:cs[i][1],lon:cs[i][0]},{lat:cs[i+1][1],lon:cs[i+1][0]})}
function maneuverLabel(st){const m=st?.maneuver||{};const t=m.type||'';const mod=m.modifier||'';if(t==='arrive')return 'You have arrived';if(t==='depart')return 'Continue ahead';if(t==='roundabout'||t==='rotary'){const ex=m.exit||st?.exit;if(ex)return `Take the ${ordinal(ex)} exit`;return mod==='left'?'Take the roundabout left':'Take the roundabout';}if(t==='fork')return mod==='left'?'Keep left':'Keep right';if(t==='merge')return mod==='left'?'Merge left':'Merge right';if(t==='on ramp')return mod==='left'?'Take the slip road left':'Take the slip road right';if(t==='off ramp')return mod==='left'?'Take the exit left':'Take the exit right';if(t==='new name')return 'Continue';if(mod==='left')return 'Turn left';if(mod==='right')return 'Turn right';if(mod==='slight left')return 'Keep left';if(mod==='slight right')return 'Keep right';if(mod==='sharp left')return 'Turn sharp left';if(mod==='sharp right')return 'Turn sharp right';return 'Continue ahead'}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function stepDistance(st){return Math.max(0,st?st._distance||st.distance||0:0)}
function roadName(st){return st?.name||st?.ref||''}
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search service unavailable');return r.json()}
async function find(){const q=document.getElementById('q').value.trim();if(!q)return;show('<b>Searching…</b>');try{const d=await geo(q);if(!d.length){show('<b>No UK result found</b><div class="small">Try a full address or postcode.</div>');return}show(d.map(x=>`<div class="item"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='selectPlace(${JSON.stringify(x)})'>Select</button><button class="secondary" onclick='routeTo(${JSON.stringify(x)})'>Route</button></div></div>`).join(''))}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function selectPlace(x){current={lat:+x.lat,lon:+x.lon,name:x.display_name};map.setView([current.lat,current.lon],17);if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([current.lat,current.lon]).addTo(map);show(`<b>${esc(current.name.split(',')[0])}</b><div class="small">${esc(current.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(current)})'>🚗 Route here</button><button class="secondary" onclick='savePlace(${JSON.stringify(current)})'>Save</button></div>`)}
function savePlace(p){let a=saved();if(!a.some(x=>hav(x,p)<15))a.push({...p,id:Date.now()});save(a);toast('Place saved');}
function showSaved(){const a=saved();show('<b>Saved places</b>'+ (a.length?a.map(x=>`<div class="item"><b>${esc(x.name.split(',')[0])}</b><div class="small">${esc(x.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(x)})'>Route</button><button class="danger" onclick='deleteSaved(${x.id})'>Delete</button></div></div>`).join(''):'<div class="small">Nothing saved yet.</div>'))}
function deleteSaved(id){save(saved().filter(x=>x.id!==id));showSaved()}
function newRoute(){current=null;hide();document.getElementById('q').focus()}
function routeTo(p){current={lat:+p.lat,lon:+p.lon,name:p.name||p.display_name};useLocationForRoute()}
function useLocationForRoute(){if(!navigator.geolocation){manualStart();return}show('<b>Getting your location…</b><div class="small">High-accuracy GPS is required for live navigation.</div>');navigator.geolocation.getCurrentPosition(async pos=>{try{await buildRoute({lat:pos.coords.latitude,lon:pos.coords.longitude},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}},()=>manualStart(),{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function manualStart(){show(`<b>Starting point</b><div class="searchbox" style="box-shadow:none;border:1px solid #ddd;margin-top:8px"><input id="start" placeholder="Start postcode or address"><button onclick="manualRoute()">Go</button></div>`)}
async function manualRoute(){const q=document.getElementById('start').value.trim();if(!q)return;try{const d=await geo(q);if(!d.length)throw Error('Starting point not found');await buildRoute({lat:+d[0].lat,lon:+d[0].lon},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
async function buildRoute(a,dest,startLive=false){const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=true`;const r=await fetch(u);if(!r.ok)throw Error('Routing service unavailable');const j=await r.json();if(j.code!=='Ok')throw Error('No driving route found');const rt=j.routes[0];routeMeta={distance:rt.distance,duration:rt.duration};routeGeo=rt.geometry;routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]);stepIndex=0;let cum=0;routeSteps.forEach(s=>{s._startDist=cum;s._distance=s.distance||0;cum+=s.distance||0});if(routeLayer)map.removeLayer(routeLayer);if(routeGlow)map.removeLayer(routeGlow);
 routeGlow=L.geoJSON(rt.geometry,{style:{color:'#ffffff',weight:13,opacity:.72,lineCap:'round',lineJoin:'round'}}).addTo(map);
 routeLayer=L.geoJSON(rt.geometry,{style:{color:'#1f7cff',weight:8,opacity:.98,lineCap:'round',lineJoin:'round',className:'route-highlight'}}).addTo(map);
 routeLayer.bringToFront();if(destMarker)destMarker.setLatLng([dest.lat,dest.lon]);else destMarker=L.marker([dest.lat,dest.lon]).addTo(map);if(!myMarker)myMarker=L.marker([a.lat,a.lon],{icon:carIcon()}).addTo(map);else myMarker.setLatLng([a.lat,a.lon]);map.fitBounds(routeLayer.getBounds(),{padding:[70,70]});driveMode=true;UI.style.display='block';renderDrive(a);if(startLive)startTracking();speak('Route planned. '+formatDistance(rt.distance)+' to go. '+announcementForStep(routeSteps[0],true));}
function carIcon(){return L.divIcon({className:'car-icon',html:'<div class="car-body"><span class="car-arrow"></span></div>',iconSize:[44,70],iconAnchor:[22,35]})}
function announcementForStep(st,initial=false){if(!st)return '';const label=maneuverLabel(st),name=roadName(st);if(st.maneuver?.type==='arrive')return 'You have arrived at your destination.';if(st.maneuver?.type==='roundabout'||st.maneuver?.type==='rotary')return `${initial?'':'At the roundabout, '}${label.toLowerCase()}${name?' onto '+name:''}.`;return `${label}${name?' onto '+name:''}.`}
function nextTurnIndex(){for(let i=stepIndex;i<routeSteps.length;i++){const t=routeSteps[i]?.maneuver?.type;if(t!=='depart'&&t!=='new name'&&t!=='notification')return i}return routeSteps.length-1}
function renderDrive(p){
 const st=routeSteps[stepIndex];if(!st)return;
 const d=stepDistance(st),label=maneuverLabel(st),name=roadName(st),m=st.maneuver?.modifier||'',type=st.maneuver?.type||'';
 let arrow='↑';if(m.includes('left'))arrow='↖';if(m.includes('right'))arrow='↗';if(type==='roundabout'||type==='rotary')arrow='↻';if(type==='arrive')arrow='🏁';
 const exitNo=(type==='roundabout'||type==='rotary')&&st.maneuver?.exit?`<span class="exit-chip">${ordinal(st.maneuver.exit)} EXIT</span>`:'';
 INS.innerHTML=`<div class="arrow">${arrow}</div><div class="ins-main"><div class="big">${esc(label)} ${exitNo}</div><div class="sub">${name?esc(name):(type==='roundabout'?'Roundabout ahead':'Follow the highlighted route')}</div></div><div class="distance">${formatDistance(d)}</div>`;
 RB.innerHTML=`<span><b>${formatDistance(routeMeta.distance)}</b> remaining</span><span><b>${Math.max(1,Math.round(routeMeta.duration/60))} min</b> ETA ${new Date(Date.now()+routeMeta.duration*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span><span class="nextroad">${esc(name||current?.name?.split(',')[0]||'Destination')}</span>`;
 ST.style.display='flex';ST.innerHTML=`<div class="stat"><b>${Math.round((lastPos?.speed||0)*2.23694)} mph</b><small>SPEED</small></div><div class="stat"><b>${formatDistance(routeMeta.distance)}</b><small>REMAINING</small></div><div class="stat"><b>${Math.max(1,Math.round(routeMeta.duration/60))} min</b><small>ETA</small></div>`;
 let lane='';if(type==='roundabout'||type==='rotary')lane=st.maneuver?.exit?`↻ ${ordinal(st.maneuver.exit)} EXIT`:'↻ ROUNDABOUT';else if(m.includes('left'))lane='←';else if(m.includes('right'))lane='→';else lane='↑';LANE.innerHTML=`${lane}<small>${type==='roundabout'||type==='rotary'?'EXIT GUIDANCE':'NEXT MANOEUVRE'}</small>`;LANE.style.display='block';
}
function startTracking(){if(!navigator.geolocation)return;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:1000,timeout:12000});toast('Live navigation started')}
function stopNavigation(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}driveMode=false;UI.style.display='none';ST.style.display='none';if('speechSynthesis'in window)speechSynthesis.cancel();toast('Navigation stopped')}
function recenter(){if(lastPos){map.setView([lastPos.lat,lastPos.lon],17,{animate:true});}}
function onPositionError(e){if(e.code===1)toast('Allow Location for MUK SATNAV 86');else toast('GPS signal unavailable')}
async function onPosition(pos){const p={lat:pos.coords.latitude,lon:pos.coords.longitude};p.accuracy=pos.coords.accuracy||999;p.speed=pos.coords.speed||0;if(lastPos)p.heading=Number.isFinite(pos.coords.heading)?pos.coords.heading:bearing(lastPos,p);else p.heading=Number.isFinite(pos.coords.heading)?pos.coords.heading:null;lastPos=p;if(!myMarker)myMarker=L.marker([p.lat,p.lon],{icon:carIcon()}).addTo(map);else myMarker.setLatLng([p.lat,p.lon]);if(driveMode){map.setView([p.lat,p.lon],Math.max(17,map.getZoom()),{animate:true});}else{map.setView([p.lat,p.lon],Math.max(16,map.getZoom()),{animate:true});}if(p.heading!=null)myMarker.setRotationAngle?.(p.heading);if(!routeSteps.length)return;await navigationEngine(p)}
async function navigationEngine(p){const near=nearestOnRoute(p);if(near.d>70){if(!offRouteSince)offRouteSince=Date.now();if(Date.now()-offRouteSince>2500 && Date.now()-lastReroute>12000){toast('Off route — recalculating');speak('You are off route. Recalculating.');lastReroute=Date.now();try{await buildRoute(p,current,true);offRouteSince=0;return}catch(e){toast('Unable to recalculate right now')}}}else offRouteSince=0;
 const rb=routeBearingAt(near.index);
 if(p.heading!=null&&near.d<55&&rb!=null&&angleDiff(p.heading,rb)>120&&((p.speed||0)>2||lastPos)){if(!wrongWaySince)wrongWaySince=Date.now();if(Date.now()-wrongWaySince>2200&&Date.now()-lastReroute>12000){toast('Wrong direction — recalculating');speak('You are travelling the wrong way. Recalculating.');lastReroute=Date.now();try{await buildRoute(p,current,true);wrongWaySince=0;return}catch(e){}}}else wrongWaySince=0;
 const st=routeSteps[stepIndex];if(!st)return;const loc=st.maneuver?.location;if(loc){const sd=hav(p,{lat:loc[1],lon:loc[0]});if(sd<35 && stepIndex<routeSteps.length-1){stepIndex++;const n=routeSteps[stepIndex];const key='step'+stepIndex;if(!announced[key]){announced[key]=1;speak(announcementForStep(n));}renderDrive(p);return}}
 const distTo=loc?hav(p,{lat:loc[1],lon:loc[0]}):99999;const type=st.maneuver?.type;const key='warn'+stepIndex;const thresholds=type==='roundabout'||type==='rotary'?[450,180,45]:[300,120,35];if(distTo<thresholds[0]&&!announced[key+'a']){announced[key+'a']=1;let text=type==='roundabout'||type==='rotary'?`Approaching roundabout in ${formatDistance(distTo)}. ${mannerRoundabout(st)}`:`Approaching junction in ${formatDistance(distTo)}. ${manner(st)}${roadName(st)?' onto '+roadName(st):''}.`;speak(text)}if(distTo<thresholds[1]&&!announced[key+'b']){announced[key+'b']=1;speak(type==='roundabout'||type==='rotary'?mannerRoundabout(st):`${manner(st)} in ${formatDistance(distTo)}.`)}if(distTo<thresholds[2]&&!announced[key+'c']){announced[key+'c']=1;speak(type==='roundabout'||type==='rotary'?mannerRoundabout(st):manner(st)+' now.')}
 await trafficLightAlert(p);renderDrive(p);if(type==='arrive'&&distTo<35){speak('You have arrived at your destination.');toast('You have arrived');stopNavigation()}}
function manner(st){return maneuverLabel(st).toLowerCase()}
function mannerRoundabout(st){const ex=st.maneuver?.exit;return ex?`take the ${ordinal(ex)} exit`:'take the correct exit'}
async function trafficLightAlert(p){if(Date.now()-trafficFetchedAt>30000){try{const q=`[out:json][timeout:8];node(around:180,${p.lat},${p.lon})[highway=traffic_signals];out;`;const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(r.ok){const j=await r.json();trafficCache=(j.elements||[]).map(e=>({lat:e.lat,lon:e.lon}));trafficFetchedAt=Date.now()}}catch(e){}}if(!trafficCache.length||p.heading==null)return;for(const l of trafficCache){const d=hav(p,l);if(d>25&&d<180){const b=bearing(p,l);if(angleDiff(p.heading,b)<35){const near=nearestOnRoute(l);const carNear=nearestOnRoute(p);if(near.d<45&&near.index>=carNear.index){const key='light'+Math.round(l.lat*1e5)+'_'+Math.round(l.lon*1e5);if(!announced[key]){announced[key]=1;speak(`Traffic lights ahead in ${formatDistance(d)}.`)}return}}}}}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
