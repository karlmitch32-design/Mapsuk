<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--green:#56683c;--green2:#3f4d2f;--pale:#edf1e8;--cream:#f7f8f3;--text:#26301f;--muted:#687064;--line:#d9ded2;--white:#fff;--warn:#9a671f;--red:#8e4338;--shadow:0 8px 28px rgba(0,0,0,.20)}
*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);overflow:hidden}button,input{font:inherit}button{border:0;cursor:pointer}
#map{position:absolute;inset:0;background:#dfe7d7}.maplibregl-ctrl-attrib{font-size:9px!important}.maplibregl-ctrl-group{border-radius:12px!important;overflow:hidden;box-shadow:var(--shadow)!important}.maplibregl-ctrl button{width:36px!important;height:36px!important}
.top{position:absolute;z-index:20;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#3f4d2fee,#3f4d2fd9 72%,transparent);pointer-events:none}.top>*{pointer-events:auto}.brandrow{display:flex;align-items:center;justify-content:space-between;color:#fff}.brand{font-size:23px;font-weight:900;letter-spacing:.5px}.mode{font-size:11px;font-weight:800;background:#ffffff22;border:1px solid #ffffff33;padding:6px 9px;border-radius:999px}.searchrow{display:flex;gap:7px;margin-top:8px}.searchrow input{flex:1;min-width:0;height:48px;border-radius:14px;border:0;padding:0 15px;background:#fff;box-shadow:var(--shadow);outline:none}.findbtn{height:48px;padding:0 17px;border-radius:14px;background:#70884e;color:#fff;font-weight:850;box-shadow:var(--shadow)}
#results{position:absolute;z-index:30;left:12px;right:12px;top:calc(115px + env(safe-area-inset-top));max-height:45vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow);display:none}.result{padding:13px 14px;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0}.result b{display:block}.result small{display:block;color:var(--muted);margin-top:3px;line-height:1.3}.result button{margin-top:8px;background:var(--pale);color:var(--green2);padding:7px 10px;border-radius:9px;font-weight:800}
.navcard{position:absolute;z-index:18;left:12px;right:12px;top:calc(122px + env(safe-area-inset-top));background:#fff;border-radius:18px;box-shadow:var(--shadow);display:none;overflow:hidden}.navcard.show{display:block}.turnrow{display:flex;gap:12px;align-items:center;padding:14px 15px}.turnicon{width:58px;height:58px;flex:0 0 58px;border-radius:15px;background:var(--green2);color:#fff;display:grid;place-items:center;font-size:29px;font-weight:900}.turnmain{min-width:0}.turnmain b{display:block;font-size:18px;line-height:1.15}.turnmain .dist{margin-top:5px;color:var(--muted);font-size:13px;font-weight:700}.routebar{display:flex;border-top:1px solid var(--line);background:var(--cream)}.routebar div{flex:1;padding:9px 7px;text-align:center;border-right:1px solid var(--line)}.routebar div:last-child{border-right:0}.routebar strong{display:block;font-size:14px}.routebar span{font-size:10px;color:var(--muted)}
.bottom{position:absolute;z-index:20;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.status{align-self:flex-start;background:#fff;border-radius:13px;padding:8px 11px;box-shadow:var(--shadow);font-size:12px;font-weight:800;display:none}.status.show{display:block}.status.ok{color:var(--green2)}.status.warn{color:var(--warn)}.status.error{color:var(--red)}.controls{background:#fff;border-radius:17px;box-shadow:var(--shadow);padding:6px;display:flex;gap:4px}.controls button{flex:1;min-width:0;background:#fff;color:var(--green2);padding:10px 5px;border-radius:12px;font-weight:800;font-size:11px}.controls button.active{background:var(--pale)}.controls .stop{color:var(--red)}
.side{position:absolute;z-index:17;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.round{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--green2);box-shadow:var(--shadow);font-weight:900;font-size:13px}.round.active{background:var(--green2);color:#fff}.round.speaker{font-size:21px}.round.gps{font-size:20px}
.speedbadge{position:absolute;z-index:19;left:14px;bottom:calc(103px + env(safe-area-inset-bottom));background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:8px 11px;display:none}.speedbadge.show{display:block}.speedbadge b{font-size:18px}.speedbadge span{display:block;font-size:9px;color:var(--muted);font-weight:800}.alertstack{position:absolute;z-index:19;right:14px;top:calc(115px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;max-width:48%}.alert{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:11px;font-weight:850;display:none}.alert.show{display:block}.alert.camera{border-left:4px solid #a56530}.alert.light{border-left:4px solid #687a48}.alert.offroute{border-left:4px solid #a63f35;color:#8e4338}
.panel{position:absolute;z-index:25;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-height:55vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:15px;display:none}.panel.show{display:block}.panel h3{margin:0 0 5px;font-size:18px}.panel .muted{font-size:12px;color:var(--muted);line-height:1.4}.panel .notice{background:var(--cream);border:1px solid var(--line);padding:10px;border-radius:12px;margin-top:10px;font-size:12px}.panel .actions{display:flex;gap:7px;margin-top:10px}.panel .actions button{flex:1;padding:10px;border-radius:10px;background:var(--green);color:#fff;font-weight:800}.panel .actions button.secondary{background:var(--pale);color:var(--green2)}.panel .actions button.danger{background:#f2e7e4;color:var(--red)}.saveditem{padding:11px 0;border-bottom:1px solid var(--line)}.saveditem:last-child{border-bottom:0}
#arrival{position:absolute;z-index:40;left:18px;right:18px;top:30%;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:24px;text-align:center;display:none}.check{width:62px;height:62px;border-radius:50%;background:var(--pale);display:grid;place-items:center;margin:0 auto 10px;font-size:32px}.arrivaltitle{font-size:24px;font-weight:900}.arrivaltext{color:var(--muted);margin-top:5px}
.hidden{display:none!important}@media(min-width:800px){.top{max-width:760px}.searchrow{max-width:700px}.navcard{left:18px;right:auto;width:520px}.panel{left:18px;right:auto;width:470px}.bottom{left:18px;right:18px}.controls{max-width:700px;margin:auto;width:100%}.side{right:18px}.speedbadge{left:22px}.alertstack{right:22px}}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div class="top">
 <div class="brandrow"><div class="brand">MAPSUK</div><div class="mode" id="modeLabel">PRO SATNAV</div></div>
 <div class="searchrow"><input id="search" placeholder="Search UK address, postcode, town or place" autocomplete="off"><button class="findbtn" id="findBtn">Find</button></div>
</div>
<div id="results"></div>
<div id="navcard" class="navcard">
 <div class="turnrow"><div class="turnicon" id="turnIcon">↑</div><div class="turnmain"><b id="instruction">Ready</b><div class="dist" id="turnDist">—</div></div></div>
 <div class="routebar"><div><strong id="eta">—</strong><span>ETA</span></div><div><strong id="remaining">—</strong><span>remaining</span></div><div><strong id="arrivalTime">—</strong><span>arrival</span></div></div>
</div>
<div class="speedbadge" id="speedBadge"><b id="speedValue">—</b><span id="roadName">SPEED LIMIT</span></div>
<div class="alertstack"><div class="alert camera" id="cameraAlert"></div><div class="alert light" id="lightAlert"></div><div class="alert offroute" id="offrouteAlert">⚠️ Off route — recalculating</div></div>
<div class="side"><button class="round" id="viewBtn">3D</button><button class="round gps" id="gpsBtn">◎</button><button class="round speaker" id="speakerBtn">🔊</button></div>
<div class="bottom"><div class="status" id="status"></div><div class="controls">
 <button id="findTab" class="active">📍 Find</button><button id="routeTab">🚗 Route</button><button id="savedTab">🏷️ Saved</button><button id="scanTab">📷 Scan</button><button id="stopBtn" class="stop hidden">■ Stop</button>
</div></div>
<div class="panel" id="panel"></div>
<div id="arrival"><div class="check">✓</div><div class="arrivaltitle">You have arrived</div><div class="arrivaltext" id="arrivalText"></div><div class="actions"><button id="closeArrival">Done</button></div></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={map:null,mapReady:false,dest:null,route:null,steps:[],stepIndex:0,watchId:null,position:null,lastPosition:null,heading:null,voice:true,threeD:true,follow:true,routeTotal:0,remaining:0,routeStarted:false,offRoute:false,lastReroute:0,featureTimer:0,features:[],speed:null,roadName:'',lastVoice:{},searchBusy:false,speechReady:false};
const OSM_STYLE={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]};
function setStatus(msg,type='ok',show=true){const e=$('status');e.textContent=msg;e.className='status '+type+(show?' show':'');if(show)clearTimeout(setStatus.t);setStatus.t=setTimeout(()=>e.classList.remove('show'),5000)}
function hidePanel(){ $('panel').classList.remove('show'); }
function showPanel(html){$('panel').innerHTML=html;$('panel').classList.add('show')}
function formatDistance(m){if(!Number.isFinite(m))return '—';if(m<1609)return Math.max(5,Math.round(m*1.09361/5)*5)+' yd';return (m/1609.344).toFixed(m<16093?1:0)+' mi'}
function formatDuration(sec){if(!Number.isFinite(sec))return '—';const m=Math.max(1,Math.round(sec/60));return m<60?m+' min':Math.floor(m/60)+' hr '+(m%60)+' min'}
function timeString(ts){return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}
function distance(a,b){const R=6371000,rad=Math.PI/180,dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);return (Math.atan2(y,x)*180/Math.PI+360)%360}
function angleDelta(a,b){return ((b-a+540)%360)-180}
function turnIcon(step){const t=step?.maneuver?.type||'';const m=step?.maneuver?.modifier||'';if(t==='arrive')return '✓';if(t==='roundabout'||t==='rotary')return '↻';if(m.includes('uturn'))return '↩';if(m.includes('left'))return '↰';if(m.includes('right'))return '↱';if(t==='merge')return '⇢';if(t==='fork')return m.includes('left')?'↖':'↗';return '↑'}
function speech(text){if(!state.voice||!('speechSynthesis'in window)||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.94;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
function speakOnce(key,text){if(state.lastVoice[key])return;state.lastVoice[key]=true;speech(text)}
function resetVoiceFlags(){state.lastVoice={}}
function saved(){try{return JSON.parse(localStorage.getItem('mapsuk.saved')||'[]')}catch{return[]}}
function saveSaved(a){localStorage.setItem('mapsuk.saved',JSON.stringify(a))}
function savePlace(p){const a=saved();if(!a.some(x=>Math.abs(x.lat-p.lat)<.00005&&Math.abs(x.lon-p.lon)<.00005))a.push({...p,id:Date.now()});saveSaved(a);setStatus('Place saved on this device');hidePanel()}
function deletePlace(id){saveSaved(saved().filter(x=>x.id!==id));renderSaved()}

function init(){
 state.map=new maplibregl.Map({container:'map',style:OSM_STYLE,center:[-3.4,54.5],zoom:5.6,attributionControl:true,dragRotate:false,touchPitchRotate:false,keyboard:false});
 state.map.addControl(new maplibregl.NavigationControl({showCompass:false,showZoom:true}), 'top-left');
 state.map.on('load',()=>{state.mapReady=true;setStatus('Ready');renderRouteLayer();});
 state.map.on('click',e=>{if(state.routeStarted)return;reverse(e.lngLat.lat,e.lngLat.lng).then(x=>selectPlace(x)).catch(()=>setStatus('Could not identify that point','error'))});
 $('findBtn').onclick=searchPlaces;$('search').onkeydown=e=>{if(e.key==='Enter')searchPlaces()};
 $('findTab').onclick=()=>{hidePanel();activateTab('findTab')};$('routeTab').onclick=routeTab;$('savedTab').onclick=renderSaved;$('scanTab').onclick=scanUI;$('stopBtn').onclick=stopNavigation;$('viewBtn').onclick=toggleView;$('gpsBtn').onclick=centreOnVehicle;$('speakerBtn').onclick=toggleVoice;$('closeArrival').onclick=()=>{$('arrival').style.display='none'};
}
function activateTab(id){document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));$(id).classList.add('active')}
async function nominatim(url){const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('Search service unavailable');return r.json()}
async function searchPlaces(){const q=$('search').value.trim();if(!q||state.searchBusy)return;state.searchBusy=true;showPanel('<h3>Searching…</h3><div class="muted">Looking for the UK location.</div>');try{const d=await nominatim('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!d.length){showPanel('<h3>No UK result</h3><div class="muted">Try a full address, postcode, town or place name.</div>');return}renderResults(d)}catch(e){showPanel('<h3>Search unavailable</h3><div class="muted">The map is still usable. Check your connection and try again.</div>')}finally{state.searchBusy=false}}
function renderResults(items){$('results').style.display='none';showPanel('<h3>Choose destination</h3>'+items.map((x,i)=>`<div class="result"><b>${esc(x.display_name.split(',')[0])}</b><small>${esc(x.display_name)}</small><button onclick="pickResult(${i})">Use this place</button></div>`).join(''));window.__searchResults=items}
window.pickResult=i=>selectPlace(window.__searchResults[i]);
async function reverse(lat,lon){const x=await nominatim(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);return x}
function selectPlace(x){if(!state.mapReady){setStatus('Map is still loading…','warn');return}const p={lat:+x.lat,lon:+x.lon,name:x.display_name||`${x.lat}, ${x.lon}`};state.dest=p;hidePanel();state.map.flyTo({center:[p.lon,p.lat],zoom:16,duration:700});if(state.map.getSource('dest'))state.map.getSource('dest').setData({type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]}});else{state.map.addSource('dest',{type:'geojson',data:{type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]}}});state.map.addLayer({id:'dest',type:'circle',source:'dest',paint:{'circle-radius':9,'circle-color':'#56683c','circle-stroke-width':4,'circle-stroke-color':'#fff'}})}showPanel(`<h3>${esc(p.name.split(',')[0])}</h3><div class="muted">${esc(p.name)}</div><div class="actions"><button onclick='planFromHere()'>🚗 Route from here</button><button class="secondary" onclick='savePlace(${JSON.stringify(p)})'>Save</button></div><div class="notice">Routing uses the free OSRM driving engine. MAPSUK does not sell or store your destination.</div>`)}
function routeTab(){activateTab('routeTab');if(state.dest)showPanel(`<h3>Route to destination</h3><div class="muted">${esc(state.dest.name)}</div><div class="actions"><button onclick="startRouteFromGPS()">Use my location</button><button class="secondary" onclick="manualStart()">Enter start</button></div>`);else showPanel('<h3>Route</h3><div class="muted">Search for a destination first.</div>')}
function planFromHere(){startRouteFromGPS()}
function manualStart(){showPanel('<h3>Starting point</h3><div class="muted">Enter a UK address or postcode.</div><div class="searchrow"><input id="startInput" placeholder="Start address or postcode"><button class="findbtn" onclick="manualRoute()">Go</button></div>')}
async function manualRoute(){const q=$('startInput')?.value.trim();if(!q)return;try{setStatus('Finding starting point…');const d=await nominatim('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=1&q='+encodeURIComponent(q));if(!d.length)throw Error('Start not found');await buildRoute({lat:+d[0].lat,lon:+d[0].lon},state.dest)}catch(e){setStatus(e.message,'error')}}
function startRouteFromGPS(){if(!navigator.geolocation){setStatus('GPS is not available in this browser','error');return}setStatus('Getting your location…');navigator.geolocation.getCurrentPosition(async p=>{try{await buildRoute({lat:p.coords.latitude,lon:p.coords.longitude},state.dest);startTracking()}catch(e){setStatus(e.message,'error')}},()=>setStatus('Location permission is required','error'),{enableHighAccuracy:true,timeout:15000,maximumAge:1000})}
async function buildRoute(start,dest){if(!state.mapReady)await new Promise(resolve=>state.map.once('load',resolve));if(!dest)throw Error('Choose a destination first');const u=`https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=true`;const r=await fetch(u);if(!r.ok)throw Error('Routing service unavailable');const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error('No driving route found');const rt=j.routes[0];state.route=rt;state.steps=(rt.legs||[]).flatMap(l=>l.steps||[]).filter(s=>s.geometry?.coordinates?.length);state.stepIndex=0;state.routeTotal=rt.distance;state.remaining=rt.distance;state.routeStarted=false;state.offRoute=false;resetVoiceFlags();drawRoute(rt.geometry);state.map.fitBounds([[start.lon,start.lat],[dest.lon,dest.lat]],{padding:{top:180,bottom:170,left:35,right:35},maxZoom:17,duration:700});updateNavCard();setStatus(`${formatDistance(rt.distance)} · ${formatDuration(rt.duration)} · route ready`);}
function renderRouteLayer(){if(!state.map.getSource('route')){state.map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});state.map.addLayer({id:'routeGlow',type:'line',source:'route',paint:{'line-color':'#fff','line-width':10,'line-opacity':.9}});state.map.addLayer({id:'routeLine',type:'line',source:'route',paint:{'line-color':'#2f78d0','line-width':6,'line-opacity':.95}})} }
function drawRoute(geom){renderRouteLayer();state.map.getSource('route').setData({type:'Feature',geometry:geom});}
function updateVehicleMarker(){if(!state.position)return;const c=[state.position.lon,state.position.lat];if(!state.map.getSource('vehicle')){state.map.addSource('vehicle',{type:'geojson',data:{type:'Feature',geometry:{type:'Point',coordinates:c}}});state.map.addLayer({id:'vehicleHalo',type:'circle',source:'vehicle',paint:{'circle-radius':14,'circle-color':'#fff','circle-opacity':.9}});state.map.addLayer({id:'vehicle',type:'circle',source:'vehicle',paint:{'circle-radius':9,'circle-color':'#d43c32','circle-stroke-width':3,'circle-stroke-color':'#fff'}})}else state.map.getSource('vehicle').setData({type:'Feature',geometry:{type:'Point',coordinates:c}});}
function nearestRouteDistance(pos){if(!state.route?.geometry?.coordinates?.length)return Infinity;let best=Infinity,bestIdx=0;const pts=state.route.geometry.coordinates;for(let i=0;i<pts.length;i++){const d=distance(pos,{lat:pts[i][1],lon:pts[i][0]});if(d<best){best=d;bestIdx=i}}return {distance:best,index:bestIdx}}
function stepDistanceAhead(pos,idx){if(!state.steps[idx])return Infinity;const m=state.steps[idx].maneuver?.location;if(!m)return Infinity;return distance(pos,{lat:m[1],lon:m[0]})}
function chooseCurrentStep(pos){if(!state.steps.length)return;let best=state.stepIndex;let bestD=Infinity;for(let i=Math.max(0,state.stepIndex-1);i<Math.min(state.steps.length,state.stepIndex+5);i++){const d=stepDistanceAhead(pos,i);if(d<bestD){bestD=d;best=i}}if(best>state.stepIndex && bestD<90)state.stepIndex=best}
function updateRemaining(pos){const n=nearestRouteDistance(pos);if(!state.route)return;const pts=state.route.geometry.coordinates;let rem=0;for(let i=n.index;i<pts.length-1;i++)rem+=distance({lat:pts[i][1],lon:pts[i][0]},{lat:pts[i+1][1],lon:pts[i+1][0]});state.remaining=Math.min(state.routeTotal,rem)}
function updateNavCard(){if(!state.route){$('navcard').classList.remove('show');return}const s=state.steps[state.stepIndex];$('navcard').classList.add('show');$('turnIcon').textContent=turnIcon(s);$('instruction').textContent=s?.maneuver?.instruction||'Continue on the planned route';const d=state.position?stepDistanceAhead(state.position,state.stepIndex):s?.distance||0;$('turnDist').textContent=d<Infinity?formatDistance(d):'Next manoeuvre';const speedSec=state.route.duration*(state.remaining/Math.max(1,state.route.distance));const eta=Date.now()+Math.max(0,speedSec*1000);$('eta').textContent=formatDuration(speedSec);$('remaining').textContent=formatDistance(state.remaining);$('arrivalTime').textContent=timeString(eta)}
function updateCamera(){if(!state.position||!state.follow)return;let pitch=state.threeD?55:0;let bearingVal=state.threeD&&state.heading!==null?state.heading:0;state.map.easeTo({center:[state.position.lon,state.position.lat],zoom:Math.max(state.map.getZoom(),17.2),pitch,bearing:bearingVal,duration:450,essential:true})}
function toggleView(){state.threeD=!state.threeD;$('viewBtn').textContent=state.threeD?'3D':'2D';if(state.position)updateCamera();else state.map.easeTo({pitch:state.threeD?55:0,bearing:0,duration:500})}
function centreOnVehicle(){state.follow=true;if(state.position){updateCamera();setStatus('Following your vehicle')}else setStatus('Waiting for GPS position','warn')}
function toggleVoice(){state.voice=!state.voice;$('speakerBtn').textContent=state.voice?'🔊':'🔇';if(!state.voice&&'speechSynthesis'in window)speechSynthesis.cancel();else speech('Voice guidance on')}
function startTracking(){if(state.watchId!==null)return;state.routeStarted=true;$('stopBtn').classList.remove('hidden');activateTab('routeTab');if(!navigator.geolocation){setStatus('GPS unavailable','error');return}state.watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
function stopNavigation(){if(state.watchId!==null){navigator.geolocation.clearWatch(state.watchId);state.watchId=null}state.routeStarted=false;state.follow=true;$('stopBtn').classList.add('hidden');$('navcard').classList.remove('show');$('speedBadge').classList.remove('show');$('cameraAlert').classList.remove('show');$('lightAlert').classList.remove('show');$('offrouteAlert').classList.remove('show');if('speechSynthesis'in window)speechSynthesis.cancel();setStatus('Navigation stopped');}
async function onPosition(p){const pos={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy||999,speed:p.coords.speed};if(state.lastPosition&&distance(state.lastPosition,pos)>3)state.heading=bearing(state.lastPosition,pos);else if(Number.isFinite(p.coords.heading)&&p.coords.heading>=0)state.heading=p.coords.heading;state.lastPosition=pos;state.position=pos;updateVehicleMarker();updateRemaining(pos);chooseCurrentStep(pos);checkOffRoute(pos);updateNavCard();updateRoadFeatures(pos);updateCamera();updateAlerts(pos);checkManeuverVoice(pos);checkArrival(pos);}
function onPositionError(e){if(e.code===1)setStatus('Location permission blocked — allow Location for MAPSUK','error');else if(e.code===2)setStatus('GPS signal unavailable — keep the phone in a clear position','warn');else setStatus('GPS update timed out — still trying','warn')}
function checkOffRoute(pos){const n=nearestRouteDistance(pos);if(n.distance>65&&!state.offRoute&&Date.now()-state.lastReroute>15000){state.offRoute=true;$('offrouteAlert').classList.add('show');setStatus('Off route — recalculating…','warn');rerouteFromPosition(pos)}}
async function rerouteFromPosition(pos){state.lastReroute=Date.now();try{const oldDest=state.dest;await buildRoute(pos,oldDest);state.offRoute=false;$('offrouteAlert').classList.remove('show');speech('Route updated. '+(state.steps[0]?.maneuver?.instruction||'Continue'));startTracking()}catch(e){setStatus('Could not recalculate. Stay on the planned route.','error')}}
function checkManeuverVoice(pos){const d=stepDistanceAhead(pos,state.stepIndex);const s=state.steps[state.stepIndex];if(!s)return;const text=s.maneuver?.instruction||'Continue on the planned route';if(d<650)speakOnce('far'+state.stepIndex,`${text}. In ${formatDistance(d)}.`);if(d<250)speakOnce('mid'+state.stepIndex,`${text}. In ${formatDistance(d)}.`);if(d<85){speakOnce('near'+state.stepIndex,text);if(state.stepIndex<state.steps.length-1)state.stepIndex++;updateNavCard()}}
function checkArrival(pos){if(!state.dest||!state.routeStarted)return;if(distance(pos,state.dest)<35){state.routeStarted=false;if(state.watchId!==null){navigator.geolocation.clearWatch(state.watchId);state.watchId=null}$('stopBtn').classList.add('hidden');$('arrivalText').textContent=state.dest.name;$('arrival').style.display='block';speech('You have arrived at your destination.');}}

async function updateRoadFeatures(pos){if(Date.now()-state.featureTimer<10000)return;state.featureTimer=Date.now();const b=0.008;const bbox=`${pos.lat-b},${pos.lon-b},${pos.lat+b},${pos.lon+b}`;const q=`[out:json][timeout:12];(way[highway](${bbox});node[highway=traffic_signals](${bbox});node[highway=speed_camera](${bbox});way[highway=speed_camera](${bbox}););out body geom;`;try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});if(!r.ok)throw Error();const j=await r.json();const feats=[];let best=null;for(const e of j.elements||[]){if(e.type==='node'&&e.lat!==undefined){const f={type:e.tags?.highway==='speed_camera'?'camera':'light',lat:e.lat,lon:e.lon};f.distance=distance(pos,f);if(f.distance<800)feats.push(f)}else if(e.type==='way'&&e.geometry){const sp=ukSpeed(e.tags||{});if(sp!==null){const d=Math.min(...e.geometry.map(x=>distance(pos,{lat:x.lat,lon:x.lon})));if(d<220&&(!best||d<best.distance))best={speed:sp,name:e.tags?.name||'',distance:d}}}}state.features=feats;state.speed=best?.speed??null;state.roadName=best?.name||'';updateSpeedBadge()}catch(e){/* mapped feature data is optional; navigation continues */}}
function ukSpeed(tags){let v=String(tags.maxspeed||tags['maxspeed:type']||'').toLowerCase().trim();if(v==='gb:nsl_dual'||v==='national_speed_limit_dual'||v==='national speed limit dual')return 70;if(v==='gb:nsl_single'||v==='national_speed_limit_single'||v==='national speed limit single')return 60;if(!v)return null;const n=parseFloat(v);if(!Number.isFinite(n))return null;if(v.includes('mph'))return Math.round(n);return Math.round(n/1.609344)}
function updateSpeedBadge(){if(state.routeStarted||state.route){$('speedBadge').classList.add('show');$('speedValue').textContent=state.speed??'—';$('roadName').textContent=(state.roadName||'SPEED LIMIT NOT MAPPED').toUpperCase()}else $('speedBadge').classList.remove('show')}
function updateAlerts(pos){const cam=state.features.filter(f=>f.type==='camera').sort((a,b)=>a.distance-b.distance)[0];const light=state.features.filter(f=>f.type==='light').sort((a,b)=>a.distance-b.distance)[0];if(cam&&cam.distance<500){$('cameraAlert').textContent='📷 Speed camera · '+formatDistance(cam.distance);$('cameraAlert').classList.add('show');if(cam.distance<350)speakOnce('cam'+cam.lat.toFixed(4)+cam.lon.toFixed(4),'Speed camera ahead in '+formatDistance(cam.distance)+'.')}else $('cameraAlert').classList.remove('show');if(light&&light.distance<350){$('lightAlert').textContent='🚦 Traffic lights · '+formatDistance(light.distance);$('lightAlert').classList.add('show');if(light.distance<250)speakOnce('light'+light.lat.toFixed(4)+light.lon.toFixed(4),'Traffic lights ahead in '+formatDistance(light.distance)+'.')}else $('lightAlert').classList.remove('show')}

function renderSaved(){activateTab('savedTab');const a=saved();showPanel('<h3>Saved places</h3>'+(a.length?a.map(x=>`<div class="saveditem"><b>${esc(x.name.split(',')[0])}</b><div class="muted">${esc(x.name)}</div><div class="actions"><button onclick='state.dest=${JSON.stringify(x)};planFromHere()'>Route</button><button class="secondary" onclick='selectPlace(${JSON.stringify(x)})'>Show</button><button class="danger" onclick='deletePlace(${x.id})'>Delete</button></div></div>`).join(''):'<div class="muted">Nothing saved yet. Places are stored only on this device.</div>')+'<div class="notice">Saved places stay in this browser using local storage. They are not uploaded by MAPSUK.</div>')}
function scanUI(){activateTab('scanTab');showPanel('<h3>📷 Scan an address</h3><div class="muted">Use the phone camera to read an address, sign or label. Review the text before searching.</div><input id="photo" type="file" accept="image/*" capture="environment" style="margin-top:10px;width:100%"><div id="scanOut"></div><div class="notice">OCR runs in your browser. The photo is not saved as a MAPSUK place.</div>');$('photo').onchange=scanPhoto}
async function scanPhoto(e){const file=e.target.files?.[0];if(!file)return;$('scanOut').innerHTML='<div class="notice">Reading address…</div>';try{const r=await Tesseract.recognize(file,'eng');const text=r.data.text.trim();if(!text){$('scanOut').innerHTML='<div class="notice">No readable text found. Try a clearer photo.</div>';return}$('scanOut').innerHTML='<div class="notice"><b>Text found</b><br>'+esc(text).replace(/\n/g,'<br>')+'</div><div class="actions"><button id="ocrSearch">Search this text</button></div>';$('ocrSearch').onclick=()=>{$('search').value=text.replace(/\s+/g,' ').trim();hidePanel();searchPlaces()}}catch(e){$('scanOut').innerHTML='<div class="notice">OCR could not read that image. Try again with better light.</div>'}}

init();
</script>
</body>
</html>
