<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>

#mapViewport{position:absolute;left:-60%;top:-60%;width:220%;height:220%;z-index:1;overflow:hidden;transform-origin:50% 50%;will-change:transform;transition:transform .12s linear;background:#dfe7dc}#map{position:absolute;inset:0;z-index:1;overflow:hidden;background:#dfe7dc}.leaflet-container{background:#dfe7dc}.leaflet-control-attribution{font-size:8px;background:rgba(255,255,255,.8)!important}

.topbar{position:absolute;z-index:1200;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}.topbar>*{pointer-events:auto}.brand{background:rgba(255,255,255,.96);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);font-weight:950;letter-spacing:.6px;color:var(--nav)}.searchbox{flex:1;display:flex;gap:6px;background:rgba(255,255,255,.96);padding:5px;border-radius:10px;box-shadow:var(--shadow)}.searchbox input{flex:1;border:0;outline:0;padding:7px 9px;min-width:0}.searchbox button{padding:8px 12px}
.drive-ui{position:absolute;z-index:1300;left:0;right:0;top:0;bottom:0;pointer-events:none;display:none}.drive-ui .instruction,.drive-ui .routebar,.drive-ui .lane-cue{display:none}.drive-ui .instruction.show,.drive-ui .routebar.show,.drive-ui .lane-cue.show{display:flex}.drive-ui>*{pointer-events:auto}
/* Large next manoeuvre panel, like a dedicated navigation unit */
.instruction{position:absolute;top:10px;left:10px;right:10px;margin:0;background:rgba(255,255,255,.98);border-radius:12px;box-shadow:var(--shadow);min-height:86px;padding:10px 14px;display:flex;align-items:center;gap:14px;border-left:8px solid var(--nav)}.arrow{font-size:52px;line-height:1;color:var(--nav);width:78px;min-width:78px;text-align:center;font-weight:900}.roundabout-svg{width:74px;height:74px;overflow:visible}.roundabout-svg .ring{fill:none;stroke:#27311e;stroke-width:10}.roundabout-svg .road{fill:none;stroke:#9aa493;stroke-width:6;stroke-linecap:round}.roundabout-svg .active{stroke:#00c8ff;stroke-width:8;filter:drop-shadow(0 0 4px #00c8ff)}.roundabout-svg text{font-size:9px;font-weight:900;fill:#27311e}.ins-main{flex:1;min-width:0}.ins-main .big{font-size:24px;font-weight:950;line-height:1.05;text-transform:uppercase}.ins-main .sub{font-size:13px;color:var(--muted);margin-top:5px;font-weight:750}.distance{font-size:28px;font-weight:950;white-space:nowrap;color:var(--nav)}
.routebar{position:absolute;top:104px;left:10px;right:10px;margin:0;background:rgba(39,49,30,.96);color:#fff;border-radius:9px;box-shadow:var(--shadow);padding:8px 12px;display:flex;gap:16px;align-items:center;overflow:hidden}.routebar span{font-size:11px;white-space:nowrap}.routebar b{font-size:13px}.routebar .nextroad{font-weight:850;flex:1;overflow:hidden;text-overflow:ellipsis}
/* Bottom dedicated-navigation information strip */
.bottom{position:absolute;z-index:1300;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.bottom>*{pointer-events:auto}.stats{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.97);padding:6px;border-radius:11px;box-shadow:var(--shadow)}.stat{min-width:82px;padding:4px 8px;border-right:1px solid #ddd}.stat:last-child{border-right:0}.stat b{display:block;font-size:17px}.stat.limit b{font-size:18px}.stat.limit.over b{color:#c22b1d}.speed-warning{display:none;position:absolute;z-index:1450;top:86px;left:50%;transform:translateX(-50%);background:#c22b1d;color:#fff;border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);font-weight:950}.speed-warning.show{display:block}.junction-state{display:none;position:absolute;z-index:1450;top:86px;left:50%;transform:translateX(-50%);background:rgba(9,12,16,.94);color:#fff;border:1px solid rgba(0,240,255,.7);border-radius:12px;padding:8px 13px;box-shadow:0 0 18px rgba(0,240,255,.2);font-weight:900;text-align:center;min-width:190px}.junction-state.show{display:block}.stat small{color:var(--muted);font-size:10px;font-weight:700}.controls{display:flex;gap:7px}.round{width:46px;height:46px;padding:0;border-radius:50%;box-shadow:var(--shadow);background:rgba(255,255,255,.97);color:var(--nav);font-size:20px}
.panel{position:absolute;z-index:1400;left:10px;right:10px;bottom:70px;background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:62%;overflow:auto;display:none}.panel.show{display:block}.small{font-size:12px;color:var(--muted);line-height:1.45}.notice{background:#f3f5ed;border:1px solid #dce2d3;padding:10px;border-radius:10px;margin-top:9px}.item{padding:11px 0;border-bottom:1px solid #e4e7df}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1}.row{display:flex;gap:7px}.row>*{flex:1}.toast{position:absolute;z-index:1500;left:50%;transform:translateX(-50%);bottom:82px;background:#242a20;color:#fff;padding:10px 15px;border-radius:12px;box-shadow:var(--shadow);display:none;font-weight:800}.toast.show{display:block}.menu{position:absolute;z-index:1401;right:10px;bottom:70px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:7px;display:none;width:210px}.menu.show{display:block}.menu button{width:100%;margin:2px 0;text-align:left;background:#fff;color:var(--ink)}.menu button:hover{background:#edf0e7}

.lane-cue .lane-cue-icon{font-size:34px;line-height:1.05}.lane-cue{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;background:rgba(255,255,255,.96);border-radius:12px;box-shadow:var(--shadow);padding:7px 12px;font-size:34px;font-weight:950;color:var(--nav);display:none;min-width:150px;text-align:center}.lane-cue small{display:block;font-size:9px;letter-spacing:.7px;color:var(--muted);font-weight:900;margin-top:-5px}
@media(min-width:800px){.panel{width:440px;right:auto}.topbar{left:18px;right:18px}.instruction{left:18px;right:18px}.routebar{left:18px;right:18px}.bottom{left:18px;right:18px}.lane-cue{bottom:82px}}
.drive-active .topbar{display:none}.start-pulse{width:28px;height:28px;border-radius:50%;background:rgba(255,20,120,.18);border:3px solid #ff1493;box-shadow:0 0 6px #ff1493,0 0 14px #ff1493,0 0 26px rgba(255,20,147,.8);animation:mukPulse 1.15s ease-in-out infinite}@keyframes mukPulse{0%,100%{transform:scale(.72);opacity:.55}50%{transform:scale(1.15);opacity:1}}.neon-route{filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 9px currentColor)}.drive-active .leaflet-control-attribution{opacity:.75}.road-alert{display:none;position:absolute;z-index:1450;left:50%;transform:translateX(-50%);top:132px;background:#fff5d9;color:#6b4b00;border:2px solid #e3bd52;border-radius:12px;padding:9px 13px;box-shadow:var(--shadow);font-weight:900}.road-alert.show{display:block}</style>
</head>
<body>
<div id="app">
<div id="mapViewport"><div id="map"></div></div>
<div class="topbar"><div class="brand">MUK SATNAV 86</div><div class="searchbox"><input id="q" placeholder="Search UK address or postcode"><button onclick="find()">Find</button></div></div>
<div id="driveUI" class="drive-ui" style="display:none"><div id="instruction" class="instruction"></div><div id="routebar" class="routebar"></div><div id="laneCue" class="lane-cue"></div><div id="junctionState" class="junction-state"></div></div>
<div id="panel" class="panel"></div>

<div class="bottom"><div id="stats" class="stats" style="display:none"></div><div class="controls"><button id="recenter" class="round" onclick="recenter()" title="Recenter">⌖</button><button class="round" onclick="toggleMenu()" title="Menu">☰</button></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true,zoomControlPosition:'bottomright',touchZoom:true,scrollWheelZoom:true,doubleClickZoom:true,boxZoom:true,keyboard:true}).setView([54.5,-3.4],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routeLayer=null,myMarker=null,destMarker=null,startPulse=null,current=null,watchId=null,routeSteps=[],stepIndex=0,routeGeo=null,routeMeta=null,routeCum=[],voiceOn=true,driveMode=false,lastPos=null,lastReroute=0,offRouteSince=0,wrongWaySince=0,announced={},heading=null,speedLimit=null,speedLimitLabel=null,speedLimitFetchedAt=0,roadRuleFetchedAt=0,roadRuleState=null,lastCameraMove=0,mapHeading=0,wakeLock=null,arrivedAnnounced=false,speedChangeState=null,speedChangeFetchedAt=0,speedOverSince=0,speedRingAt=0;
const P=document.getElementById('panel'),UI=document.getElementById('driveUI'),INS=document.getElementById('instruction'),RB=document.getElementById('routebar'),ST=document.getElementById('stats'),TOAST=document.getElementById('toast'),MENU=document.getElementById('menu'),LANE=document.getElementById('laneCue'),JUNC=document.getElementById('junctionState');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>JSON.parse(localStorage.getItem('muk86.saved')||'[]'); const save=a=>localStorage.setItem('muk86.saved',JSON.stringify(a));
function show(x){P.innerHTML=x;P.classList.add('show')} function hide(){P.classList.remove('show')}
function toast(x){TOAST.textContent=x;TOAST.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>TOAST.classList.remove('show'),3000)}
function toggleMenu(){MENU.classList.toggle('show');MENU.innerHTML=`<button onclick="newRoute();toggleMenu()">🚗 New route</button><button onclick="showSaved();toggleMenu()">🏷️ Saved places</button><button onclick="toggleVoice();toggleMenu()">${voiceOn?'🔊 Voice on':'🔇 Voice off'}</button><button onclick="stopNavigation();toggleMenu()">⏹ Stop navigation</button>`}
function formatDistance(m){if(m<1000)return Math.max(5,Math.round(m/5)*5)+' yd';return (m/1609.344).toFixed(m<16093?1:0)+' mi'}
let lastSpokenText='',lastSpokenAt=0;
function speak(t,priority=false){if(!voiceOn||!('speechSynthesis'in window)||!t)return;const now=Date.now();if(!priority&&t===lastSpokenText&&now-lastSpokenAt<7000)return;if(!priority&&now-lastSpokenAt<900)return;lastSpokenText=t;lastSpokenAt=now;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.96;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
function bearing(a,b){const r=Math.PI/180,la=a.lat*r,lb=b.lat*r,dl=(b.lon-a.lon)*r;return (Math.atan2(Math.sin(dl)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dl))*180/Math.PI+360)%360}
function setMapRotation(h){if(!driveMode||!Number.isFinite(h))return;const d=((h%360)+360)%360;mapHeading=d;const vp=document.getElementById('mapViewport');if(vp)vp.style.transform=`scale(1) rotate(${-d}deg)`;const el=myMarker?.getElement?.();const car=el?.querySelector('.car-arrow');if(car)car.style.transform=`rotate(${d}deg)`;}
window.setMapRotation=setMapRotation;
window.lookAheadCenter=lookAheadCenter;
function lookAheadCenter(p,heading,meters=140){if(!p||!Number.isFinite(p.lat)||!Number.isFinite(p.lon))return p;const h=(Number.isFinite(heading)?heading:0)*Math.PI/180;const d=Number.isFinite(meters)?meters:140;const lat=p.lat+(Math.cos(h)*d/111320);const cosLat=Math.max(0.2,Math.cos(p.lat*Math.PI/180));const lon=p.lon+(Math.sin(h)*d/(111320*cosLat));return {lat,lon}}
function angleDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d}
function hav(a,b){const R=6371000,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lon-a.lon)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function nearestOnRoute(p){if(!routeGeo?.coordinates?.length)return {d:Infinity,index:0,point:null};const cs=routeGeo.coordinates;let best={d:Infinity,index:0,point:null};const lat0=p.lat*Math.PI/180,cl=Math.cos(lat0);for(let i=0;i<cs.length-1;i++){const a={lat:cs[i][1],lon:cs[i][0]},b={lat:cs[i+1][1],lon:cs[i+1][0]};const ax=(a.lon-p.lon)*cl,ay=a.lat-p.lat,bx=(b.lon-p.lon)*cl,by=b.lat-p.lat,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,(-ax*dx- ay*dy)/(dx*dx+dy*dy||1)));const q={lat:p.lat+(ay+t*dy),lon:p.lon+(ax+t*dx)/cl};const d=hav(p,q);if(d<best.d)best={d,index:i,point:q}}return best}
function routeBearingAt(index){if(!routeGeo?.coordinates?.length)return null;const cs=routeGeo.coordinates;const i=Math.min(Math.max(index,0),cs.length-2);return bearing({lat:cs[i][1],lon:cs[i][0]},{lat:cs[i+1][1],lon:cs[i+1][0]})}
function maneuverLabel(st){
 const m=st?.maneuver||{},t=m.type||'',mod=m.modifier||'';
 if(t==='arrive')return 'You have arrived';
 const idx=routeSteps.indexOf(st),commercial=commercialInstruction(st,idx);
 if(commercial)return commercial;
 if(t==='depart')return 'Continue ahead';
 if(t==='roundabout'||t==='rotary'){const ex=m.exit||st?.exit;if(ex)return `Take the ${ordinal(ex)} exit`;return 'Take the roundabout';}
 if(t==='fork')return mod==='left'?'Keep left':'Keep right';
 if(t==='merge')return mod==='left'?'Merge left':'Merge right';
 if(t==='on ramp')return mod==='left'?'Keep left and take the slip road':mod==='right'?'Keep right and take the slip road':'Take the slip road';
 if(t==='off ramp')return mod==='left'?'Keep left and leave the motorway':mod==='right'?'Keep right and leave the motorway':'Take the motorway exit';
 if(t==='new name')return 'Continue';
 if(mod==='left')return 'Turn left';if(mod==='right')return 'Turn right';if(mod==='slight left')return 'Keep left';if(mod==='slight right')return 'Keep right';if(mod==='sharp left')return 'Turn sharp left';if(mod==='sharp right')return 'Turn sharp right';return 'Continue ahead';
}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function stepDistance(st){return Math.max(0,st?st._distance||st.distance||0:0)}
function roadName(st){return st?.name||st?.ref||''}
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search service unavailable');return r.json()}
async function find(){const q=document.getElementById('q').value.trim();if(!q)return;show('<b>Searching…</b>');try{const d=await geo(q);if(!d.length){show('<b>No UK result found</b><div class="small">Try a full address or postcode.</div>');return}show(d.map(x=>`<div class="item"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='selectPlace(${JSON.stringify(x)})'>Select</button><button class="secondary" onclick='routeTo(${JSON.stringify(x)})'>Route</button></div></div>`).join(''))}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function selectPlace(x){current={lat:+x.lat,lon:+x.lon,name:x.display_name};map.setView([current.lat,current.lon],17);if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([current.lat,current.lon]).addTo(map);show(`<b>${esc(current.name.split(',')[0])}</b><div class="small">${esc(current.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(current)})'>🚗 Route here</button><button class="secondary" onclick='savePlace(${JSON.stringify(current)})'>Save</button></div>`)}
function savePlace(p){let a=saved();if(!a.some(x=>hav(x,p)<15))a.push({...p,id:Date.now()});save(a);toast('Place saved');}
function showSaved(){const a=saved();show('<b>Saved places</b>'+ (a.length?a.map(x=>`<div class="item"><b>${esc(x.name.split(',')[0])}</b><div class="small">${esc(x.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(x)})'>Route</button><button class="danger" onclick='deleteSaved(${x.id})'>Delete</button></div></div>`).join(''):'<div class="small">Nothing saved yet.</div>'))}
function deleteSaved(id){save(saved().filter(x=>x.id!==id));showSaved()}
function newRoute(){current=null;hide();document.getElementById('q').focus()}
function routeTo(p){current={lat:+p.lat,lon:+p.lon,name:p.name||p.display_name};useLocationForRoute()}
function useLocationForRoute(){if(!navigator.geolocation){manualStart();return}show('<b>Getting your location…</b><div class="small">High-accuracy GPS is required for live navigation.</div>');navigator.geolocation.getCurrentPosition(async pos=>{try{await buildRoute({lat:pos.coords.latitude,lon:pos.coords.longitude},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}},()=>manualStart(),{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function manualStart(){show(`<b>Starting point</b><div class="searchbox" style="box-shadow:none;border:1px solid #ddd;margin-top:8px"><input id="start" placeholder="Start postcode or address"><button onclick="manualRoute()">Go</button></div>`)}
async function manualRoute(){const q=document.getElementById('start').value.trim();if(!q)return;try{const d=await geo(q);if(!d.length)throw Error('Starting point not found');await buildRoute({lat:+d[0].lat,lon:+d[0].lon},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
function routeRemainingFromIndex(i){if(!routeCum.length)return routeMeta?.distance||0;return Math.max(0,(routeCum[routeCum.length-1]||0)-(routeCum[Math.max(0,Math.min(i,routeCum.length-1))]||0))}
function routeRemaining(p){if(!routeGeo)return routeMeta?.distance||0;const n=nearestOnRoute(p);return routeRemainingFromIndex(n.index)}
function updateRouteColour(p){if(!routeLayer||!routeMeta)return;const rem=routeRemaining(p),total=Math.max(1,routeMeta.distance),ratio=Math.max(0,Math.min(1,rem/total));let c=ratio>.70?'#ff1744':ratio>.40?'#ff5a00':ratio>.18?'#ffe600':'#39ff14';routeLayer.setStyle({color:c,weight:8,opacity:.98,className:'neon-route'});routeLayer._mukColour=c;if(startPulse){startPulse.setIcon(L.divIcon({className:'',html:`<div class="start-pulse" style="border-color:${c};box-shadow:0 0 6px ${c},0 0 14px ${c},0 0 26px ${c}"></div>`,iconSize:[28,28],iconAnchor:[14,14]}))}}
function updateStartPulse(p){if(!routeGeo)return;const n=nearestOnRoute(p);if(!n.point)return;if(!startPulse){startPulse=L.marker([n.point.lat,n.point.lon],{icon:L.divIcon({className:'',html:'<div class="start-pulse"></div>',iconSize:[28,28],iconAnchor:[14,14]}),interactive:false,zIndexOffset:900}).addTo(map)}else startPulse.setLatLng([n.point.lat,n.point.lon]);}
async function requestWakeLock(){if(!('wakeLock' in navigator)||!driveMode)return;try{if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null});}catch(e){wakeLock=null}}
async function buildRoute(a,dest,startLive=false){
 const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=true`;
 const r=await fetch(u);if(!r.ok)throw Error('Routing service unavailable');
 const j=await r.json();if(j.code!=='Ok')throw Error('No driving route found');
 const rt=j.routes[0];routeMeta={distance:rt.distance,duration:rt.duration};routeGeo=rt.geometry;
 routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]);routeSteps.forEach((st,i)=>enrichStep(st,i));stepIndex=0;let cum=0;routeCum=[0];
 routeSteps.forEach(s=>{s._startDist=cum;s._distance=s.distance||0;cum+=s.distance||0});for(let i=1;i<routeGeo.coordinates.length;i++){const a=routeGeo.coordinates[i-1],b=routeGeo.coordinates[i];cum=routeCum[i-1]+hav({lat:a[1],lon:a[0]},{lat:b[1],lon:b[0]});routeCum[i]=cum;}
 if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(rt.geometry,{style:{color:'#ff1744',weight:8,opacity:.98,className:'neon-route'}}).addTo(map);if(startPulse){map.removeLayer(startPulse);startPulse=null}
 if(destMarker)destMarker.setLatLng([dest.lat,dest.lon]);else destMarker=L.marker([dest.lat,dest.lon]).addTo(map);
 if(!myMarker)myMarker=L.marker([a.lat,a.lon],{icon:carIcon(),zIndexOffset:1000}).addTo(map);else myMarker.setLatLng([a.lat,a.lon]);
 driveMode=true;map.fitBounds(routeLayer.getBounds(),{padding:[110,110],maxZoom:17});document.body.classList.add('drive-active');UI.style.display='block';
 resetNavigationState();
 hide();
 const initialNear=nearestOnRoute(a); const initialHeading=routeBearingAt(initialNear.index)??0; map.setView(lookAheadCenter(a,initialHeading),17,{animate:false}); setMapRotation(initialHeading); updateStartPulse(a); updateRouteColour(a); requestWakeLock();
 initialiseActiveStep(a);
 renderDrive(a);
 if(startLive)startTracking();
 speak('Route planned. '+formatDistance(rt.distance)+' to go.');
}
function resetNavigationState(){announced={};lastSpokenText='';lastSpokenAt=0;offRouteSince=0;wrongWaySince=0;speedLimit=null;speedLimitLabel=null;speedLimitFetchedAt=0;roadRuleFetchedAt=0;roadRuleState=null;mapHeading=0;arrivedAnnounced=false;speedChangeState=null;speedChangeFetchedAt=0;speedOverSince=0;speedRingAt=0;}
function distanceToStep(p,st){const loc=st?.maneuver?.location;if(loc)return hav(p,{lat:loc[1],lon:loc[0]});return stepDistance(st);}
function mph(v){return Math.max(0,Math.round(v*2.236936));}
function parseSpeedLimit(v){
 if(v==null)return null;
