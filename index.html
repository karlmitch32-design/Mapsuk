<!doctype html>
<html lang="en">
<head>

<title>MUK SATNAV 86 — Commercial Forward Neon V23</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--nav:#27311e;--nav2:#39452b;--cream:#f7f6ef;--ink:#1a1f17;--muted:#68705f;--route:#2d6cdf;--white:#fff;--shadow:0 6px 24px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:var(--ink);overflow:hidden}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--nav);color:#fff}button.secondary{background:#e9ece3;color:var(--nav)}button.danger{background:#f1dfdb;color:#8d352b}
#mapViewport{position:absolute;left:-60%;top:-60%;width:220%;height:220%;z-index:1;overflow:hidden;transform-origin:50% 50%;will-change:transform;transition:transform .12s linear;background:#dfe7dc}#map{position:absolute;inset:0;z-index:1;overflow:hidden;background:#dfe7dc}.leaflet-container{background:#dfe7dc}.leaflet-control-attribution{font-size:8px;background:rgba(255,255,255,.8)!important}
/* Dedicated-satnav driving UI */
.topbar{position:absolute;z-index:1200;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}.topbar>*{pointer-events:auto}.brand{background:rgba(255,255,255,.96);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);font-weight:950;letter-spacing:.6px;color:var(--nav)}.searchbox{flex:1;display:flex;gap:6px;background:rgba(255,255,255,.96);padding:5px;border-radius:10px;box-shadow:var(--shadow)}.searchbox input{flex:1;border:0;outline:0;padding:7px 9px;min-width:0}.searchbox button{padding:8px 12px}
.drive-ui{position:absolute;z-index:1300;left:0;right:0;top:0;bottom:0;pointer-events:none;display:none}.drive-ui .instruction,.drive-ui .routebar,.drive-ui .lane-cue{display:none}.drive-ui .instruction.show,.drive-ui .routebar.show,.drive-ui .lane-cue.show{display:flex}.drive-ui>*{pointer-events:auto}
/* Large next manoeuvre panel, like a dedicated navigation unit */
.instruction{position:absolute;top:10px;left:10px;right:10px;margin:0;background:rgba(255,255,255,.98);border-radius:12px;box-shadow:var(--shadow);min-height:86px;padding:10px 14px;display:flex;align-items:center;gap:14px;border-left:8px solid var(--nav)}.arrow{font-size:52px;line-height:1;color:var(--nav);width:64px;text-align:center;font-weight:900}.ins-main{flex:1;min-width:0}.ins-main .big{font-size:24px;font-weight:950;line-height:1.05;text-transform:uppercase}.ins-main .sub{font-size:13px;color:var(--muted);margin-top:5px;font-weight:750}.distance{font-size:28px;font-weight:950;white-space:nowrap;color:var(--nav)}
.routebar{position:absolute;top:104px;left:10px;right:10px;margin:0;background:rgba(39,49,30,.96);color:#fff;border-radius:9px;box-shadow:var(--shadow);padding:8px 12px;display:flex;gap:16px;align-items:center;overflow:hidden}.routebar span{font-size:11px;white-space:nowrap}.routebar b{font-size:13px}.routebar .nextroad{font-weight:850;flex:1;overflow:hidden;text-overflow:ellipsis}
/* Bottom dedicated-navigation information strip */
.bottom{position:absolute;z-index:1300;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.bottom>*{pointer-events:auto}.stats{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.97);padding:6px;border-radius:11px;box-shadow:var(--shadow)}.stat{min-width:82px;padding:4px 8px;border-right:1px solid #ddd}.stat:last-child{border-right:0}.stat b{display:block;font-size:17px}.stat.limit b{font-size:18px}.stat.limit.over b{color:#c22b1d}.speed-warning{display:none;position:absolute;z-index:1450;top:86px;left:50%;transform:translateX(-50%);background:#c22b1d;color:#fff;border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);font-weight:950}.speed-warning.show{display:block}.stat small{color:var(--muted);font-size:10px;font-weight:700}.controls{display:flex;gap:7px}.round{width:46px;height:46px;padding:0;border-radius:50%;box-shadow:var(--shadow);background:rgba(255,255,255,.97);color:var(--nav);font-size:20px}
.panel{position:absolute;z-index:1400;left:10px;right:10px;bottom:70px;background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);max-height:62%;overflow:auto;display:none}.panel.show{display:block}.small{font-size:12px;color:var(--muted);line-height:1.45}.notice{background:#f3f5ed;border:1px solid #dce2d3;padding:10px;border-radius:10px;margin-top:9px}.item{padding:11px 0;border-bottom:1px solid #e4e7df}.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1}.row{display:flex;gap:7px}.row>*{flex:1}.toast{position:absolute;z-index:1500;left:50%;transform:translateX(-50%);bottom:82px;background:#242a20;color:#fff;padding:10px 15px;border-radius:12px;box-shadow:var(--shadow);display:none;font-weight:800}.toast.show{display:block}.menu{position:absolute;z-index:1401;right:10px;bottom:70px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:7px;display:none;width:210px}.menu.show{display:block}.menu button{width:100%;margin:2px 0;text-align:left;background:#fff;color:var(--ink)}.menu button:hover{background:#edf0e7}
/* Dedicated road-arrow / lane-style cue */
.lane-cue .lane-cue-icon{font-size:34px;line-height:1.05}.lane-cue{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;background:rgba(255,255,255,.96);border-radius:12px;box-shadow:var(--shadow);padding:7px 12px;font-size:34px;font-weight:950;color:var(--nav);display:none;min-width:150px;text-align:center}.lane-cue small{display:block;font-size:9px;letter-spacing:.7px;color:var(--muted);font-weight:900;margin-top:-5px}
@media(min-width:800px){.panel{width:440px;right:auto}.topbar{left:18px;right:18px}.instruction{left:18px;right:18px}.routebar{left:18px;right:18px}.bottom{left:18px;right:18px}.lane-cue{bottom:82px}}
.drive-active .topbar{display:none}.start-pulse{width:28px;height:28px;border-radius:50%;background:rgba(255,20,120,.18);border:3px solid #ff1493;box-shadow:0 0 6px #ff1493,0 0 14px #ff1493,0 0 26px rgba(255,20,147,.8);animation:mukPulse 1.15s ease-in-out infinite}@keyframes mukPulse{0%,100%{transform:scale(.72);opacity:.55}50%{transform:scale(1.15);opacity:1}}.neon-route{filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 9px currentColor)}.drive-active .leaflet-control-attribution{opacity:.75}.road-alert{display:none;position:absolute;z-index:1450;left:50%;transform:translateX(-50%);top:132px;background:#fff5d9;color:#6b4b00;border:2px solid #e3bd52;border-radius:12px;padding:9px 13px;box-shadow:var(--shadow);font-weight:900}.road-alert.show{display:block}</style>
</head>
<body>
<div id="app">
<div id="mapViewport"><div id="map"></div></div>
<div class="topbar"><div class="brand">MUK SATNAV 86</div><div class="searchbox"><input id="q" placeholder="Search UK address or postcode"><button onclick="find()">Find</button></div></div>
<div id="driveUI" class="drive-ui" style="display:none"><div id="instruction" class="instruction"></div><div id="routebar" class="routebar"></div><div id="laneCue" class="lane-cue"></div></div>
<div id="panel" class="panel"></div>
<div id="toast" class="toast"></div><div id="speedWarning" class="speed-warning"></div><div id="roadAlert" class="road-alert"></div>
<div id="menu" class="menu"></div>
<div class="bottom"><div id="stats" class="stats" style="display:none"></div><div class="controls"><button id="recenter" class="round" onclick="recenter()" title="Recenter">⌖</button><button class="round" onclick="toggleMenu()" title="Menu">☰</button></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true,zoomControlPosition:'bottomright',touchZoom:true,scrollWheelZoom:true,doubleClickZoom:true,boxZoom:true,keyboard:true}).setView([54.5,-3.4],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routeLayer=null,myMarker=null,destMarker=null,startPulse=null,current=null,watchId=null,routeSteps=[],stepIndex=0,routeGeo=null,routeMeta=null,routeCum=[],voiceOn=true,driveMode=false,lastPos=null,lastReroute=0,offRouteSince=0,wrongWaySince=0,announced={},trafficCache=[],trafficFetchedAt=0,heading=null,speedLimit=null,speedLimitLabel=null,speedLimitFetchedAt=0,roadRuleFetchedAt=0,roadRuleState=null,lastCameraMove=0,mapHeading=0,wakeLock=null,arrivedAnnounced=false,speedChangeState=null,speedChangeFetchedAt=0,speedOverSince=0,speedRingAt=0;
const P=document.getElementById('panel'),UI=document.getElementById('driveUI'),INS=document.getElementById('instruction'),RB=document.getElementById('routebar'),ST=document.getElementById('stats'),TOAST=document.getElementById('toast'),MENU=document.getElementById('menu'),LANE=document.getElementById('laneCue');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=()=>JSON.parse(localStorage.getItem('muk86.saved')||'[]'); const save=a=>localStorage.setItem('muk86.saved',JSON.stringify(a));
function show(x){P.innerHTML=x;P.classList.add('show')} function hide(){P.classList.remove('show')}
function toast(x){TOAST.textContent=x;TOAST.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>TOAST.classList.remove('show'),3000)}
function toggleMenu(){MENU.classList.toggle('show');MENU.innerHTML=`<button onclick="newRoute();toggleMenu()">🚗 New route</button><button onclick="showSaved();toggleMenu()">🏷️ Saved places</button><button onclick="toggleVoice();toggleMenu()">${voiceOn?'🔊 Voice on':'🔇 Voice off'}</button><button onclick="stopNavigation();toggleMenu()">⏹ Stop navigation</button>`}
function formatDistance(m){if(m<1000)return Math.max(5,Math.round(m/5)*5)+' yd';return (m/1609.344).toFixed(m<16093?1:0)+' mi'}
function speak(t){if(!voiceOn||!('speechSynthesis'in window)||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.96;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
function bearing(a,b){const r=Math.PI/180,la=a.lat*r,lb=b.lat*r,dl=(b.lon-a.lon)*r;return (Math.atan2(Math.sin(dl)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dl))*180/Math.PI+360)%360}
function angleDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d}
function hav(a,b){const R=6371000,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lon-a.lon)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function nearestOnRoute(p){if(!routeGeo?.coordinates?.length)return {d:Infinity,index:0,point:null};const cs=routeGeo.coordinates;let best={d:Infinity,index:0,point:null};const lat0=p.lat*Math.PI/180,cl=Math.cos(lat0);for(let i=0;i<cs.length-1;i++){const a={lat:cs[i][1],lon:cs[i][0]},b={lat:cs[i+1][1],lon:cs[i+1][0]};const ax=(a.lon-p.lon)*cl,ay=a.lat-p.lat,bx=(b.lon-p.lon)*cl,by=b.lat-p.lat,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,(-ax*dx- ay*dy)/(dx*dx+dy*dy||1)));const q={lat:p.lat+(ay+t*dy),lon:p.lon+(ax+t*dx)/cl};const d=hav(p,q);if(d<best.d)best={d,index:i,point:q}}return best}
function routeBearingAt(index){if(!routeGeo?.coordinates?.length)return null;const cs=routeGeo.coordinates;const i=Math.min(Math.max(index,0),cs.length-2);return bearing({lat:cs[i][1],lon:cs[i][0]},{lat:cs[i+1][1],lon:cs[i+1][0]})}
function maneuverLabel(st){const m=st?.maneuver||{};const t=m.type||'';const mod=m.modifier||'';if(t==='arrive')return 'You have arrived';if(t==='depart')return 'Continue ahead';if(t==='roundabout'||t==='rotary'){const ex=m.exit||st?.exit;if(ex)return `Take the ${ordinal(ex)} exit`;return mod==='left'?'Take the roundabout left':'Take the roundabout';}if(t==='fork')return mod==='left'?'Keep left':'Keep right';if(t==='merge')return mod==='left'?'Merge left':'Merge right';if(t==='on ramp')return mod==='left'?'Take the slip road left':'Take the slip road right';if(t==='off ramp')return mod==='left'?'Take the exit left':'Take the exit right';if(t==='new name')return 'Continue';if(mod==='left')return 'Turn left';if(mod==='right')return 'Turn right';if(mod==='slight left')return 'Keep left';if(mod==='slight right')return 'Keep right';if(mod==='sharp left')return 'Turn sharp left';if(mod==='sharp right')return 'Turn sharp right';return 'Continue ahead'}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function stepDistance(st){return Math.max(0,st?st._distance||st.distance||0:0)}
function roadName(st){return st?.name||st?.ref||''}
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search service unavailable');return r.json()}
async function find(){const q=document.getElementById('q').value.trim();if(!q)return;show('<b>Searching…</b>');try{const d=await geo(q);if(!d.length){show('<b>No UK result found</b><div class="small">Try a full address or postcode.</div>');return}show(d.map(x=>`<div class="item"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='selectPlace(${JSON.stringify(x)})'>Select</button><button class="secondary" onclick='routeTo(${JSON.stringify(x)})'>Route</button></div></div>`).join(''))}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function selectPlace(x){current={lat:+x.lat,lon:+x.lon,name:x.display_name};map.setView([current.lat,current.lon],17);if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([current.lat,current.lon]).addTo(map);show(`<b>${esc(current.name.split(',')[0])}</b><div class="small">${esc(current.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(current)})'>🚗 Route here</button><button class="secondary" onclick='savePlace(${JSON.stringify(current)})'>Save</button></div>`)}
function savePlace(p){let a=saved();if(!a.some(x=>hav(x,p)<15))a.push({...p,id:Date.now()});save(a);toast('Place saved');}
function showSaved(){const a=saved();show('<b>Saved places</b>'+ (a.length?a.map(x=>`<div class="item"><b>${esc(x.name.split(',')[0])}</b><div class="small">${esc(x.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(x)})'>Route</button><button class="danger" onclick='deleteSaved(${x.id})'>Delete</button></div></div>`).join(''):'<div class="small">Nothing saved yet.</div>'))}
function deleteSaved(id){save(saved().filter(x=>x.id!==id));showSaved()}
function newRoute(){current=null;hide();document.getElementById('q').focus()}
function routeTo(p){current={lat:+p.lat,lon:+p.lon,name:p.name||p.display_name};useLocationForRoute()}
function useLocationForRoute(){if(!navigator.geolocation){manualStart();return}show('<b>Getting your location…</b><div class="small">High-accuracy GPS is required for live navigation.</div>');navigator.geolocation.getCurrentPosition(async pos=>{try{await buildRoute({lat:pos.coords.latitude,lon:pos.coords.longitude},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}},()=>manualStart(),{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function manualStart(){show(`<b>Starting point</b><div class="searchbox" style="box-shadow:none;border:1px solid #ddd;margin-top:8px"><input id="start" placeholder="Start postcode or address"><button onclick="manualRoute()">Go</button></div>`)}
async function manualRoute(){const q=document.getElementById('start').value.trim();if(!q)return;try{const d=await geo(q);if(!d.length)throw Error('Starting point not found');await buildRoute({lat:+d[0].lat,lon:+d[0].lon},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
function routeRemainingFromIndex(i){if(!routeCum.length)return routeMeta?.distance||0;return Math.max(0,(routeCum[routeCum.length-1]||0)-(routeCum[Math.max(0,Math.min(i,routeCum.length-1))]||0))}
function routeRemaining(p){if(!routeGeo)return routeMeta?.distance||0;const n=nearestOnRoute(p);return routeRemainingFromIndex(n.index)}
function updateRouteColour(p){if(!routeLayer||!routeMeta)return;const rem=routeRemaining(p),total=Math.max(1,routeMeta.distance),ratio=Math.max(0,Math.min(1,rem/total));let c=ratio>.70?'#ff1744':ratio>.40?'#ff5a00':ratio>.18?'#ffe600':'#39ff14';routeLayer.setStyle({color:c,weight:8,opacity:.98,className:'neon-route'});routeLayer._mukColour=c;if(startPulse){startPulse.setIcon(L.divIcon({className:'',html:`<div class="start-pulse" style="border-color:${c};box-shadow:0 0 6px ${c},0 0 14px ${c},0 0 26px ${c}"></div>`,iconSize:[28,28],iconAnchor:[14,14]}))}}
function updateStartPulse(p){if(!routeGeo)return;const n=nearestOnRoute(p);if(!n.point)return;if(!startPulse){startPulse=L.marker([n.point.lat,n.point.lon],{icon:L.divIcon({className:'',html:'<div class="start-pulse"></div>',iconSize:[28,28],iconAnchor:[14,14]}),interactive:false,zIndexOffset:900}).addTo(map)}else startPulse.setLatLng([n.point.lat,n.point.lon]);}
async function requestWakeLock(){if(!('wakeLock' in navigator)||!driveMode)return;try{if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null});}catch(e){wakeLock=null}}
async function buildRoute(a,dest,startLive=false){
 const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=true`;
 const r=await fetch(u);if(!r.ok)throw Error('Routing service unavailable');
 const j=await r.json();if(j.code!=='Ok')throw Error('No driving route found');
 const rt=j.routes[0];routeMeta={distance:rt.distance,duration:rt.duration};routeGeo=rt.geometry;
 routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]);stepIndex=0;let cum=0;routeCum=[0];
 routeSteps.forEach(s=>{s._startDist=cum;s._distance=s.distance||0;cum+=s.distance||0});for(let i=1;i<routeGeo.coordinates.length;i++){const a=routeGeo.coordinates[i-1],b=routeGeo.coordinates[i];cum=routeCum[i-1]+hav({lat:a[1],lon:a[0]},{lat:b[1],lon:b[0]});routeCum[i]=cum;}
 if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(rt.geometry,{style:{color:'#ff1744',weight:8,opacity:.98,className:'neon-route'}}).addTo(map);if(startPulse){map.removeLayer(startPulse);startPulse=null}
 if(destMarker)destMarker.setLatLng([dest.lat,dest.lon]);else destMarker=L.marker([dest.lat,dest.lon]).addTo(map);
 if(!myMarker)myMarker=L.marker([a.lat,a.lon],{icon:carIcon(),zIndexOffset:1000}).addTo(map);else myMarker.setLatLng([a.lat,a.lon]);
 driveMode=true;map.fitBounds(routeLayer.getBounds(),{padding:[110,110],maxZoom:17});document.body.classList.add('drive-active');UI.style.display='block';
 resetNavigationState();
 hide();
 const initialNear=nearestOnRoute(a); const initialHeading=routeBearingAt(initialNear.index)??0; map.setView(lookAheadCenter(a,initialHeading),17,{animate:false}); setMapRotation(initialHeading); updateStartPulse(a); updateRouteColour(a); requestWakeLock();
 initialiseActiveStep(a);
 renderDrive(a);
 if(startLive)startTracking();
 speak('Route planned. '+formatDistance(rt.distance)+' to go.');
}
function resetNavigationState(){announced={};offRouteSince=0;wrongWaySince=0;speedLimit=null;speedLimitLabel=null;speedLimitFetchedAt=0;roadRuleFetchedAt=0;roadRuleState=null;mapHeading=0;arrivedAnnounced=false;speedChangeState=null;speedChangeFetchedAt=0;speedOverSince=0;speedRingAt=0;}
function distanceToStep(p,st){const loc=st?.maneuver?.location;if(loc)return hav(p,{lat:loc[1],lon:loc[0]});return stepDistance(st);}
function mph(v){return Math.max(0,Math.round(v*2.236936));}
function parseSpeedLimit(v){if(v==null)return null;const x=String(v).toLowerCase().trim();if(!x||['none','signals','variable'].includes(x))return null;if(x==='national'||x==='nsl'){speedLimitLabel='NSL';return null}const n=x.match(/\d+(?:\.\d+)?/);if(n){speedLimitLabel=Math.round(parseFloat(n[0]))+' mph';return Math.round(parseFloat(n[0]));}return null;}
function speedChangeRing(){
  if(Date.now()-speedRingAt<7000)return; speedRingAt=Date.now();
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const now=ctx.currentTime;const gain=ctx.createGain();gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.16,now+0.02);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.42);gain.connect(ctx.destination);const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(880,now);o.frequency.exponentialRampToValueAtTime(660,now+0.18);o.connect(gain);o.start(now);o.stop(now+0.44);setTimeout(()=>{try{ctx.close()}catch(e){}},700)}catch(e){}
}
function updateSpeedWarning(speed){
 const el=document.getElementById('speedWarning');
 if(!speedLimit||speed<1){el.classList.remove('show');speedOverSince=0;return}
 const over=speed>speedLimit+3;
 if(over){
   if(!speedOverSince)speedOverSince=Date.now();
   if(Date.now()-speedOverSince>=1800){el.textContent=`MATE, YOU'RE DRIVING TOO FAST — ${mph(speed)} mph / ${speedLimit} mph limit`;el.classList.add('show');speedChangeRing();}
 }else{speedOverSince=0;el.classList.remove('show')}
}
function routePointAhead(p,metres){
 if(!routeGeo?.coordinates?.length)return null; const near=nearestOnRoute(p); let idx=near.index; let cur=near.point||p; let left=Math.max(0,metres);
 while(idx<routeGeo.coordinates.length-1){const c=routeGeo.coordinates[idx+1];const next={lat:c[1],lon:c[0]};const d=hav(cur,next);if(d>=left){const f=d?left/d:0;return {lat:cur.lat+(next.lat-cur.lat)*f,lon:cur.lon+(next.lon-cur.lon)*f,index:idx};}left-=d;cur=next;idx++;}
 const c=routeGeo.coordinates[routeGeo.coordinates.length-1];return {lat:c[1],lon:c[0],index:routeGeo.coordinates.length-2};
}
async function checkUpcomingSpeedChange(p){
 if(!routeGeo?.coordinates?.length||Date.now()-speedChangeFetchedAt<12000)return;
 speedChangeFetchedAt=Date.now();
 const ahead=routePointAhead(p,180); if(!ahead)return;
 try{const q=`[out:json][timeout:7];way(around:75,${ahead.lat},${ahead.lon})[highway];out tags geom;`;const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)return;const j=await r.json();let best=null;for(const w of (j.elements||[])){const g=w.geometry||[];for(let i=1;i<g.length;i++){const z=roadSegmentDistance(ahead,{lat:g[i-1].lat,lon:g[i-1].lon},{lat:g[i].lat,lon:g[i].lon});if(!best||z.d<best.d)best={d:z.d,tags:w.tags||{}};}}
   if(!best||best.d>45)return; const upcoming=parseSpeedLimit(best.tags.maxspeed); if(!upcoming||!speedLimit||upcoming===speedLimit)return;
   const key=`speed-change-${upcoming}-${Math.round(ahead.lat*1e4)}-${Math.round(ahead.lon*1e4)}`;
   if(speedChangeState?.key===key)return; speedChangeState={key,limit:upcoming};
   speak('Mate, road speed changes ahead.');
   setTimeout(()=>{if(speedChangeState?.key!==key)return; const dir=upcoming<speedLimit?'lower':'higher'; speak(dir==='lower'?`Mate, you're approaching a new speed limit. If you're driving too fast, slow down.`:`Mate, you're approaching a higher speed limit. Drive safely.`)},1400);
 }catch(e){}
}

function updateStats(p){const speed=mph(p?.speed||0), lim=speedLimit;ST.style.display='flex';const rem=lastPos?routeRemaining(lastPos):routeMeta.distance;const eta=Math.max(0,Math.round((routeMeta.duration||0)*(rem/Math.max(1,routeMeta.distance))/60));ST.innerHTML=`<div class="stat"><b>${speed} mph</b><small>SPEED</small></div><div class="stat limit ${lim&&speed>lim+3?'over':''}"><b>${lim?lim+' mph':(speedLimitLabel||'—')}</b><small>SPEED LIMIT</small></div><div class="stat"><b>${formatDistance(rem)}</b><small>REMAINING</small></div><div class="stat"><b>${eta} min</b><small>ETA</small></div>`;updateSpeedWarning(p?.speed||0);}
function setMapRotation(h){if(!driveMode||h==null)return;let d=((h%360)+360)%360;mapHeading=d;document.getElementById('mapViewport').style.transform=`scale(1) rotate(${-d}deg)`;const el=myMarker?.getElement?.();const car=el?.querySelector('.car-arrow');if(car)car.style.transform=`rotate(${d}deg)`;}
function smoothHeading(a,b){if(a==null)return b;if(b==null)return a;let d=((b-a+540)%360)-180;return (a+d*.22+360)%360;}
function lookAheadCenter(p,h){if(h==null)return [p.lat,p.lon];const dist=45;const r=dist/111320,lonr=dist/(111320*Math.cos(p.lat*Math.PI/180));return [p.lat+Math.cos(h*Math.PI/180)*r,p.lon+Math.sin(h*Math.PI/180)*lonr];}
function resetRoadAlert(){const el=document.getElementById('roadAlert');el.classList.remove('show');}
function showRoadAlert(msg){const el=document.getElementById('roadAlert');el.textContent=msg;el.classList.add('show');}
function roadSegmentDistance(p,a,b){const meanLat=p.lat*Math.PI/180, x1=(a.lon-p.lon)*Math.cos(meanLat),y1=a.lat-p.lat,x2=(b.lon-p.lon)*Math.cos(meanLat),y2=b.lat-p.lat;const dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,(0-x1)*dx+(0-y1)*dy)/(dx*dx+dy*dy||1));const q={lat:p.lat+(y1+t*dy),lon:p.lon+(x1+t*dx)/Math.cos(meanLat)};return {d:hav(p,q),q};}
async function roadDataCheck(p){if(Date.now()-roadRuleFetchedAt<12000)return;roadRuleFetchedAt=Date.now();try{const q=`[out:json][timeout:7];(way(around:90,${p.lat},${p.lon})[highway];node(around:120,${p.lat},${p.lon})[traffic_sign~"GB:616",i];);out tags geom;`;const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)return;const j=await r.json();const noEntry=(j.elements||[]).filter(e=>e.type==='node'&&String(e.tags?.traffic_sign||'').toUpperCase().includes('GB:616'));if(noEntry.length&&p.heading!=null){for(const n of noEntry){const d=hav(p,{lat:n.lat,lon:n.lon}),b=bearing(p,{lat:n.lat,lon:n.lon});if(d<90&&angleDiff(p.heading,b)<40){showRoadAlert('⚠ NO-ENTRY SIGN AHEAD');const key='noentry-'+Math.round(n.lat*1e5)+'-'+Math.round(n.lon*1e5);if(!announced[key]){announced[key]=1;speak('Warning. No entry sign ahead.');}break;}}}let best=null;for(const w of (j.elements||[])){const g=w.geometry||[];for(let i=1;i<g.length;i++){const z=roadSegmentDistance(p,{lat:g[i-1].lat,lon:g[i-1].lon},{lat:g[i].lat,lon:g[i].lon});if(!best||z.d<best.d)best={d:z.d,tags:w.tags||{},a:g[i-1],b:g[i]};}}if(!best||best.d>45)return;const t=best.tags||{};speedLimit=parseSpeedLimit(t.maxspeed)||speedLimit;const one=t.oneway;let wrongOneWay=false;if(['yes','true','1'].includes(String(one).toLowerCase())){const rb=bearing(best.a,best.b);wrongOneWay=angleDiff(p.heading||rb,rb)>115;}else if(String(one).toLowerCase()==='-1'){const rb=bearing(best.b,best.a);wrongOneWay=angleDiff(p.heading||rb,rb)>115;}roadRuleState={wrongOneWay,road:t.name||t.ref||'',oneway:one,access:t.access||'',vehicle:t.vehicle||'',highway:t.highway||''};if(wrongOneWay){showRoadAlert('⚠ WRONG-WAY / NO-ENTRY ROAD');const key='oneway-warning';if(!announced[key]){announced[key]=1;speak('Warning. You appear to be travelling against the road direction.');}}else if(['no','private'].includes(String(t.access||'').toLowerCase())||['no','private'].includes(String(t.vehicle||'').toLowerCase())){showRoadAlert('⚠ ROAD ACCESS RESTRICTION');}else resetRoadAlert();}catch(e){}}
async function speedLimitCheck(p){if(Date.now()-speedLimitFetchedAt<15000)return;speedLimitFetchedAt=Date.now();await roadDataCheck(p);}
function startTracking(){if(!navigator.geolocation)return;if(watchId!==null)navigator.geolocation.clearWatch(watchId);requestWakeLock();watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:0,timeout:20000});toast('Live navigation started')}
function stopNavigation(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}driveMode=false;hide();document.body.classList.remove('drive-active');UI.style.display='none';ST.style.display='none';INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');document.getElementById('speedWarning').classList.remove('show');resetRoadAlert();document.getElementById('mapViewport').style.transform='scale(1) rotate(0deg)';if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}if('speechSynthesis'in window)speechSynthesis.cancel();toast('Navigation stopped')}
function recenter(){if(lastPos){const c=lookAheadCenter(lastPos,lastPos.heading);map.setView(c,17,{animate:false});setMapRotation(lastPos.heading)}}
function onPositionError(e){if(e.code===1)toast('Allow Location for MUK SATNAV 86');else toast('GPS signal unavailable')}
async function onPosition(pos){
 const p={lat:pos.coords.latitude,lon:pos.coords.longitude};p.accuracy=pos.coords.accuracy||999;p.speed=Number.isFinite(pos.coords.speed)?Math.max(0,pos.coords.speed):0;
 const rawHeading=Number.isFinite(pos.coords.heading)&&pos.coords.heading>=0?pos.coords.heading:(lastPos?bearing(lastPos,p):null);p.heading=smoothHeading(lastPos?.heading,rawHeading);lastPos=p;
 const near=nearestOnRoute(p); const snapped=(near.point&&near.d<65)?near.point:{lat:p.lat,lon:p.lon};
 if(!myMarker)myMarker=L.marker([snapped.lat,snapped.lon],{icon:carIcon(),zIndexOffset:1000}).addTo(map);else myMarker.setLatLng([snapped.lat,snapped.lon]);
 let navHeading=p.heading; if((p.speed<2||navHeading==null)&&routeGeo){navHeading=routeBearingAt(near.index);} if(navHeading!=null){setMapRotation(navHeading);const c=lookAheadCenter(snapped,navHeading);map.setView(c,Math.max(16,map.getZoom()),{animate:false});}
 updateStartPulse(p);updateRouteColour(p);requestWakeLock();
 await speedLimitCheck(p);await checkUpcomingSpeedChange(p);updateStats(p);
 if(!routeSteps.length)return;await navigationEngine(p);
}
async function navigationEngine(p){
 const near=nearestOnRoute(p);
 if(near.d>65){
   if(!offRouteSince)offRouteSince=Date.now();
   if(Date.now()-offRouteSince>2200&&Date.now()-lastReroute>9000){
     toast('Off route — recalculating'); speak('You are off route. Recalculating.'); lastReroute=Date.now();
     try{await buildRoute(p,current,true);offRouteSince=0;return}catch(e){toast('Unable to recalculate right now')}
   }
 }else offRouteSince=0;
 const rb=routeBearingAt(near.index);
 if(p.heading!=null&&near.d<50&&rb!=null&&angleDiff(p.heading,rb)>115&&p.speed>2){
   if(!wrongWaySince)wrongWaySince=Date.now();
   if(Date.now()-wrongWaySince>1800&&Date.now()-lastReroute>9000){
     toast('Wrong direction — recalculating'); speak('Wrong direction. Recalculating.'); lastReroute=Date.now();
     try{await buildRoute(p,current,true);wrongWaySince=0;return}catch(e){}
   }
 }else wrongWaySince=0;
 let st=routeSteps[stepIndex]; if(!st)return;
 const distTo=distanceToStep(p,st), type=st.maneuver?.type||'';
 // Advance only when the vehicle has actually reached the manoeuvre, never while parked at route start.
 if(actionableStep(st)&&distTo<28&&stepIndex<routeSteps.length-1){
   stepIndex++;
   while(stepIndex<routeSteps.length-1&&!actionableStep(routeSteps[stepIndex]))stepIndex++;
   const n=routeSteps[stepIndex],key='step'+stepIndex;
   if(!announced[key]){announced[key]=1;speak(announcementForStep(n));}
   renderDrive(p); return;
 }
 // Ignore the artificial depart step for spoken/displayed manoeuvre warnings.
 if(!actionableStep(st)){renderDrive(p);return;}
 const key='warn'+stepIndex;
 const thresholds=(type==='roundabout'||type==='rotary')?[650,250,55]:[650,250,55];
 if(distTo<thresholds[0]&&!announced[key+'a']){
   announced[key+'a']=1;
   const txt=type==='roundabout'||type==='rotary'?`Roundabout ahead in ${formatDistance(distTo)}. ${mannerRoundabout(st)}`:`Junction ahead in ${formatDistance(distTo)}. ${manner(st)}${roadName(st)?' onto '+roadName(st):''}.`;
   speak(txt);
 }
 if(distTo<thresholds[1]&&!announced[key+'b']){announced[key+'b']=1;speak(type==='roundabout'||type==='rotary'?mannerRoundabout(st):`${manner(st)} in ${formatDistance(distTo)}.`)}
 if(distTo<thresholds[2]&&!announced[key+'c']){announced[key+'c']=1;speak(type==='roundabout'||type==='rotary'?mannerRoundabout(st):manner(st)+' now.')}
 await trafficLightAlert(p); await roadDataCheck(p); renderDrive(p);
 if(type==='arrive'&&distTo<28&&!arrivedAnnounced){arrivedAnnounced=true;speak("Mate, you made it to your destination. Good work!");toast("Mate, you made it to your destination. Good work!");INS.innerHTML=`<div class="arrow">✓</div><div class="ins-main"><div class="big">MATE, YOU MADE IT!</div><div class="sub">Good work — destination reached</div></div><div class="distance">0 yd</div>`;INS.classList.add('show');}
}

function manner(st){return maneuverLabel(st).toLowerCase()}
function mannerRoundabout(st){const ex=st.maneuver?.exit;return ex?`take the ${ordinal(ex)} exit`:'take the correct exit'}
async function trafficLightAlert(p){if(Date.now()-trafficFetchedAt>30000){try{const q=`[out:json][timeout:8];node(around:180,${p.lat},${p.lon})[highway=traffic_signals];out;`;const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(r.ok){const j=await r.json();trafficCache=(j.elements||[]).map(e=>({lat:e.lat,lon:e.lon}));trafficFetchedAt=Date.now()}}catch(e){}}if(!trafficCache.length||p.heading==null)return;for(const l of trafficCache){const d=hav(p,l);if(d>25&&d<180){const b=bearing(p,l);if(angleDiff(p.heading,b)<35){const near=nearestOnRoute(l);const carNear=nearestOnRoute(p);if(near.d<45&&near.index>=carNear.index){const key='light'+Math.round(l.lat*1e5)+'_'+Math.round(l.lon*1e5);if(!announced[key]){announced[key]=1;speak(`Traffic lights ahead in ${formatDistance(d)}.`)}return}}}}}

function carIcon(){
 const html='<div class="car-arrow" style="width:38px;height:52px;display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));transform-origin:center">▲</div>';
 return L.divIcon({className:'muk-car',html,iconSize:[38,52],iconAnchor:[19,26]});
}
function actionableStep(st){
 const t=st?.maneuver?.type||'';
 return !['depart','arrive','new name'].includes(t);
}
function initialiseActiveStep(p){
 stepIndex=0;
 while(stepIndex<routeSteps.length && !actionableStep(routeSteps[stepIndex])) stepIndex++;
 if(stepIndex>=routeSteps.length) stepIndex=Math.max(0,routeSteps.length-1);
 // If the first actionable step is already behind the starting GPS point, advance once.
 while(stepIndex<routeSteps.length-1){
   const d=distanceToStep(p,routeSteps[stepIndex]);
   if(d>20) break;
   stepIndex++;
 }
 announced={};
}
function announcementForStep(st){
 const t=st?.maneuver?.type||'', m=st?.maneuver?.modifier||'';
 if(t==='roundabout'||t==='rotary') return mannerRoundabout(st);
 if(t==='on ramp') return m==='left'?'take the slip road left':m==='right'?'take the slip road right':'take the slip road';
 if(t==='off ramp') return m==='left'?'take the slip road left':m==='right'?'take the slip road right':'take the exit';
 return maneuverLabel(st).toLowerCase();
}
function laneMarkup(st){
 const lanes=st?.intersections?.[0]?.lanes;
 if(!Array.isArray(lanes)||!lanes.length)return '';
 const valid=lanes.filter(l=>l?.valid);
 if(!valid.length)return '';
 return '<div class="lane-cue-icon">'+valid.map(l=>{const a=l.indications||[];return a.includes('straight')?'↑':a.includes('slight right')?'↗':a.includes('right')?'→':a.includes('slight left')?'↖':a.includes('left')?'←':'↑'}).join(' ')+'</div><small>USE THE MARKED LANE</small>';
}
function renderDrive(p){
 if(!driveMode||!routeSteps.length)return;
 let st=routeSteps[Math.min(stepIndex,routeSteps.length-1)];
 // Skip non-actionable steps so the display never sits on a useless "continue" instruction.
 while(st && !actionableStep(st) && stepIndex<routeSteps.length-1){stepIndex++;st=routeSteps[stepIndex];}
 if(!st){INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');return;}
 const d=distanceToStep(p,st), t=st.maneuver?.type||'', text=maneuverLabel(st);
 // Keep the large instruction hidden until the manoeuvre is genuinely approaching.
 const visible=d<=750 || t==='arrive';
 if(!visible){INS.classList.remove('show');RB.classList.remove('show');LANE.classList.remove('show');return;}
 INS.innerHTML=`<div class="arrow">${maneuverArrow(st)}</div><div class="ins-main"><div class="big">${esc(text)}</div><div class="sub">${esc(roadName(st)||'Follow the route')}</div></div><div class="distance">${esc(formatDistance(d))}</div>`;
 INS.classList.add('show');
 RB.innerHTML=`<span class="nextroad">${esc(roadName(st)||'Next manoeuvre')}</span><span><b>${esc(formatDistance(d))}</b></span>`;
 RB.classList.add('show');
 const lm=laneMarkup(st);
 if(lm&&d<350){LANE.innerHTML=lm;LANE.classList.add('show')}else LANE.classList.remove('show');
}
function maneuverArrow(st){
 const t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';
 if(t==='roundabout'||t==='rotary')return '↻';
 if(t==='on ramp'||t==='off ramp')return m==='left'?'↖':m==='right'?'↗':'↑';
 if(m==='left'||m==='sharp left')return '←';
 if(m==='right'||m==='sharp right')return '→';
 if(m==='slight left')return '↖';
 if(m==='slight right')return '↗';
 return '↑';
}

document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&driveMode)requestWakeLock()});
</script>
</body>
