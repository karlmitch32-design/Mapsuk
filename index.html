let routeLayer=null,myMarker=null,destMarker=null,startPulse=null,current=null,watchId=null,routeSteps=[],stepIndex=0,routeGeo=null,routeMeta=null,routeCum=[],voiceOn=true,driveMode=false,lastPos=null,lastReroute=0,offRouteSince=0,wrongWaySince=0,announced={},heading=null,speedLimit=null,speedLimitLabel=null,speedLimitFetchedAt=0,roadRuleFetchedAt=0,roadRuleState=null,lastCameraMove=0,mapHeading=0,wakeLock=null,arrivedAnnounced=false,speedChangeState=null,speedChangeFetchedAt=0,speedOverSince=0,speedRingAt=0,trafficLightState={seen:new Set(),lastFetchedAt:0};

function toggleMenu(){MENU.classList.toggle('show');MENU.innerHTML=`<button onclick="newRoute();toggleMenu()">🚗 New route</button><button onclick="showSaved();toggleMenu()">🏷️ Saved places</button><button onclick="toggleVoice();toggleMenu()">${voiceOn?'🔊 Voice guidance on':'🔇 Voice guidance off'}</button><button onclick="stopNavigation();toggleMenu()">⏹ Stop navigation</button>`}
function formatDistance(m){if(m<1000)return Math.max(5,Math.round(m/5)*5)+' yd';return (m/1609.344).toFixed(m<16093?1:0)+' mi'}
function armAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();}}catch(e){}}
function toggleVoice(){voiceOn=!voiceOn;if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel();toast(voiceOn?'Voice guidance on':'Voice guidance off')}
function smoothHeading(a,b){if(a==null)return b;if(b==null)return a;let d=((b-a+540)%360)-180;return (a+d*.28+360)%360;}
function lookAheadCenter(p,h){if(!p)return null;if(h==null)return [p.lat,p.lon];const dist=45,r=dist/111320,lonr=dist/(111320*Math.cos(p.lat*Math.PI/180));return [p.lat+Math.cos(h*Math.PI/180)*r,p.lon+Math.sin(h*Math.PI/180)*lonr];}

function setMapRotation(h){if(h==null)return;mapHeading=((h%360)+360)%360;const vp=document.getElementById('mapViewport');const rot=orientationMode==='north'?0:-mapHeading;if(vp)vp.style.transform=`scale(1.06) rotate(${rot}deg)`;const el=myMarker?.getElement?.();const car=el?.querySelector('.car-arrow');if(car)car.style.transform=`rotate(${mapHeading}deg)`;}
function showRoadAlert(msg){const el=document.getElementById('roadAlert');if(el){el.textContent=msg;el.classList.add('show')}}

function roadSegmentDistance(p,a,b){const meanLat=p.lat*Math.PI/180,cosLat=Math.cos(meanLat)||1,x1=(a.lon-p.lon)*cosLat,y1=a.lat-p.lat,x2=(b.lon-p.lon)*cosLat,y2=b.lat-p.lat,dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,(-x1*dx-y1*dy)/(dx*dx+dy*dy||1))),q={lat:p.lat+y1+t*dy,lon:p.lon+(x1+t*dx)/cosLat};return {d:hav(p,q),q};}
function updateStats(p){if(!routeMeta)return;const speed=mph(p?.speed||0),lim=speedLimit,rem=p?routeRemaining(p):routeMeta.distance,total=Math.max(1,routeMeta.distance),eta=Math.max(0,Math.round((routeMeta.duration||0)*(rem/total)/60));ST.style.display='flex';ST.innerHTML=`<div class=\"stat\"><b>${speed} mph</b><small>SPEED</small></div><div class=\"stat limit ${lim&&speed>lim+3?'over':''}\"><b>${lim?lim+' mph':(speedLimitLabel||'—')}</b><small>SPEED LIMIT</small></div><div class=\"stat\"><b>${formatDistance(rem)}</b><small>REMAINING</small></div><div class=\"stat\"><b>${eta} min</b><small>ETA</small></div>`;updateSpeedWarning(p?.speed||0);}
let lastSpokenText='',lastSpokenAt=0;
function speak(t,priority=false){if(!voiceOn||!('speechSynthesis'in window)||!t)return;const now=Date.now();if(!priority&&t===lastSpokenText&&now-lastSpokenAt<7000)return;if(!priority&&now-lastSpokenAt<900)return;lastSpokenText=t;lastSpokenAt=now;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.96;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
function bearing(a,b){const r=Math.PI/180,la=a.lat*r,lb=b.lat*r,dl=(b.lon-a.lon)*r;return (Math.atan2(Math.sin(dl)*Math.cos(lb),Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dl))*180/Math.PI+360)%360}
function angleDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d}
function hav(a,b){const R=6371000,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lon-a.lon)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function nearestOnRoute(p){if(!routeGeo?.coordinates?.length)return {d:Infinity,index:0,point:null};const cs=routeGeo.coordinates;let best={d:Infinity,index:0,point:null};const lat0=p.lat*Math.PI/180,cl=Math.cos(lat0);for(let i=0;i<cs.length-1;i++){const a={lat:cs[i][1],lon:cs[i][0]},b={lat:cs[i+1][1],lon:cs[i+1][0]};const ax=(a.lon-p.lon)*cl,ay=a.lat-p.lat,bx=(b.lon-p.lon)*cl,by=b.lat-p.lat,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,(-ax*dx- ay*dy)/(dx*dx+dy*dy||1)));const q={lat:p.lat+(ay+t*dy),lon:p.lon+(ax+t*dx)/cl};const d=hav(p,q);if(d<best.d)best={d,index:i,point:q}}return best}
function routeBearingAt(index){if(!routeGeo?.coordinates?.length)return null;const cs=routeGeo.coordinates;const i=Math.min(Math.max(index,0),cs.length-2);return bearing({lat:cs[i][1],lon:cs[i][0]},{lat:cs[i+1][1],lon:cs[i+1][0]})}
function maneuverLabel(st){
 const m=st?.maneuver||{},t=m.type||'',mod=m.modifier||'';
 if(t==='arrive')return 'You have arrived';
 const idx=routeSteps.indexOf(st),commercial=commercialInstruction(st,idx);
 if(commercial)return commercial;
 if(t==='depart')return 'Continue ahead';
 if(t==='roundabout'||t==='rotary'||t==='exit roundabout'){const ex=m.exit||st?.exit||st?.maneuver?.exit;if(ex)return `Take the ${ordinal(Number(ex))} exit`;return 'Take the roundabout';}
 if(t==='fork')return mod==='left'?'Keep left':'Keep right';
 if(t==='merge')return mod==='left'?'Merge left':'Merge right';
 if(t==='on ramp')return mod==='left'?'Keep left and take the slip road':mod==='right'?'Keep right and take the slip road':'Take the slip road';
 if(t==='off ramp')return mod==='left'?'Keep left and leave the motorway':mod==='right'?'Keep right and leave the motorway':'Take the motorway exit';
 if(t==='new name')return 'Continue';
 if(mod==='left')return 'Turn left';if(mod==='right')return 'Turn right';if(mod==='slight left')return 'Keep left';if(mod==='slight right')return 'Keep right';if(mod==='sharp left')return 'Turn sharp left';if(mod==='sharp right')return 'Turn sharp right';return 'Continue ahead';
}
function ordinal(n){n=Number(n)||1;const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function stepDistance(st){return Math.max(0,st?st._distance||st.distance||0:0)}
function roadName(st){return st?.name||st?.ref||''}
async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=gb&limit=6&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search service unavailable');return r.json()}
async function find(){const q=document.getElementById('q').value.trim();if(!q)return;show('<b>Searching…</b>');try{const d=await geo(q);if(!d.length){show('<b>No UK result found</b><div class="small">Try a full address or postcode.</div>');return}show(d.map(x=>`<div class="item"><b>${esc(x.display_name.split(',')[0])}</b><div class="small">${esc(x.display_name)}</div><div class="actions"><button onclick='selectPlace(${JSON.stringify(x)})'>Select</button><button class="secondary" onclick='routeTo(${JSON.stringify(x)})'>Route</button></div></div>`).join(''))}catch(e){show('<b>Search error</b><div class="small">'+esc(e.message)+'</div>')}}
function selectPlace(x){current={lat:+x.lat,lon:+x.lon,name:x.display_name};map.setView([current.lat,current.lon],17);if(destMarker)map.removeLayer(destMarker);destMarker=L.marker([current.lat,current.lon]).addTo(map);show(`<b>${esc(current.name.split(',')[0])}</b><div class="small">${esc(current.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(current)})'>🚗 Route here</button><button class="secondary" onclick='savePlace(${JSON.stringify(current)})'>Save</button></div>`)}
function savePlace(p){let a=saved();if(!a.some(x=>hav(x,p)<15))a.push({...p,id:Date.now()});save(a);toast('Place saved');}
function showSaved(){const a=saved();show('<b>Saved places</b>'+ (a.length?a.map(x=>`<div class="item"><b>${esc(x.name.split(',')[0])}</b><div class="small">${esc(x.name)}</div><div class="actions"><button onclick='routeTo(${JSON.stringify(x)})'>Route</button><button class="danger" onclick='deleteSaved(${x.id})'>Delete</button></div></div>`).join(''):'<div class="small">Nothing saved yet.</div>'))}
function deleteSaved(id){save(saved().filter(x=>x.id!==id));showSaved()}
function newRoute(){current=null;hide();document.getElementById('q').focus()}
function locateHome(){if(!navigator.geolocation){toast('Location is not available');return}toast('Finding your position…');navigator.geolocation.getCurrentPosition(pos=>{map.setView([pos.coords.latitude,pos.coords.longitude],16,{animate:true});toast('GPS position found')},()=>toast('Allow Location to show your position'),{enableHighAccuracy:true,maximumAge:10000,timeout:12000})}
function routeTo(p){current={lat:+p.lat,lon:+p.lon,name:p.name||p.display_name};useLocationForRoute()}
function useLocationForRoute(){if(!navigator.geolocation){manualStart();return}showRouteLoader('Finding your position…');navigator.geolocation.getCurrentPosition(async pos=>{try{await buildRoute({lat:pos.coords.latitude,lon:pos.coords.longitude},current,true)}catch(e){hideRouteLoader();show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}},()=>{hideRouteLoader();manualStart()},{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function manualStart(){show(`<b>Starting point</b><div class="searchbox" style="box-shadow:none;border:1px solid #ddd;margin-top:8px"><input id="start" placeholder="Start postcode or address"><button onclick="manualRoute()">Go</button></div>`)}
async function manualRoute(){const q=document.getElementById('start').value.trim();if(!q)return;try{const d=await geo(q);if(!d.length)throw Error('Starting point not found');await buildRoute({lat:+d[0].lat,lon:+d[0].lon},current,true)}catch(e){show('<b>Route error</b><div class="small">'+esc(e.message)+'</div>')}}
function routeRemainingFromIndex(i){if(!routeCum.length)return routeMeta?.distance||0;return Math.max(0,(routeCum[routeCum.length-1]||0)-(routeCum[Math.max(0,Math.min(i,routeCum.length-1))]||0))}
function routeRemaining(p){if(!routeGeo)return routeMeta?.distance||0;const n=nearestOnRoute(p);return routeRemainingFromIndex(n.index)}
function updateRouteColour(p){if(!routeLayer||!routeMeta)return;const rem=routeRemaining(p),total=Math.max(1,routeMeta.distance),ratio=Math.max(0,Math.min(1,rem/total));let c='#1e73e8';routeLayer.setStyle({color:c,weight:7,opacity:.96,lineCap:'round',lineJoin:'round',className:'pro-route'});routeLayer._mukColour=c;if(startPulse){startPulse.setIcon(L.divIcon({className:'',html:'<div class="start-pulse"></div>',iconSize:[24,24],iconAnchor:[12,12]}))}}
function updateStartPulse(p){if(!routeGeo)return;const n=nearestOnRoute(p);if(!n.point)return;if(!startPulse){startPulse=L.marker([n.point.lat,n.point.lon],{icon:L.divIcon({className:'',html:'<div class="start-pulse"></div>',iconSize:[28,28],iconAnchor:[14,14]}),interactive:false,zIndexOffset:900}).addTo(map)}else startPulse.setLatLng([n.point.lat,n.point.lon]);}
async function requestWakeLock(){if(!('wakeLock' in navigator)||!driveMode)return;try{if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null});}catch(e){wakeLock=null}}
function showRouteLoader(msg){const x=document.getElementById('routeLoader');const sub=document.getElementById('loaderSub');if(sub)sub.textContent=msg||'Preparing your drive…';if(x)x.classList.add('show');}
function hideRouteLoader(){const x=document.getElementById('routeLoader');if(x)x.classList.remove('show');}
async function buildRoute(a,dest,startLive=false){
 showRouteLoader('Loading road network and navigation data…');
 const dEl=document.getElementById('driveDestination'); if(dEl)dEl.textContent=(current?.name||dest?.name||'Destination').split(',')[0];
 armAudio();
 const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&annotations=true`;
 const r=await fetch(u);if(!r.ok)throw Error('Routing service unavailable');
 const j=await r.json();if(j.code!=='Ok')throw Error('No driving route found');
 const rt=j.routes[0];routeMeta={distance:rt.distance,duration:rt.duration};routeGeo=rt.geometry;
 routeSteps=(rt.legs||[]).flatMap(l=>l.steps||[]);routeSteps.forEach((st,i)=>enrichStep(st,i));stepIndex=0;let cum=0;routeCum=[0];
 routeSteps.forEach(s=>{s._startDist=cum;s._distance=s.distance||0;cum+=s.distance||0});for(let i=1;i<routeGeo.coordinates.length;i++){const a=routeGeo.coordinates[i-1],b=routeGeo.coordinates[i];cum=routeCum[i-1]+hav({lat:a[1],lon:a[0]},{lat:b[1],lon:b[0]});routeCum[i]=cum;} annotateManeuverProgress();
 if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(rt.geometry,{style:{color:'#1e73e8',weight:7,opacity:.96,lineCap:'round',lineJoin:'round',className:'pro-route'}}).addTo(map);if(startPulse){map.removeLayer(startPulse);startPulse=null}
 if(destMarker)destMarker.setLatLng([dest.lat,dest.lon]);else destMarker=L.marker([dest.lat,dest.lon]).addTo(map);
 if(!myMarker)myMarker=L.marker([a.lat,a.lon],{icon:carIcon(),zIndexOffset:1000}).addTo(map);else myMarker.setLatLng([a.lat,a.lon]);
 driveMode=true;document.body.classList.add('drive-active');UI.style.display='block';const hh=document.getElementById('homeHero');if(hh)hh.style.display='none';map.invalidateSize({pan:false});
 resetNavigationState();
 hide();
 const initialNear=nearestOnRoute(a); const initialHeading=routeBearingAt(initialNear.index)??0; map.setView(lookAheadCenter(a,initialHeading),17,{animate:false}); setMapRotation(initialHeading); updateStartPulse(a); updateRouteColour(a); requestWakeLock();
 initialiseActiveStep(a);
 renderDrive(a);
 if(startLive)startTracking();

 speak('Route planned. '+formatDistance(rt.distance)+' to go.');
}
function resetNavigationState(){lastRouteProgress=0;announced={};lastSpokenText='';lastSpokenAt=0;offRouteSince=0;wrongWaySince=0;speedLimit=null;speedLimitLabel=null;speedLimitFetchedAt=0;roadRuleFetchedAt=0;roadRuleState=null;mapHeading=0;arrivedAnnounced=false;speedChangeState=null;speedChangeFetchedAt=0;speedOverSince=0;speedRingAt=0;trafficLightState={seen:new Set(),lastFetchedAt:0};}
function routeProgress(p){
 if(!routeGeo?.coordinates?.length||!routeCum.length)return lastRouteProgress||0;
 const n=nearestOnRoute(p);
 if(!n.point)return lastRouteProgress||0;
 const cs=routeGeo.coordinates,i=Math.max(0,Math.min(n.index,cs.length-2));
 const a={lat:cs[i][1],lon:cs[i][0]},b={lat:cs[i+1][1],lon:cs[i+1][0]},seg=hav(a,b),part=seg?hav(a,n.point)/seg:0;
 const raw=Math.max(0,(routeCum[i]||0)+Math.min(1,Math.max(0,part))*seg);
 // GPS jitter must not move the navigation state backwards.
 if(raw>lastRouteProgress-18)lastRouteProgress=Math.max(lastRouteProgress,raw);
 return lastRouteProgress;
}
function maneuverProgress(st){return Number.isFinite(st?._routeProgress)?st._routeProgress:null}
function routeDistanceToManeuver(p,st){
 const target=maneuverProgress(st),cur=routeProgress(p);
 if(target!=null)return Math.max(0,target-cur);
 const loc=st?.maneuver?.location;if(loc)return hav(p,{lat:loc[1],lon:loc[0]});
 return stepDistance(st);
}
function distanceToStep(p,st){return routeDistanceToManeuver(p,st)}
function indexNearLocation(loc,startIndex=0){
 if(!loc||!routeGeo?.coordinates?.length)return null;
 const cs=routeGeo.coordinates;let best={d:Infinity,index:0,point:null};
 const begin=Math.max(0,Math.min(startIndex,cs.length-2));
 for(let i=begin;i<cs.length-1;i++){
  const a={lat:cs[i][1],lon:cs[i][0]},b={lat:cs[i+1][1],lon:cs[i+1][0]};
  const z=roadSegmentDistance({lat:loc[1],lon:loc[0]},a,b);
  if(z.d<best.d)best={d:z.d,index:i,point:z.q};
  if(i>begin+80&&z.d>best.d+120)break;
 }
 return best;
}
function annotateManeuverProgress(){
 let start=0;
 for(const st of routeSteps){
  const loc=st?.maneuver?.location,hit=indexNearLocation(loc,start);
  if(hit){
   const cs=routeGeo.coordinates,i=hit.index,a={lat:cs[i][1],lon:cs[i][0]},b={lat:cs[i+1][1],lon:cs[i+1][0]},seg=hav(a,b),part=seg?hav(a,hit.point)/seg:0;
   st._routeIndex=i;st._routeProgress=(routeCum[i]||0)+Math.min(1,Math.max(0,part))*seg;
   start=i;
  }
 }
}

function mph(v){return Math.max(0,Math.round(v*2.236936));}
function parseSpeedLimit(v){
 if(v==null)return null;
 const x=String(v).toLowerCase().trim();
 if(!x||['none','signals','variable','implicit'].includes(x))return null;
 if(x==='national'||x==='nsl'||x.includes('nsl_')||x.includes(':nsl_'))return null;
 const n=x.match(/\d+(?:\.\d+)?/);
 if(n){const value=Math.round(parseFloat(n[0]));if(value>0&&value<=100){return value;}}
 return null;
}
function speedLimitFromTags(t,travelHeading,segA,segB){
 const tags=t||{};
 const wayBearing=(segA&&segB)?bearing(segA,segB):null;
 const reverse=String(tags.oneway||'').toLowerCase()==='-1';
 const roadBearing=reverse&&wayBearing!=null?(wayBearing+180)%360:wayBearing;
 const sameDirection=travelHeading==null||roadBearing==null||angleDiff(travelHeading,roadBearing)<=85;
 const directional=sameDirection?tags['maxspeed:forward']:tags['maxspeed:backward'];
 const directionalValue=parseSpeedLimit(directional);
 if(directionalValue)return {limit:directionalValue,label:directionalValue+' mph',source:'directional'};
 const explicit=parseSpeedLimit(tags.maxspeed);
 if(explicit)return {limit:explicit,label:explicit+' mph',source:'mapped'};
 const typed=String(tags['maxspeed:type']||tags['source:maxspeed']||'').toLowerCase();
 if(typed.includes('gb-wls:nsl_restricted')||typed.includes('gb:wls:nsl_restricted')||typed.includes('gb-wls')&&typed.includes('nsl_restricted'))return {limit:20,label:'20 mph',source:'national-wales-restricted'};
 if(typed.includes('gb:nsl_restricted'))return {limit:30,label:'30 mph',source:'national-restricted'};
 if(typed.includes('gb:nsl_dual')||typed.includes('nsl_dual'))return {limit:70,label:'70 mph',source:'national'};
 if(typed.includes('gb:nsl_single')||typed.includes('nsl_single'))return {limit:60,label:'60 mph',source:'national'};
 if(typed.includes('gb:motorway')||typed.includes('nsl_motorway'))return {limit:70,label:'70 mph',source:'national'};
 const hw=String(tags.highway||'').toLowerCase();

 const ex=Math.max(1,Number(st?.maneuver?.exit||st?.exit||1));
 const count=Math.max(4,Math.min(6,ex+1));
 let paths='',labels='';
 for(let i=1;i<=count;i++){
  const angle=-45+(i-1)*45,rad=angle*Math.PI/180,x=50+40*Math.cos(rad),y=50+40*Math.sin(rad),active=i===ex;
  paths+=`<path class="road ${active?'active':''}" d="M50 50 L${x.toFixed(1)} ${y.toFixed(1)}"/>`;
  labels+=`<text x="${(x+(x-50)*.22).toFixed(1)}" y="${(y+(y-50)*.22+3).toFixed(1)}">${i}</text>`;
 }
 return `<svg class="roundabout-svg" viewBox="0 0 100 100" aria-label="Roundabout exit ${ex}"><circle class="ring" cx="50" cy="50" r="22"/>${paths}${labels}<path class="active" d="M50 82 L50 66"/></svg>`;
}
function maneuverArrow(st){
 const t=st?.maneuver?.type||'',m=st?.maneuver?.modifier||'';
 if(t==='roundabout'||t==='rotary')return roundaboutGraphic(st);
 if(t==='on ramp'||t==='off ramp')return m==='left'?'↖':m==='right'?'↗':'↑';
 if(m==='left'||m==='sharp left')return '←';
 if(m==='right'||m==='sharp right')return '→';
 if(m==='slight left')return '↖';
 if(m==='slight right')return '↗';
 return '↑';
}

document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&driveMode)requestWakeLock()});
</script>
